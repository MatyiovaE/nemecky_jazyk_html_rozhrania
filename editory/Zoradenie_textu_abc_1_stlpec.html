<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Abecedné zoradenie</title>
  <style>
    body {
      font-family: Courier bold, monospace;
      margin: 30px;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 10px;
      resize: vertical;
    }
    button {
      margin-right: 10px;
      padding: 10px 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Zoradenie položiek podľa abecedy</h2>

  <label for="input"><b>Vstupné položky (každá v novom riadku):</b></label><br>
  <textarea id="input" placeholder="Zadajte položky do jednotlivých riadkov."></textarea><br>

  <button onclick="sortItems()">Usporiadať podľa abecedy</button>
  <br><br>

  <label for="output"><b>Zoradené položky:</b></label><br>
  <textarea id="output" readonly placeholder="Tu sa zobrazia zoradené položky."></textarea><br>

  <button onclick="copyToClipboard()">Skopírovať do schránky</button>

  <script>
    function sortItems() {
      const input = document.getElementById('input').value;
      const items = input.split('\n').map(item => item.trim()).filter(item => item !== '');
      const sorted = items.sort((a, b) => a.localeCompare(b, 'sk', { sensitivity: 'base' }));
      document.getElementById('output').value = sorted.join('\n');
    }

    function copyToClipboard() {
      const output = document.getElementById('output');
      output.select();
      output.setSelectionRange(0, 99999); // Pre mobilné zariadenia
      document.execCommand('copy');
      alert('Zoradené položky boli skopírované do schránky.');
    }
  </script>
<br><br>
  <b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025)
<br><br>
</body>
</html>

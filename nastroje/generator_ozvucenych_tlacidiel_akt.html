/* --- Uloženie a načítanie vstupov z localStorage --- */
function saveInputs() {
  try {
    localStorage.setItem("inputText", document.getElementById("inputText").value);
    localStorage.setItem("lang1", document.getElementById("lang1").value);
    localStorage.setItem("lang2", document.getElementById("lang2").value);
    localStorage.setItem("boldColumn", document.getElementById("boldColumn").value);
    localStorage.setItem("subjectInput", document.getElementById("subjectInput").value);
    localStorage.setItem("topicInput", document.getElementById("topicInput").value);
    localStorage.setItem("authorInput", document.getElementById("authorInput").value);
    localStorage.setItem("yearInput", document.getElementById("yearInput").value);
  } catch (e) {}
}

function loadInputs() {
  try {
    if(localStorage.getItem("inputText")) document.getElementById("inputText").value = localStorage.getItem("inputText");
    if(localStorage.getItem("lang1")) document.getElementById("lang1").value = localStorage.getItem("lang1");
    if(localStorage.getItem("lang2")) document.getElementById("lang2").value = localStorage.getItem("lang2");
    if(localStorage.getItem("boldColumn")) document.getElementById("boldColumn").value = localStorage.getItem("boldColumn");
    
    if(localStorage.getItem("subjectInput")) document.getElementById("subjectInput").value = localStorage.getItem("subjectInput");
    else if(localStorage.getItem("titleInput")) document.getElementById("subjectInput").value = localStorage.getItem("titleInput");
    
    if(localStorage.getItem("topicInput")) document.getElementById("topicInput").value = localStorage.getItem("topicInput");
    if(localStorage.getItem("authorInput")) document.getElementById("authorInput").value = localStorage.getItem("authorInput");
    if(localStorage.getItem("yearInput")) document.getElementById("yearInput").value = localStorage.getItem("yearInput");
  } catch (e) {}
}

window.addEventListener("load", loadInputs);
document.querySelectorAll("#inputText, #lang1, #lang2, #boldColumn, #subjectInput, #topicInput, #authorInput, #yearInput")
  .forEach(el => el.addEventListener("input", saveInputs));

function exportJSON() {
  const data = {
    inputText: document.getElementById("inputText").value,
    lang1: document.getElementById("lang1").value,
    lang2: document.getElementById("lang2").value,
    boldColumn: document.getElementById("boldColumn").value,
    subjectInput: document.getElementById("subjectInput").value,
    topicInput: document.getElementById("topicInput").value,
    authorInput: document.getElementById("authorInput").value,
    yearInput: document.getElementById("yearInput").value
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nastavenia_generatora.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.inputText !== undefined) document.getElementById("inputText").value = data.inputText;
      if (data.lang1 !== undefined) document.getElementById("lang1").value = data.lang1;
      if (data.lang2 !== undefined) document.getElementById("lang2").value = data.lang2;
      if (data.boldColumn !== undefined) document.getElementById("boldColumn").value = data.boldColumn;
      if (data.subjectInput !== undefined) document.getElementById("subjectInput").value = data.subjectInput;
      else if (data.titleInput !== undefined) document.getElementById("subjectInput").value = data.titleInput;
      if (data.topicInput !== undefined) document.getElementById("topicInput").value = data.topicInput;
      if (data.authorInput !== undefined) document.getElementById("authorInput").value = data.authorInput;
      if (data.yearInput !== undefined) document.getElementById("yearInput").value = data.yearInput;
      saveInputs();
    } catch (error) { }
    event.target.value = '';
  };
  reader.readAsText(file);
}

const textarea = document.getElementById('inputText');
textarea.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 1;
  }
});

      // ZNÍŽENÁ ŠÍRKA KARTIČIEK PRE TLAČ (52mm)
      p4.push('  .split-btn { width: 52mm !important; margin: 0 !important; border: 1px solid #000 !important; box-shadow: none !important; break-inside: avoid; background: white !important; }');
      
      // Zobrazenie názvu aktívneho uška
      p4.push('  .print-tab-title { display: block !important; grid-column: 1 / -1; font-size: 12pt; font-weight: bold; border-bottom: 2px solid #000; margin-bottom: 15px; padding-bottom: 5px; }');
      
      // Rozloženie kartičiek (Grid 3 stĺpce)
      p4.push('  .tab-content { display: none !important; }');
      p4.push('  .tab-content.active { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 15px !important; border: none !important; padding: 0 !important; }');
      
      // Dizajn čiernobielich kartičiek
      p4.push('  .split-btn { width: 100% !important; margin: 0 !important; border: 1px solid #000 !important; box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; background: white !important; }');
      p4.push('  .split-btn.expanded { position: relative !important; width: 100% !important; height: auto !important; flex-direction: column !important; }'); // Ak je otvorená počas tlače, vráť ju do mriežky
      p4.push('  .top-half, .bottom-half { background: white !important; color: black !important; border-color: #000 !important; font-size: 11pt !important; padding: 12px 5px !important; min-height: auto !important; }');
      p4.push('  .top-half { border-bottom: 1px dashed #000 !important; }');
      p4.push('  .split-btn.expanded .top-half, .split-btn.expanded .bottom-half { font-size: 11pt !important; }');
      p4.push('  .flex-break { display: none !important; }'); // Medzery zrušíme, spravuje to mriežka
      p4.push('}');
      // ----------------------------

      p4.push('</style></head><body>');
      p4.push('<h1>Súhrn fráz</h1>');
      p4.push('<div class="meta-info"><b>Predmet:</b> ' + subject + ' | <b>Téma:</b> ' + topic + ' | <b>Autor:</b> ' + author + ' | <b>Rok:</b> ' + year + '</div>');
      p4.push('<h3>Po kliknutí na hociktoré tlačidlo sa dané tlačidlo zväčší na celú obrazovku. Horná i dolná časť tlačidla sú ozvučené podľa zadefinovaného jazyka v generátore. Tlačidlo zatvoríte pomocou "x" v pravej hornej časti.<br>');
      p4.push('Ideálny výsledok dosiahnete v aktuálnom prehliadači Microsoft Edge.</h3>');
      p4.push('<div class="controls">');
      p4.push('  <label>Rýchlosť: <input type="range" id="rate" min="0.6" max="1.4" step="0.1" value="1.0"> <span id="rateVal">1.0</span></label>');
      p4.push('  &nbsp;&nbsp;&nbsp;');
      p4.push('  <label>Výška: <input type="range" id="pitch" min="0.8" max="1.4" step="0.1" value="1.0"> <span id="pitchVal">1.0</span></label>');
      p4.push('</div>');

      // Generovanie ušiek pre finálny pohľad
      p4.push('<div class="tabs-header" id="final-tabs-header">');
      let tabIndex = 0;
      let firstFilledTabFound = false;
      for(let tc of tabContents) {
          if (tc.children.length === 0) { tabIndex++; continue; } // Ignoruje prázdne skupiny vo finále
          let tabId = tc.id;
          let headerBtn = document.querySelector(".tab-btn[data-target='" + tabId + "'] .tname");
          let tabName = headerBtn ? headerBtn.textContent : "Skupina " + (tabIndex + 1);
          let activeClass = !firstFilledTabFound ? "active" : "";
          p4.push('  <div class="tab-btn ' + activeClass + '" data-target="final-tab-' + tabIndex + '" onclick="switchFinalTab(&quot;final-tab-' + tabIndex + '&quot;)">' + tabName + '</div>');
          firstFilledTabFound = true;
          tabIndex++;
      }
      p4.push('</div>');

      p4.push('<div id="final-tabs-container">');
      tabIndex = 0;
      firstFilledTabFound = false;
      for(let tc of tabContents) {
          if (tc.children.length === 0) { tabIndex++; continue; }
          
          let tabId = tc.id;
          let headerBtn = document.querySelector(".tab-btn[data-target='" + tabId + "'] .tname");
          let tabName = headerBtn ? headerBtn.textContent : "Skupina " + (tabIndex + 1);

          let activeClass = !firstFilledTabFound ? "active" : "";
          p4.push('  <div id="final-tab-' + tabIndex + '" class="tab-content sequence-container ' + activeClass + '">');
          
          // Nadpis skupiny, ktorý sa zobrazí výlučne pri tlači
          p4.push('    <div class="print-tab-title">Zvolená skupina: ' + tabName + '</div>');
          
          firstFilledTabFound = true;
          
          for(let item of tc.children) {
            if(item.classList.contains('flex-break')) {
               p4.push('    <div class="flex-break"></div>');
            } else if(item.classList.contains('split-btn')) {
               const c1 = item.dataset.c1;
               const c2 = item.dataset.c2;
               p4.push('    <div class="split-btn">');
               p4.push('      <div class="close-btn" title="Zavrieť na celú obrazovku">&times;</div>');
               p4.push('      <div class="top-half" data-text="' + c1.replace(/"/g, '&quot;') + '" data-lang="' + lang1 + '">' + item.querySelector('.top-half').innerHTML + '</div>');
               p4.push('      <div class="bottom-half" data-text="' + c2.replace(/"/g, '&quot;') + '" data-lang="' + lang2 + '">' + item.querySelector('.bottom-half').innerHTML + '</div>');
               p4.push('    </div>');
            }
          }
          p4.push('  </div>');
          tabIndex++;
      }
      p4.push('</div>');

      p4.push('<script>');
      p4.push('function switchFinalTab(tabId) {');
      p4.push('  document.querySelectorAll("#final-tabs-header .tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.target === tabId));');
      p4.push('  document.querySelectorAll("#final-tabs-container .tab-content").forEach(content => content.classList.toggle("active", content.id === tabId));');
      p4.push('}');
      p4.push('document.getElementById("rate").addEventListener("input", e => document.getElementById("rateVal").textContent = e.target.value);');
      p4.push('document.getElementById("pitch").addEventListener("input", e => document.getElementById("pitchVal").textContent = e.target.value);');
      p4.push('function speak(text, lang) {');
      p4.push('  if (!text) return;');
      p4.push('  speechSynthesis.cancel();');
      p4.push('  const utter = new SpeechSynthesisUtterance(text);');
      p4.push('  utter.lang = lang;');
      p4.push('  const voices = speechSynthesis.getVoices();');
      p4.push('  const selectedVoice = voices.find(v => v.lang === lang || v.lang.replace("_", "-") === lang);');
      p4.push('  if (selectedVoice) utter.voice = selectedVoice;');
      p4.push('  utter.rate = parseFloat(document.getElementById("rate").value);');
      p4.push('  utter.pitch = parseFloat(document.getElementById("pitch").value);');
      p4.push('  speechSynthesis.speak(utter);');
      p4.push('}');
      p4.push('document.getElementById("final-tabs-container").addEventListener("click", function(e) {');
      p4.push('  let btn = e.target.closest(".split-btn");');
      p4.push('  if (!btn) return;');
      
      // Ak užívateľ klikne na "X"
      p4.push('  if (e.target.classList.contains("close-btn")) {');
      p4.push('    btn.classList.remove("expanded");');
      p4.push('    e.stopPropagation();'); 
      p4.push('    return;');
      p4.push('  }');
      
      // Ak tlačidlo nie je zväčšené, zväčši ho (a neprehrávaj zvuk)
      p4.push('  if (!btn.classList.contains("expanded")) {');
      p4.push('    btn.classList.add("expanded");');
      p4.push('  } else if (e.target.classList.contains("top-half") || e.target.classList.contains("bottom-half")) {');
      // Ak je už zväčšené a klikne na texty, prehraj zvuk
      p4.push('    speak(e.target.dataset.text, e.target.dataset.lang);');
      p4.push('  }');
      p4.push('});');
      p4.push('<\\/script>');
      p4.push('</body></html>');
      
      const blob4 = new Blob([p4.join('\\n')], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob4);
      a.download = 'suhrn_fraz.html';
      a.click();
  };

  p3.push(genFunc.toString());

  p3.push("<" + "/script>");
  p3.push("</body></html>");

  const blob3 = new Blob([p3.join('\\n')], { type: 'text/html' });
  window.open(URL.createObjectURL(blob3), '_blank');
}

  return `
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="${author.replace(/"/g, '&quot;')}">
  <meta name="year" content="${year}">
  <title>${headerTitle.replace(/"/g, '&quot;')}</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 900px; margin: auto; }
    header { border-bottom: 2px solid #333; padding-bottom: 1rem; margin-bottom: 2rem; }
    .meta-info { color: #555; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th { padding: 0.5rem; border-bottom: 2px solid #ccc; text-align: left; }
    td { padding: 0.5rem; border-bottom: 1px solid #ccc; vertical-align: middle; }
    .bold { font-weight: bold; }
    .icon { cursor: pointer; margin-right: 0.5rem; color: #0077cc; }
    .controls { margin-top: 1rem; background: #f9f9f9; padding: 1rem; border-radius: 5px; margin-bottom: 1.5rem; }
    .btn-generate-builder { padding: 0.7rem 1.2rem; background: #0077cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-bottom: 1rem; }
    .btn-generate-builder:hover { background: #005fa3; }
  </style>
</head>
<body>
  <header>
    <h1>${headerTitle}</h1>
    <div class="meta-info"><b>Predmet:</b> ${subject} | <b>Téma:</b> ${topic} | <b>Autor:</b> ${author} | <b>Rok:</b> ${year}</div>
  </header>

  <button onclick="generateBuilder()" class="btn-generate-builder">Vygenerovať klikateľné tlačidlá z vyznačených fráz</button>

  <div class="controls">
    <label>Rýchlosť: <input type="range" id="rate" min="0.6" max="1.4" step="0.1" value="${rate}"> <span id="rateVal">${rate}</span></label>
    &nbsp;&nbsp;&nbsp;
    <label>Výška: <input type="range" id="pitch" min="0.8" max="1.4" step="0.1" value="${pitch}"> <span id="pitchVal">${pitch}</span></label>
  </div>
  
  <table id="table">
    <tr>
      <th style="width: 30px;"><input type="checkbox" title="Označiť/Odznačiť všetko" onclick="const cbs = document.querySelectorAll('.phrase-cb'); cbs.forEach(cb => cb.checked = this.checked);"></th>
      <th>Stĺpec 1</th>
      <th>Stĺpec 2</th>
    </tr>
    ${lines.map(([col1, col2]) => `
      <tr>
        <td><input type="checkbox" class="phrase-cb" data-c1="${(col1 || '').replace(/"/g, '&quot;')}" data-c2="${(col2 || '').replace(/"/g, '&quot;')}"></td>
        <td>
          <span class="icon" onclick="speak('${(col1 || '').replace(/'/g, "\\'")}', '${lang1}')">🔊</span>
          <span class="${boldCol === '1' ? 'bold' : ''}">${col1 || ''}</span>
        </td>
        <td>
          <span class="icon" onclick="speak('${(col2 || '').replace(/'/g, "\\'")}', '${lang2}')">🔊</span>
          <span class="${boldCol === '2' ? 'bold' : ''}">${col2 || ''}</span>
        </td>
      </tr>
    `).join('')}
  </table>

  <script>
    document.getElementById('rate').addEventListener('input', e => document.getElementById('rateVal').textContent = e.target.value);
    document.getElementById('pitch').addEventListener('input', e => document.getElementById('pitchVal').textContent = e.target.value);

    function speak(text, lang) {
      if (!text) return;
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      const voices = speechSynthesis.getVoices();
      const selectedVoice = voices.find(v => v.lang === lang || v.lang.replace('_', '-') === lang);
      if (selectedVoice) utter.voice = selectedVoice;
      utter.rate = parseFloat(document.getElementById('rate').value);
      utter.pitch = parseFloat(document.getElementById('pitch').value);
      speechSynthesis.speak(utter);
    }
  <${'/'}script>
  <script>
  ${builderScriptJS}
  <${'/'}script>
</body>
</html>`;
}

function generate() {
  const newWindow = window.open('', '_blank');
  newWindow.document.write(getGeneratedHTML());
  newWindow.document.close();
}

function downloadHTML() {
  const subject = document.getElementById('subjectInput').value.trim() || 'zoznam';
  const blob = new Blob([getGeneratedHTML()], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${subject.replace(/\s+/g, '_')}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>

<br><br>

</body>
</html>

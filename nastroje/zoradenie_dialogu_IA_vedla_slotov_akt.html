<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Zoradenie dialógov - generátor</title>
  <style>
    body { font-family: Courier bold, monospace; max-width: 1100px; margin: 2em auto; padding: 0 1em; background-color: #f4f4f9; }
    .container { background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .meta-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 1.5em; }
    .meta-inputs input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: sans-serif; width: 100%; box-sizing: border-box; }
    .toolbar { margin-bottom: 0.5em; display: flex; align-items: center; gap: 10px; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 16px; margin-bottom: 1em; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
    .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.5em; border-bottom: 1px solid #eee; padding-bottom: 1.5em; }
    .button { background-color: #007BFF; color: #fff; padding: 0.7em 1.2em; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; text-decoration: none; transition: background 0.3s; }
    .button:hover { background-color: #0056b3; }
    .button.secondary { background-color: #6c757d; }
    .button.mini { padding: 4px 10px; font-weight: bold; background-color: #343a40; }
    .button.disabled { opacity: 0.5; pointer-events: none; }
    label { font-size: 0.85em; color: #666; font-family: sans-serif; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1 style="text-align: center;">Zoradenie dialógov - generátor<br>(repliky vedľa slotov, možnosť rozdelenia jedného dialógu na viac častí)</h1>
 
  <div class="meta-inputs">
    <div><label>Predmet:</label><br><input type="text" id="subject" placeholder="NEJ"></div>
    <div><label>Názov testu:</label><br><input type="text" id="title" placeholder="Nakupovanie"></div>
    <div><label>Autor:</label><br><input type="text" id="author" placeholder="Mgr. Meno Priezvisko"></div>
  </div>

  <div style="margin-bottom: 1.5em; font-family: sans-serif; background: #f8f9fa; padding: 12px; border-radius: 4px; border: 1px solid #ddd;">
    <label style="font-weight: bold; font-size: 0.9em; color: #333; display: block; margin-bottom: 8px;">Usporiadanie úloh (ak je v dialógu viac samostatných blokov):</label>
    <div style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.9em;">
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: normal; color: #444;">
        <input type="radio" name="taskMode" value="fixed" checked style="margin: 0; width: auto;"> Jeden dialóg rozdelený na viac úloh (poradie úloh zostane pevné)
      </label>
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: normal; color: #444;">
        <input type="radio" name="taskMode" value="shuffled" style="margin: 0; width: auto;"> Nezávislé úlohy (poradie úloh sa náhodne zamieša)
      </label>
    </div>
  </div>

  <div class="toolbar">
    <button id="formatBold" class="button mini" title="Formátovať ako tučné">B</button>
    <span style="font-size: 0.8em; font-family: sans-serif; color: #666;">Označte text a kliknutím na B ho naformátujete ako <b>tučné písmo</b>.</span>
  </div>

  <textarea id="inputArea" placeholder="A: Hallo, wie geht's?
B: Hallo, es geht, danke. Und dir?
A: Danke, es geht."></textarea>

  <div class="button-group">
    <button id="generateHTML" class="button">Generovať interaktívne cvičenie (.html)</button>
    <button id="generateRTF" class="button">Generovať pracovný list (.rtf)</button>
    <a id="downloadRTF" class="button disabled">Stiahnuť .rtf</a>
  </div>

  <div class="button-group" style="border-bottom: none;">
    <button id="exportJSON" class="button secondary">Exportovať nastavenia (.json)</button>
    <button id="importJSON" class="button secondary">Importovať nastavenia (.json)</button>
    <input type="file" id="fileInput" style="display:none" accept=".json">
  </div>
</div>

<div style="text-align: center; margin-top: 1em; font-size: 0.9em; font-family: sans-serif;">
  <b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025 - 2026)
</div>

<script>
  const textarea = document.getElementById('inputArea');
  const inpSubj = document.getElementById('subject');
  const inpTitle = document.getElementById('title');
  const inpAuth = document.getElementById('author');

  // Funkcia pre vytvorenie bezpečného názvu súboru bez diakritiky, interpunkcie a medzier
  function sanitizeFilename(name) {
    if (!name) return "";
    return name
      .replace(/ß/g, "ss")               // nahradenie nemeckého ß za ss
      .normalize("NFD")                  // rozdelenie znakov na základ a diakritiku
      .replace(/[\u0300-\u036f]/g, "")   // odstránenie diakritiky
      .replace(/[^a-zA-Z0-9]/g, "_")     // nahradenie všetkého okrem písmen a čísel podčiarkovníkom
      .replace(/_+/g, "_")               // zredukovanie viacnásobných podčiarkovníkov
      .replace(/^_|_$/g, "")             // odstránenie podčiarkovníkov na okrajoch
      .toLowerCase();                    // zmena na malé písmená
  }

  // Funkcia pre tučné písmo
  document.getElementById('formatBold').addEventListener('click', () => {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + "<b>" + val.substring(start, end) + "</b>" + val.substring(end);
    textarea.focus();
  });

  // Export JSON
  document.getElementById('exportJSON').addEventListener('click', () => {
    const taskMode = document.querySelector('input[name="taskMode"]:checked').value;
    const data = { 
      subject: inpSubj.value, 
      title: inpTitle.value, 
      author: inpAuth.value, 
      content: textarea.value,
      taskMode: taskMode
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    
    // Použitie bezpečného názvu pre JSON
    const safeName = sanitizeFilename(inpTitle.value) || 'nastavenia_dialogu';
    a.download = safeName + '.json';
    
    a.click();
  });

  // Import JSON
  document.getElementById('importJSON').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (re) => {
      const data = JSON.parse(re.target.result);
      inpSubj.value = data.subject || '';
      inpTitle.value = data.title || '';
      inpAuth.value = data.author || '';
      textarea.value = data.content || '';
      if (data.taskMode) {
        const rButton = document.querySelector(`input[name="taskMode"][value="${data.taskMode}"]`);
        if (rButton) rButton.checked = true;
      }
    };
    reader.readAsText(file);
  });

  function getTasks() {
    const raw = textarea.value.trim();
    if (!raw) return null;
    const blocks = raw.split(/\n\s*\n/).map(b => b.trim()).filter(b => b);
    const original = blocks.map(b => b.split('\n').map(l => l.trim()).filter(l => l));
    const scrambled = original.map(lines => [...lines].sort(() => Math.random() - 0.5));
    return { original, scrambled };
  }

  // RTF Generovanie
  document.getElementById('generateRTF').addEventListener('click', () => {
    const tasks = getTasks();
    if (!tasks) return;
    const clean = (s) => s.replace(/<\/?[^>]+(>|$)/g, "");
    let rtf = '{\\rtf1\\ansi\\ansicpg1250\\deff0{\\fonttbl{\\f0 Courier New;}}\n';
    rtf += `\\fs36\\b ${clean(inpTitle.value || 'Cvičenie')}\\b0\\fs24\\par\n`;
    rtf += `${clean(inpSubj.value)} - ${clean(inpAuth.value)}\\par\\par\n`;
    tasks.scrambled.forEach((t, i) => {
      rtf += `\\b Úloha ${i+1}:\\b0  ${clean(t.join(' / '))}\\par\\par\n`;
    });
    rtf += '}';
    const blob = new Blob([rtf], { type: 'application/rtf' });
    const btn = document.getElementById('downloadRTF');
    btn.href = URL.createObjectURL(blob);
    
    // Použitie bezpečného názvu pre RTF
    const safeName = sanitizeFilename(inpTitle.value) || 'pracovny_list';
    btn.download = safeName + '.rtf';
    
    btn.classList.remove('disabled');
  });

  // HTML Generovanie
  document.getElementById('generateHTML').addEventListener('click', () => {
    const tasks = getTasks();
    if (!tasks) return;

    const taskMode = document.querySelector('input[name="taskMode"]:checked').value;
    let taskIndices = tasks.original.map((_, i) => i);
    
    if (taskMode === 'shuffled') {
      taskIndices.sort(() => Math.random() - 0.5);
    }

    let tasksHTML = "";
    taskIndices.forEach((origIdx, displayIdx) => {
      let t = tasks.scrambled[origIdx];
      let slotsHTML = t.map((_, i) => `<div class="slot" data-pos="${i}"></div>`).join('');
      let cardsHTML = t.map(text => `<div class="card">${text}</div>`).join('');
      
      tasksHTML += `
      <div class="task" id="task-${origIdx}" data-idx="${origIdx}" data-display-idx="${displayIdx + 1}">
        <h2>Úloha ${displayIdx + 1}</h2>
        <div class="exerciseRow">
          <div class="slots">${slotsHTML}</div>
          <div class="cards">${cardsHTML}</div>
        </div>
        <div class="no-print">
          <button class="btn btn-check" data-idx="${origIdx}">Vyhodnotiť</button>
          <button class="btn btn-details" id="detBtn-${origIdx}" data-idx="${origIdx}" style="display:none; background:#28a745;">Detailné výsledky</button>
          <button class="btn btn-retry" data-idx="${origIdx}" style="background:#6c757d;">Opakovať pokus</button>
        </div>
      </div>`;
    });

    const finalHTML = `
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>${inpTitle.value || 'Zoradenie dialógu'}</title>
  <style>
    body { font-family: Courier bold, monospace; max-width: 1000px; margin: 2em auto; padding: 1em; background:#f9f9f9; }
    .header { border-bottom: 2px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
    .student-name { margin-bottom: 20px; font-size: 1.2em; }
    .student-name input { padding: 8px; width: 300px; border: 1px solid #888; font-family: sans-serif; }
    .task { background:#fff; border: 1px solid #ccc; padding: 20px; margin-bottom: 30px; border-radius: 8px; }
    .exerciseRow { display: flex; gap: 20px; margin: 20px 0; }
    .slots { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .cards { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 50px; }
    .slot { min-height: 44px; border: 2px dashed #bbb; padding: 8px; background:#fff; border-radius: 4px; cursor: pointer; display: flex; align-items: flex-start; box-sizing: border-box; }
    .slot.correct { border-color: green; background: #e8f5e9; }
    .slot.incorrect { border-color: red; background: #ffebee; }
    .card { background: #eee; padding: 10px; border: 1px solid #999; border-radius: 4px; cursor: pointer; line-height: 1.2; user-select: none; }
    .card.selected { background: #bbdefb; border-color: #007bff; box-shadow: 0 0 8px #007bff; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; background: #007bff; color: #fff; }
    @media print {
      .no-print, .btn, .cards, .student-name input { display: none !important; }
      body { background: white; margin: 0; padding: 0; }
      .task { border: 1px solid #000; break-inside: avoid; }
      .student-name::after { content: " " attr(data-name); font-weight: bold; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>${inpTitle.value || 'Zoradenie dialógu'}</h1>
    <p><b>Predmet:</b> ${inpSubj.value} | <b>Autor:</b> ${inpAuth.value}</p>
  </div>

  <div class="student-name">
    Meno žiaka: <input type="text" id="nameInput" oninput="this.parentElement.setAttribute('data-name', this.value)">
  </div>

  <div class="no-print"><p>1. Klikni na kartičku (zvýrazní sa modrou). <br> 2. Klikni do prázdnej bunky. <br> 3. Kliknutím na text v bunke ho vrátiš späť.</p></div>

  ${tasksHTML}

  <div class="no-print" style="text-align: center; margin: 40px 0; display: flex; justify-content: center; gap: 15px;">
    <button class="btn btn-global-check" style="background: #28a745; font-size: 1.1em; padding: 12px 24px;">Vyhodnotenie všetkých úloh</button>
    <button class="btn" style="background: #6c757d; font-size: 1.1em; padding: 12px 24px;" onclick="if(confirm('Chcete vymazať odpovede a reštartovať celé cvičenie?')) location.reload();">Reštartovať celé cvičenie</button>
  </div>

  <div style="margin-top: 30px; font-size: 0.8em; text-align: center; font-family: sans-serif;">
    Spracovala pomocou UI: Mgr. Erika Matyiová (2025 - 2026)
  </div>

  <script>
    const originals = ${JSON.stringify(tasks.original)};
    let selectedElement = null;

    // Funkcia na premiešanie kartičiek po každom načítaní
    function shuffleCardsOnLoad() {
      document.querySelectorAll('.cards').forEach(container => {
        const cards = Array.from(container.children);
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          container.appendChild(cards[j]);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', shuffleCardsOnLoad);

    document.addEventListener('click', function(e) {
      const cardEl = e.target.closest('.card');
      const slotEl = e.target.closest('.slot');
      const btnCheckEl = e.target.closest('.btn-check');
      const btnDetailsEl = e.target.closest('.btn-details');
      const btnRetryEl = e.target.closest('.btn-retry');
      const btnGlobalCheckEl = e.target.closest('.btn-global-check');

      if (cardEl) {
        if (selectedElement) selectedElement.classList.remove('selected');
        selectedElement = cardEl;
        selectedElement.classList.add('selected');
      }
      else if (slotEl) {
        const slot = slotEl;
        if (selectedElement) {
          if (slot.innerHTML.trim() !== "") returnToCards(slot);
          slot.innerHTML = selectedElement.innerHTML;
          selectedElement.remove();
          selectedElement = null;
        } else if (slot.innerHTML.trim() !== "") {
          returnToCards(slot);
        }
      }
      else if (btnCheckEl) { check(btnCheckEl.dataset.idx); }
      else if (btnDetailsEl) { showDetails(btnDetailsEl.dataset.idx); }
      else if (btnRetryEl) { retryTask(btnRetryEl.dataset.idx); }
      else if (btnGlobalCheckEl) { checkAll(); }
    });

    function returnToCards(slot) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = slot.innerHTML;
      slot.closest('.exerciseRow').querySelector('.cards').appendChild(card);
      slot.innerHTML = "";
    }

    function check(idx) {
      const taskEl = document.getElementById('task-' + idx);
      const slots = taskEl.querySelectorAll('.slot');
      slots.forEach((s, i) => {
        s.classList.remove('correct', 'incorrect');
        if (s.innerHTML.trim() === originals[idx][i]) s.classList.add('correct');
        else s.classList.add('incorrect');
      });
      document.getElementById('detBtn-' + idx).style.display = 'inline-block';
    }

    function retryTask(idx) {
      const taskEl = document.getElementById('task-' + idx);
      const slots = taskEl.querySelectorAll('.slot');
      const cardsContainer = taskEl.querySelector('.cards');
      slots.forEach(s => {
        if (s.innerHTML.trim() !== "") {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = s.innerHTML;
          cardsContainer.appendChild(card);
          s.innerHTML = "";
        }
        s.classList.remove('correct', 'incorrect');
      });
      if (selectedElement && selectedElement.closest('#task-' + idx)) selectedElement = null;
      document.getElementById('detBtn-' + idx).style.display = 'none';
    }

    // OBNOVENÉ: Detailné výsledky pre jednu úlohu
    function showDetails(idx) {
      const taskEl = document.getElementById('task-' + idx);
      const slots = taskEl.querySelectorAll('.slot');
      const studentName = document.getElementById('nameInput').value || '__________';
      const testTitle = "${inpTitle.value || 'Zoradenie dialógu'}";
      const displayIdx = taskEl.dataset.displayIdx;
      
      let points = 0;
      let total = originals[idx].length;
      let tableRows = "";
      
      originals[idx].forEach((correct, i) => {
        const student = slots[i].innerHTML.trim();
        let icon = '❌';
        if (student === correct) { icon = '✅'; points++; }
        else if (!student) icon = '❗';
        tableRows += '<tr><td>' + (i+1) + '</td><td>' + correct + '</td><td>' + (student || '(prázdne)') + '</td><td style="text-align:center">' + icon + '</td></tr>';
      });

      const percent = ((points / total) * 100).toFixed(1);
      const now = new Date();
      const resultsWin = window.open('', '_blank');
      resultsWin.document.write('<html><head><title>Výsledky - ' + studentName + '</title><style>body { font-family: Courier bold, monospace; padding: 40px; } table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: sans-serif; } th, td { border: 1px solid #000; padding: 10px; text-align: left; } th { background: #eee; }</style></head><body><h1>Detailné výsledky:</h1><p><strong>Test:</strong> ' + testTitle + ' (Úloha ' + displayIdx + ')<br><strong>Meno:</strong> ' + studentName + '<br><strong>Hodnotenie:</strong> ' + points + '/' + total + ' (' + percent + '%)</p><table><thead><tr><th>#</th><th>Správne</th><th>Tvoja odpoveď</th><th>Stav</th></tr></thead><tbody>' + tableRows + '</tbody></table></body></html>');
      resultsWin.document.close();
    }

    // OBNOVENÉ: Globálne vyhodnotenie celého testu naraz
    function checkAll() {
      let totalPoints = 0, totalReplicas = 0, allTableRows = "";
      const taskEls = document.querySelectorAll('.task');
      
      taskEls.forEach((taskEl) => {
        const idx = parseInt(taskEl.dataset.idx);
        const displayIdx = taskEl.dataset.displayIdx;
        const slots = taskEl.querySelectorAll('.slot');
        
        slots.forEach((s, i) => {
          s.classList.remove('correct', 'incorrect');
          if (s.innerHTML.trim() === originals[idx][i]) s.classList.add('correct');
          else s.classList.add('incorrect');
        });
        document.getElementById('detBtn-' + idx).style.display = 'inline-block';
        
        allTableRows += '<tr><th colspan="4" style="background:#ddd;">Úloha ' + displayIdx + '</th></tr>';
        originals[idx].forEach((correct, i) => {
          const student = slots[i].innerHTML.trim();
          let icon = '❌';
          if (student === correct) { icon = '✅'; totalPoints++; }
          else if (!student) icon = '❗';
          totalReplicas++;
          allTableRows += '<tr><td>' + (i+1) + '</td><td>' + correct + '</td><td>' + (student || '(prázdne)') + '</td><td style="text-align:center">' + icon + '</td></tr>';
        });
      });
      
      const percent = totalReplicas > 0 ? ((totalPoints / totalReplicas) * 100).toFixed(1) : 0;
      const studentName = document.getElementById('nameInput').value || '__________';
      const testTitle = "${inpTitle.value || 'Zoradenie dialógu'}";
      
      const resultsWin = window.open('', '_blank');
      resultsWin.document.write('<html><head><title>Výsledky - ' + studentName + '</title><style>body { font-family: Courier bold, monospace; padding: 40px; } table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: sans-serif; } th, td { border: 1px solid #000; padding: 10px; text-align: left; } th { background: #eee; }</style></head><body><h1>Celkové výsledky testu:</h1><p><strong>Test:</strong> ' + testTitle + '<br><strong>Meno:</strong> ' + studentName + '<br><strong>Celkové hodnotenie:</strong> ' + totalPoints + '/' + totalReplicas + ' (' + percent + '%)</p><table><thead><tr><th>#</th><th>Správne</th><th>Tvoja odpoveď</th><th>Stav</th></tr></thead><tbody>' + allTableRows + '</tbody></table></body></html>');
      resultsWin.document.close();
    }
  <\/script>
</body>
</html>`;

    const blob = new Blob([finalHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    
    // Použitie bezpečného názvu pre HTML
    const safeName = sanitizeFilename(inpTitle.value) || 'zoradenie_dialogu';
    a.download = safeName + '.html';
    
    a.click();
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Kartičky na opakovanie slovíčok</title>
  <style>
    body {
      font-family: Courier bold, monospace;
      margin: 30px;
      background-color: #f4f4f4;
    }
    textarea, select, button, input[type="text"], input[type="number"], input[type="checkbox"] {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .flex-row {
      display: flex;
      gap: 10px;
    }
    .flex-row button {
      flex: 1;
    }

    .card {
      margin: 20px auto;
      width: 61%;
      min-height: 200px;
      height: auto;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: clamp(20px, 4vw, 60px);
      cursor: pointer;
      transition: background-color 0.3s;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .card:hover {
      background-color: #eef;
    }
    .card .secondary {
      margin-top: 10px;
      font-size: clamp(16px, 3vw, 50px);
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }
    .card-container {
      margin: 20px auto;
      width: 61%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-box {
      position: relative;
      width: 100%;
      min-height: 200px;
      height: auto;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(20px, 4vw, 60px);
      text-align: center;
      margin-bottom: 20px;
      padding: 30px 20px;
      cursor: pointer;
      transition: background-color 0.3s;
      word-break: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }
    .card-box:hover {
      background-color: #eef;
    }
    .card-box.secondary {
      background-color: #f9f9f9;
      font-weight: normal;
    }
    .card-box.primary {
      font-weight: bold;
    }
    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .stats {
      margin-top: 10px;
      font-size: 16px;
    }
    .hidden {
      display: none;
    }
    .options {
      margin-top: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    body.dark-mode {
      background-color: #1a2d06;
      color: #ffffff;
    }
    body.dark-mode textarea,
    body.dark-mode select,
    body.dark-mode button,
    body.dark-mode input[type="text"],
    body.dark-mode input[type="number"],
    body.dark-mode input[type="checkbox"] {
      background-color: #263c10;
      color: #ffffff;
      border: 1px solid #444;
    }
    body.dark-mode .card,
    body.dark-mode .card-box {
      background-color: #17290A;
      border: 2px solid #333;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      color: #ffffff;
    }
    body.dark-mode .card:hover,
    body.dark-mode .card-box:hover {
      background-color: #20390E;
    }
    body.dark-mode .card .secondary,
    body.dark-mode .card-box.secondary {
      background-color: #1D2D0B;
      color: #ffffff;
    }
    body.dark-mode .stats,
    body.dark-mode label {
      color: #ffffff;
    }
    .speaker {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      font-size: 24px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .speaker:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>Generátor kartičiek</h1>
  
  <div class="grid-2">
    <div>
      <label>Predmet:</label>
      <input type="text" id="metaSubject" placeholder="Napr. Biológia">
    </div>
    <div>
      <label>Téma:</label>
      <input type="text" id="metaTopic" placeholder="Napr. Bunka">
    </div>
    <div>
      <label>Autor:</label>
      <input type="text" id="metaAuthor" placeholder="Meno autora">
    </div>
    <div>
      <label>Rok:</label>
      <input type="number" id="metaYear" value="2026">
    </div>
  </div>

  <textarea id="inputArea" rows="8" placeholder="Zadajte slovné páry vo formáte:
pojem[TAB]definícia"></textarea>

  <div class="flex-row">
    <button onclick="exportSettings()">📥 Exportovať nastavenia (.json)</button>
    <button onclick="document.getElementById('importFile').click()">📤 Importovať nastavenia (.json)</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSettings(event)">
  </div>

  <div class="grid-2">
    <div>
      <label for="boldSide">Zvýrazni hrubým písmom:</label>
      <select id="boldSide">
        <option value="term">Pojem</option>
        <option value="definition">Definícia</option>
      </select>
    </div>
    <div>
      <label for="displayMode">Zobraziť:</label>
      <select id="displayMode">
        <option value="both">Obe strany kartičky</option>
        <option value="term">Len pojem</option>
        <option value="definition">Len definícia</option>
      </select>
    </div>
    <div>
      <label for="termLang">Jazyk pojmu:</label>
      <select id="termLang">
        <option value="sk-SK">Slovenčina</option>
        <option value="en-GB">Angličtina (UK)</option>
        <option value="en-US">Angličtina (USA)</option>
        <option value="en-AU">Angličtina (Austrália)</option>
        <option value="de-DE">Nemčina (Nemecko)</option>
        <option value="de-AT">Nemčina (Rakúsko)</option>
        <option value="de-CH">Nemčina (Švajčiarsko)</option>
        <option value="fr-FR">Francúzština (Francúzsko)</option>
        <option value="fr-BE">Francúzština (Belgicko)</option>
        <option value="fr-CH">Francúzština (Švajčiarsko)</option>
        <option value="fr-CA">Francúzština (Kanada)</option>
      </select>
    </div>
    <div>
      <label for="defLang">Jazyk definície:</label>
      <select id="defLang">
        <option value="sk-SK">Slovenčina</option>
        <option value="en-GB">Angličtina (UK)</option>
        <option value="en-US">Angličtina (USA)</option>
        <option value="en-AU">Angličtina (Austrália)</option>
        <option value="de-DE">Nemčina (Nemecko)</option>
        <option value="de-AT">Nemčina (Rakúsko)</option>
        <option value="de-CH">Nemčina (Švajčiarsko)</option>
        <option value="fr-FR">Francúzština (Francúzsko)</option>
        <option value="fr-BE">Francúzština (Belgicko)</option>
        <option value="fr-CH">Francúzština (Švajčiarsko)</option>
        <option value="fr-CA">Francúzština (Kanada)</option>
      </select>
    </div>
  </div>

  <div class="options">
    <label><input type="checkbox" id="shuffleCards"> Prehrať v náhodnom poradí</label>
    <label><input type="checkbox" id="autoPlay"> Automatické prehrávanie (prečíta pojem, po 10s ďalšia karta)</label>
  </div>

  <div class="flex-row" style="margin-top: 20px;">
    <button id="toggle-theme">Prepni režim</button>
    <button onclick="startReview()" style="background-color: #d4edda; border-color: #c3e6cb; color: #155724;">Spustiť prehľad kartičiek</button>
    <button onclick="saveFlashcardsAsHTML()" style="background-color: #cce5ff; border-color: #b8daff; color: #004085;">Uložiť kartičky ako HTML</button>
  </div>

  <div id="reviewSection" class="hidden">
    <div class="card-container" id="cardDisplay"></div>
    <div class="controls">
      <button onclick="prevCard()">⬅️ Predchádzajúca</button>
      <button onclick="nextCard()">➡️ Ďalšia</button>
      <button onclick="toggleAutoPlayUI()">⏯️ Prehrať/Pozastaviť</button>
    </div>
    <div class="stats" id="cardStats"></div>
    <button id="restartBtn" style="display:none; width: 100%; margin-top: 10px;" onclick="restartCards()">Znova</button>
  </div>

  <script>
    let cards = [];
    let currentIndex = 0;
    let flipped = false;
    let autoPlayTimeout = null;
    let isAutoPlaying = false;

    document.getElementById('inputArea').addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const ta = e.target;
        const start = ta.selectionStart, end = ta.selectionEnd;
        ta.value = ta.value.slice(0,start) + '\t' + ta.value.slice(end);
        ta.selectionStart = ta.selectionEnd = start + 1;
      }
    });

    function shuffleArray(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
    }

    function createSpeakerIcon(text, lang) {
      const s = document.createElement('span');
      s.className = 'speaker';
      s.textContent = '🔊';
      s.onclick = (e) => {
        e.stopPropagation(); 
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        speechSynthesis.speak(u);
      };
      return s;
    }

    function exportSettings() {
      const data = {
         metaSubject: document.getElementById('metaSubject').value,
         metaTopic: document.getElementById('metaTopic').value,
         metaAuthor: document.getElementById('metaAuthor').value,
         metaYear: document.getElementById('metaYear').value,
         inputArea: document.getElementById('inputArea').value,
         boldSide: document.getElementById('boldSide').value,
         displayMode: document.getElementById('displayMode').value,
         termLang: document.getElementById('termLang').value,
         defLang: document.getElementById('defLang').value,
         shuffleCards: document.getElementById('shuffleCards').checked,
         autoPlay: document.getElementById('autoPlay').checked
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'karticky_nastavenia.json';
      a.click();
    }

    function importSettings(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if(data.metaSubject !== undefined) document.getElementById('metaSubject').value = data.metaSubject;
          if(data.metaTopic !== undefined) document.getElementById('metaTopic').value = data.metaTopic;
          if(data.metaAuthor !== undefined) document.getElementById('metaAuthor').value = data.metaAuthor;
          if(data.metaYear !== undefined) document.getElementById('metaYear').value = data.metaYear;
          if(data.inputArea !== undefined) document.getElementById('inputArea').value = data.inputArea;
          if(data.boldSide !== undefined) document.getElementById('boldSide').value = data.boldSide;
          if(data.displayMode !== undefined) document.getElementById('displayMode').value = data.displayMode;
          if(data.termLang !== undefined) document.getElementById('termLang').value = data.termLang;
          if(data.defLang !== undefined) document.getElementById('defLang').value = data.defLang;
          if(data.shuffleCards !== undefined) document.getElementById('shuffleCards').checked = data.shuffleCards;
          if(data.autoPlay !== undefined) document.getElementById('autoPlay').checked = data.autoPlay;
        } catch(err) {}
      };
      reader.readAsText(file);
      e.target.value = ""; 
    }

    function startReview() {
      const input = document.getElementById('inputArea').value.trim();
      cards = input.split('\n')
        .map(l => l.split('\t'))
        .filter(p => p[0] && p[1])
        .map(p => ({term:p[0].trim(), definition:p[1].trim()}));
      
      if (cards.length === 0) return;
      
      if (document.getElementById('shuffleCards').checked) shuffleArray(cards);
      currentIndex = 0; flipped = false;
      document.getElementById('reviewSection').classList.remove('hidden');
      document.getElementById('restartBtn').style.display = 'none';
      
      showCard();
      
      if (document.getElementById('autoPlay').checked) {
        startAutoPlay();
      } else {
        stopAutoPlay();
      }
    }

    function showCard() {
      if (currentIndex >= cards.length) return;
      const card = cards[currentIndex];
      const bs = document.getElementById('boldSide').value;
      const dm = document.getElementById('displayMode').value;
      const tL = document.getElementById('termLang').value;
      const dL = document.getElementById('defLang').value;
      const cd = document.getElementById('cardDisplay');
      cd.innerHTML = '';
      
      const tb = document.createElement('div');
      const db = document.createElement('div');
      tb.className = 'card-box';
      db.className = 'card-box';
      
      if (bs==='term') { tb.classList.add('primary'); db.classList.add('secondary'); }
      else             { tb.classList.add('secondary'); db.classList.add('primary'); }
      
      tb.textContent = card.term;
      tb.appendChild(createSpeakerIcon(card.term, tL));
      db.textContent = card.definition;
      db.appendChild(createSpeakerIcon(card.definition, dL));
      
      if (dm==='both') {
        cd.append(tb, db);
      } else {
        const sb = document.createElement('div');
        sb.className = 'card-box';
        sb.textContent = flipped
          ? (dm==='term'? card.definition: card.term)
          : (dm==='term'? card.term: card.definition);
          
        const isPrimary = 
          (bs==='term' && !flipped && dm==='term') ||
          (bs==='definition' && !flipped && dm==='definition') ||
          (bs==='term' && flipped && dm==='definition') ||
          (bs==='definition' && flipped && dm==='term');
          
        sb.classList.add(isPrimary ? 'primary':'secondary');
        
        const currentLang = flipped 
            ? (dm==='term' ? dL : tL) 
            : (dm==='term' ? tL : dL);
        sb.appendChild(createSpeakerIcon(sb.textContent, currentLang));
        
        sb.onclick = toggleFlip;
        cd.append(sb);
      }
      document.getElementById('cardStats').textContent = `Kartička ${currentIndex+1} z ${cards.length}`;
      saveState();
    }

    function toggleFlip() { 
      flipped = !flipped; 
      showCard(); 
    }

    function nextCard() {
      stopAutoPlayLogic();
      if (currentIndex < cards.length - 1) { 
        currentIndex++; flipped = false; showCard(); 
        if(isAutoPlaying) triggerAutoPlayCycle();
      } else {
        finishReview();
      }
    }

    function prevCard() {
      stopAutoPlayLogic();
      if (currentIndex > 0) { 
        currentIndex--; flipped = false; showCard(); 
        if(isAutoPlaying) triggerAutoPlayCycle();
      }
    }

    function finishReview() {
      stopAutoPlayLogic();
      isAutoPlaying = false;
      document.getElementById('cardDisplay').innerHTML = '<div class="card-box primary"><p>Prehľad ukončený 🎉</p></div>';
      document.getElementById('cardStats').textContent = '';
      document.getElementById('restartBtn').style.display = 'inline-block';
    }

    function restartCards() {
      currentIndex = 0; flipped = false;
      localStorage.removeItem('flashcardState');
      document.getElementById('restartBtn').style.display = 'none';
      if (document.getElementById('shuffleCards').checked) shuffleArray(cards);
      showCard();
      if (document.getElementById('autoPlay').checked) {
        startAutoPlay();
      }
    }

    function startAutoPlay() {
      isAutoPlaying = true;
      document.getElementById('autoPlay').checked = true;
      stopAutoPlayLogic();
      triggerAutoPlayCycle();
    }

    function stopAutoPlayLogic() {
      speechSynthesis.cancel();
      if(autoPlayTimeout) {
        clearTimeout(autoPlayTimeout);
        autoPlayTimeout = null;
      }
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      document.getElementById('autoPlay').checked = false;
      stopAutoPlayLogic();
    }

    function toggleAutoPlayUI() {
      isAutoPlaying ? stopAutoPlay() : startAutoPlay();
    }

    function triggerAutoPlayCycle() {
      if (!isAutoPlaying || currentIndex >= cards.length) return;
      const card = cards[currentIndex];
      const tL = document.getElementById('termLang').value;
      
      const utterance = new SpeechSynthesisUtterance(card.term);
      utterance.lang = tL;
      
      utterance.onend = () => {
        if (isAutoPlaying) {
          autoPlayTimeout = setTimeout(() => {
            if (currentIndex < cards.length - 1) {
              currentIndex++; flipped = false; showCard();
              triggerAutoPlayCycle();
            } else {
              finishReview();
            }
          }, 10000);
        }
      };
      
      utterance.onerror = () => {
        if (isAutoPlaying) {
          autoPlayTimeout = setTimeout(() => {
            if (currentIndex < cards.length - 1) {
               currentIndex++; flipped = false; showCard();
               triggerAutoPlayCycle();
            } else {
               finishReview();
            }
          }, 10000);
        }
      };
      
      speechSynthesis.speak(utterance);
    }

    document.addEventListener('keydown', e => {
      if (!document.getElementById('reviewSection').classList.contains('hidden')) {
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft')  prevCard();
      }
    });

    function saveState() {
      const st = {
        currentIndex, flipped, cards,
        settings: {
          boldSide: document.getElementById('boldSide').value,
          displayMode: document.getElementById('displayMode').value,
          termLang: document.getElementById('termLang').value,
          defLang: document.getElementById('defLang').value,
          shuffle: document.getElementById('shuffleCards').checked,
          autoPlay: document.getElementById('autoPlay').checked,
          dark: document.body.classList.contains('dark-mode'),
          metaSubject: document.getElementById('metaSubject').value,
          metaTopic: document.getElementById('metaTopic').value,
          metaAuthor: document.getElementById('metaAuthor').value,
          metaYear: document.getElementById('metaYear').value
        }
      };
      localStorage.setItem('flashcardState', JSON.stringify(st));
    }

    function loadState() {
      const s = JSON.parse(localStorage.getItem('flashcardState') || 'null');
      if (!s || !s.cards || s.cards.length === 0) return;
      cards = s.cards; currentIndex = s.currentIndex; flipped = s.flipped;
      const u = s.settings;
      if(u.boldSide) document.getElementById('boldSide').value = u.boldSide;
      if(u.displayMode) document.getElementById('displayMode').value = u.displayMode;
      if(u.termLang) document.getElementById('termLang').value = u.termLang;
      if(u.defLang) document.getElementById('defLang').value = u.defLang;
      if(u.shuffle !== undefined) document.getElementById('shuffleCards').checked = u.shuffle;
      if(u.autoPlay !== undefined) document.getElementById('autoPlay').checked = u.autoPlay;
      if(u.metaSubject) document.getElementById('metaSubject').value = u.metaSubject;
      if(u.metaTopic) document.getElementById('metaTopic').value = u.metaTopic;
      if(u.metaAuthor) document.getElementById('metaAuthor').value = u.metaAuthor;
      if(u.metaYear) document.getElementById('metaYear').value = u.metaYear;
      
      document.body.classList.toggle('dark-mode', u.dark);
      document.getElementById('reviewSection').classList.remove('hidden');
      showCard();
      if(u.autoPlay) startAutoPlay();
    }

    const toggleButton = document.getElementById('toggle-theme');
    window.addEventListener('load', () => {
      document.body.classList.toggle('dark-mode',
        localStorage.getItem('darkMode') === 'true'
      );
      toggleButton.textContent = document.body.classList.contains('dark-mode') ? 'Svetlý režim' : 'Tmavý režim';
      loadState();
    });

    toggleButton.addEventListener('click', () => {
      const d = !document.body.classList.contains('dark-mode');
      document.body.classList.toggle('dark-mode', d);
      localStorage.setItem('darkMode', d);
      toggleButton.textContent = d ? 'Svetlý režim' : 'Tmavý režim';
    });

    function saveFlashcardsAsHTML() {
      const subj = document.getElementById('metaSubject').value;
      const topic = document.getElementById('metaTopic').value;
      const author = document.getElementById('metaAuthor').value;
      const year = document.getElementById('metaYear').value;
      
      let metaHeaderHTML = '';
      if (subj || topic) {
        metaHeaderHTML += `<h2>${subj ? subj : ''}${subj && topic ? ' - ' : ''}${topic ? topic : ''}</h2>`;
      }
      if (author || year) {
        metaHeaderHTML += `<p><strong>Autor:</strong> ${author ? author : 'Neznámy'} <strong>Rok:</strong> ${year ? year : ''}</p>`;
      }

      const langOptions = `
        <option value="sk-SK">Slovenčina</option>
        <option value="en-GB">Angličtina (UK)</option>
        <option value="en-US">Angličtina (USA)</option>
        <option value="en-AU">Angličtina (Austrália)</option>
        <option value="de-DE">Nemčina (Nemecko)</option>
        <option value="de-AT">Nemčina (Rakúsko)</option>
        <option value="de-CH">Nemčina (Švajčiarsko)</option>
        <option value="fr-FR">Francúzština (Francúzsko)</option>
        <option value="fr-BE">Francúzština (Belgicko)</option>
        <option value="fr-CH">Francúzština (Švajčiarsko)</option>
        <option value="fr-CA">Francúzština (Kanada)</option>
      `;

      const markSelectedLang = (optionsStr, selectedValue) => {
        return optionsStr.replace(`value="${selectedValue}"`, `value="${selectedValue}" selected`);
      };

      const html = `<!DOCTYPE html>

    .card-box {
      position: relative;
      width: 100%;
      min-height: 200px;
      height: auto;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(20px, 4vw, 60px);
      text-align: center;
      margin-bottom: 20px;
      padding: 30px 20px;
      cursor: pointer;
      transition: background-color 0.3s;
      word-break: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }
    .card-box:hover {
      background-color: #eef;
    }
    .card-box.primary { font-weight: bold; }
    .card-box.secondary {
      background-color: #f9f9f9;
      font-weight: normal;
      font-size: clamp(16px, 3vw, 50px);
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .controls button {
      width: auto;
      min-width: 150px;
    }
    .stats {
      text-align: center;
      margin-top: 15px;
      font-size: 16px;
    }
    .speaker {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      font-size: 24px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .speaker:hover { opacity: 1; }
    
    body.dark-mode {
      background-color: #1a2d06;
      color: #ffffff;
    }
    body.dark-mode .settings-bar {
      background-color: #17290A;
      border-color: #333;
    }
    body.dark-mode .options-row { border-color: #444; }
    body.dark-mode select,
    body.dark-mode button {
      background-color: #263c10;
      color: #ffffff;
      border: 1px solid #444;
    }
    body.dark-mode .card-box {
      background-color: #17290A;
      border: 2px solid #333;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      color: #ffffff;
    }
    body.dark-mode .card-box.secondary {
      background-color: #1D2D0B;
    }
  </style>
</head>
<body>
  <div class="header-meta">
    <h1>Kartičky na opakovanie</h1>
    ${metaHeaderHTML}
  </div>

  <div class="settings-bar">
    <div class="settings-group">
      <label for="boldSide">Zvýrazni hrubým písmom:</label>
      <select id="boldSide" onchange="showCard()">
        <option value="term"${document.getElementById('boldSide').value==='term'?' selected':''}>Pojem</option>
        <option value="definition"${document.getElementById('boldSide').value==='definition'?' selected':''}>Definícia</option>
      </select>
    </div>
    
    <div class="settings-group">
      <label for="displayMode">Zobraziť:</label>
      <select id="displayMode" onchange="showCard()">
        <option value="both"${document.getElementById('displayMode').value==='both'?' selected':''}>Obe strany</option>
        <option value="term"${document.getElementById('displayMode').value==='term'?' selected':''}>Len pojem</option>
        <option value="definition"${document.getElementById('displayMode').value==='definition'?' selected':''}>Len definícia</option>
      </select>
    </div>

    <div class="settings-group">
      <label for="termLang">Jazyk pojmu:</label>
      <select id="termLang" onchange="showCard()">
        ${markSelectedLang(langOptions, document.getElementById('termLang').value)}
      </select>
    </div>

    <div class="settings-group">
      <label for="defLang">Jazyk definície:</label>
      <select id="defLang" onchange="showCard()">
        ${markSelectedLang(langOptions, document.getElementById('defLang').value)}
      </select>
    </div>

    <div class="options-row">
      <label><input type="checkbox" id="shuffleCards"${document.getElementById('shuffleCards').checked?' checked':''}> Prehrať v náhodnom poradí</label>
      <label><input type="checkbox" id="autoPlay"${document.getElementById('autoPlay').checked?' checked':''}> Automatické prehrávanie</label>
      <label><input type="checkbox" id="darkModeToggle"${document.body.classList.contains('dark-mode')?' checked':''}> Tmavý režim</label>
      
      <div class="apply-controls">
         <button onclick="applyAndContinue()" style="background-color: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold;">▶️ Pokračovať s novými nastaveniami</button>
         <button onclick="applyAndRestart()" style="background-color: #f8d7da; border-color: #f5c6cb; color: #721c24;">🔄 Reštartovať s nastaveniami</button>
      </div>
    </div>
  </div>

  <div id="cardDisplay" class="card-container"></div>

  <div class="controls">
    <button onclick="prevCard()">⬅️ Predchádzajúca</button>
    <button onclick="nextCard()">➡️ Ďalšia</button>
    <button onclick="toggleAutoPlayUI()">⏯️ Prehrať/Pozastaviť</button>
  </div>

  <div class="stats" id="cardStats"></div>
  
  <div style="text-align: center; margin-top: 40px; font-size: 12px; color: #777;">
    <b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025)
  </div>

  <script>
    const originalCards = JSON.parse('${JSON.stringify(cards).replace(/'/g, "\\'")}');
    let cards = JSON.parse(JSON.stringify(originalCards));
    let currentIndex = 0;
    let flipped = false;
    let autoPlayTimeout = null;
    let isAutoPlaying = false;

    function shuffleArray(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
    }
    
    function createSpeakerIcon(text, lang) {
      const s = document.createElement('span');
      s.className = 'speaker';
      s.textContent = '🔊';
      s.onclick = (e) => {
        e.stopPropagation();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        speechSynthesis.speak(u);
      };
      return s;
    }
    
    function showCard() {
      if(currentIndex >= cards.length) return;
      const card = cards[currentIndex];
      const bs = document.getElementById('boldSide').value;
      const dm = document.getElementById('displayMode').value;
      const tL = document.getElementById('termLang').value;
      const dL = document.getElementById('defLang').value;
      const cd = document.getElementById('cardDisplay');
      cd.innerHTML = '';
      
      const tb = document.createElement('div');
      const db = document.createElement('div');
      tb.className = 'card-box ' + (bs==='term'?'primary':'secondary');
      db.className = 'card-box ' + (bs==='definition'?'primary':'secondary');
      
      tb.textContent = card.term;
      tb.appendChild(createSpeakerIcon(card.term, tL));
      db.textContent = card.definition;
      db.appendChild(createSpeakerIcon(card.definition, dL));
      
      if(dm==='both') {
        cd.append(tb, db);
      } else {
        const sb = document.createElement('div');
        const isPrimary = ((bs==='term'&&!flipped&&dm==='term')||(bs==='definition'&&!flipped&&dm==='definition')||(bs==='term'&&flipped&&dm==='definition')||(bs==='definition'&&flipped&&dm==='term'));
        sb.className = 'card-box ' + (isPrimary?'primary':'secondary');
        sb.textContent = flipped ? (dm==='term'?card.definition:card.term) : (dm==='term'?card.term:card.definition);
        
        const currentLang = flipped ? (dm==='term'?dL:tL) : (dm==='term'?tL:dL);
        sb.appendChild(createSpeakerIcon(sb.textContent, currentLang));
        
        sb.onclick = () => { flipped=!flipped; showCard(); };
        cd.append(sb);
      }
      document.getElementById('cardStats').textContent = \`Kartička \${currentIndex+1} z \${cards.length}\`;
    }

    function nextCard() {
      stopAutoPlayLogic();
      if(currentIndex < cards.length - 1) {
        currentIndex++; flipped=false; showCard();
        if(isAutoPlaying) triggerAutoPlayCycle();
      } else {
        finishReview();
      }
    }

    function prevCard() {
      stopAutoPlayLogic();
      if(currentIndex > 0) {
        currentIndex--; flipped=false; showCard();
        if(isAutoPlaying) triggerAutoPlayCycle();
      }
    }
    
    function finishReview() {
      stopAutoPlayLogic();
      isAutoPlaying = false;
      document.getElementById('cardDisplay').innerHTML = '<div class="card-box primary"><p>Prehľad ukončený 🎉</p></div>';
      document.getElementById('cardStats').textContent = '';
    }

    /* === APLIKOVANIE NASTAVENÍ === */
    function applyAndContinue() {
      if(document.getElementById('shuffleCards').checked) {
        const remaining = cards.slice(currentIndex + 1);
        shuffleArray(remaining);
        cards = [...cards.slice(0, currentIndex + 1), ...remaining];
      }
      if(document.getElementById('autoPlay').checked) {
        if(!isAutoPlaying) startAutoPlay();
      } else {
        stopAutoPlay();
      }
      showCard();
    }

    function applyAndRestart() {
      if(document.getElementById('shuffleCards').checked) {
        cards = JSON.parse(JSON.stringify(originalCards));
        shuffleArray(cards);
      } else {
        cards = JSON.parse(JSON.stringify(originalCards));
      }
      currentIndex = 0;
      flipped = false;
      showCard();
      if(document.getElementById('autoPlay').checked) {
        startAutoPlay();
      } else {
        stopAutoPlay();
      }
    }

    /* === LOGIKA AUTOMATICKÉHO PREHRÁVANIA === */
    function startAutoPlay() {
      isAutoPlaying = true;
      document.getElementById('autoPlay').checked = true;
      stopAutoPlayLogic();
      triggerAutoPlayCycle();
    }
    function stopAutoPlayLogic() {
      speechSynthesis.cancel();
      if(autoPlayTimeout) {
        clearTimeout(autoPlayTimeout);
        autoPlayTimeout = null;
      }
    }
    function stopAutoPlay() {
      isAutoPlaying = false;
      document.getElementById('autoPlay').checked = false;
      stopAutoPlayLogic();
    }
    function toggleAutoPlayUI() {
      isAutoPlaying ? stopAutoPlay() : startAutoPlay();
    }
    function triggerAutoPlayCycle() {
      if(!isAutoPlaying || currentIndex >= cards.length) return;
      const card = cards[currentIndex];
      const tL = document.getElementById('termLang').value;
      const utterance = new SpeechSynthesisUtterance(card.term);
      utterance.lang = tL;
      
      utterance.onend = () => {
        if(isAutoPlaying) {
          autoPlayTimeout = setTimeout(() => {
            if(currentIndex < cards.length - 1) {
              currentIndex++; flipped=false; showCard();
              triggerAutoPlayCycle();
            } else finishReview();
          }, 10000);
        }
      };
      utterance.onerror = () => {
        if(isAutoPlaying) {
          autoPlayTimeout = setTimeout(() => {
            if(currentIndex < cards.length - 1) {
              currentIndex++; flipped=false; showCard();
              triggerAutoPlayCycle();
            } else finishReview();
          }, 10000);
        }
      };
      speechSynthesis.speak(utterance);
    }
    
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft')  prevCard();
    });

    document.getElementById('darkModeToggle').addEventListener('change', e => { 
      document.body.classList.toggle('dark-mode', e.target.checked); 
    });

    window.addEventListener('load', () => {
      if(document.getElementById('shuffleCards').checked) shuffleArray(cards);
      showCard();
      if(document.getElementById('autoPlay').checked) startAutoPlay();
    });
  <\/script>
</body>
</html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      
      // Úprava názvu súboru
      let fileNamePrefix = topic ? topic : "tema"; // Ak nie je téma zadaná, použije sa slovo "tema"
      
      fileNamePrefix = fileNamePrefix
        .normalize("NFD") // Rozdelí znaky a diakritiku
        .replace(/[\u0300-\u036f]/g, "") // Odstráni diakritiku
        .replace(/[^a-zA-Z0-9]/g, "_") // Nahradí všetko okrem písmen a čísel podčiarkovníkom
        .replace(/_+/g, "_") // Zmaže duplicitné podčiarkovníky (napr. z viacerých medzier za sebou)
        .replace(/^_|_$/g, ""); // Ostráni podčiarkovníky zo začiatku a z konca, ak by tam nejaké zostali
        
      a.download = `${fileNamePrefix}_IA_karticky.html`;
      a.click();
    }
  </script>

  <br><br>
  <b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025)
  <br><br>
</body>
</html>

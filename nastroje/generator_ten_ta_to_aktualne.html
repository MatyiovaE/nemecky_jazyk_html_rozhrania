<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Generátor - Triedenie podstatných mien podľa rodu (ten/tá/to)</title>
  <style>
    body { font-family: monospace; font-size: 17px; padding: 20px; }
    textarea { width: 100%; height: 150px; font-size: 18px; font-family: monospace; padding: 5px; box-sizing: border-box; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 3px; }
    .input-group input[type="text"], .input-group input[type="number"] { width: 100%; font-size: 16px; padding: 5px; box-sizing: border-box; font-family: monospace;}
    
    .flex-row { display: flex; gap: 15px; margin-bottom: 10px; }
    .flex-row > div { flex: 1; }

    .columns { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
    .column { width: 40%; padding: 10px; min-height: 450px; border-radius: 8px; box-sizing: border-box; text-align: center; }
    .ten { background-color: #cce5ff; font-size: 25px; }
    .tá { background-color: #f8d7da; font-size: 25px; }
    .to { background-color: #d4edda; font-size: 25px; }
    .word-ten { background-color: #99ccff; color: #003366; }
    .word-tá { background-color: #f5b7b1; color: #641e16; }
    .word-to { background-color: #a9dfbf; color: #145a32; }
    .word { padding: 5px; margin: 5px; border-radius: 4px; cursor: default; font-weight: bold; font-size: 40px; }
    #feedback { color: red; font-weight: bold; margin-top: 10px; text-align: center; }
    #current-word.wrong-word { color: red; }
    #score { font-weight: bold; margin-top: 10px; }
    button { padding: 8px 12px; font-size: 16px; cursor: pointer; font-family: monospace; margin-top: 5px;}

    /* 🔹 Veľkosť aktuálneho slova */
    #current-word { font-size: 45px; margin-bottom: 10px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<h1>🎯 Generátor hry: Triedenie podstatných mien podľa rodu (ten/tá/to)</h1>

<div class="input-group">
  <label for="gameTitle">Názov hry:</label>
  <input type="text" id="gameTitle" placeholder="Napr.: Triedenie podstatných mien - zvieratá">
</div>

<div class="flex-row">
  <div class="input-group">
    <label for="author">Autor:</label>
    <input type="text" id="author" placeholder="Meno autora">
  </div>
  <div class="input-group">
    <label for="year">Rok:</label>
    <input type="number" id="year" placeholder="2025">
  </div>
</div>

<div class="input-group">
  <label for="input">Zadajte podstatné mená s členmi (ten/tá/to) oddelené klávesom TAB. Každý pár zapisujte do nového riadku.</label>
  <textarea id="input" placeholder="dom[TAB]ten&#10;mačka[TAB]tá&#10;auto[TAB]to"></textarea>
</div>

<div class="input-group">
  <label for="count" style="display:inline-block; margin-right: 10px;">Počet položiek v hre:</label>
  <input type="number" id="count" value="10" min="1" style="width: 80px; display:inline-block;">
</div>

<div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
  <button onclick="generateGame()">Generovať hru (náhľad)</button>
  <button onclick="saveAsHTML()">Uložiť ako HTML</button>
  <button onclick="exportJSON()">Exportovať nastavenia do súboru .json</button>
  <button onclick="document.getElementById('importJSON').click()">Importovať nastavenia zo súboru .json</button>
  <input type="file" id="importJSON" style="display:none" accept=".json" onchange="importJSON(event)">
</div>

<div id="game-area" style="display:none; margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px;">
  <h3 style="text-align: center;">Klikni na správny stĺpec podľa rodu podstatného mena.</h3>
  <div id="current-word"></div>
  <div id="feedback"></div>

  <div class="columns">
    <div class="column ten" onclick="checkAnswer('ten')"><strong>ten</strong><div id="ten-list"></div></div>
    <div class="column tá" onclick="checkAnswer('tá')"><strong>tá</strong><div id="tá-list"></div></div>
    <div class="column to" onclick="checkAnswer('to')"><strong>to</strong><div id="to-list"></div></div>
  </div>

  <div id="score">Skóre: 0</div>
</div>
<br><br><b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025 - 2026)
<br><br>
<script>
  let allPairs = [];
  let gamePairs = [];
  let currentIndex = 0;
  let score = 0;

  const inputEl = document.getElementById('input');
  const feedbackDiv = document.getElementById('feedback');

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 1;
    }
  });

  // Ukladanie a načítanie stavu v generátore
  document.addEventListener('DOMContentLoaded', function() {
    const fields = ['hra_ten_ta_to_input', 'hra_ten_ta_to_title', 'hra_ten_ta_to_author', 'hra_ten_ta_to_year', 'hra_ten_ta_to_count'];
    const ids = ['input', 'gameTitle', 'author', 'year', 'count'];
    fields.forEach((key, index) => {
      const val = localStorage.getItem(key);
      if (val) document.getElementById(ids[index]).value = val;
    });
  });

  ['input', 'gameTitle', 'author', 'year', 'count'].forEach(id => {
    document.getElementById(id).addEventListener('input', function() {
      localStorage.setItem('hra_ten_ta_to_' + id, this.value);
    });
  });

  // Funkcie pre JSON
  function exportJSON() {
    const data = {
      title: document.getElementById('gameTitle').value,
      author: document.getElementById('author').value,
      year: document.getElementById('year').value,
      pairs: document.getElementById('input').value,
      count: document.getElementById('count').value
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nastavenia_ten_ta_to.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if(data.title !== undefined) document.getElementById('gameTitle').value = data.title;
        if(data.author !== undefined) document.getElementById('author').value = data.author;
        if(data.year !== undefined) document.getElementById('year').value = data.year;
        if(data.pairs !== undefined) document.getElementById('input').value = data.pairs;
        if(data.count !== undefined) document.getElementById('count').value = data.count;
        
        // Aktualizácia localStorage
        ['input', 'gameTitle', 'author', 'year', 'count'].forEach(id => {
          localStorage.setItem('hra_ten_ta_to_' + id, document.getElementById(id).value);
        });
      } catch (err) {
        console.error("Chyba pri čítaní JSON súboru", err);
      }
      event.target.value = ''; // Reset inputu
    };
    reader.readAsText(file);
  }


  function generateGame() {
    feedbackDiv.innerHTML = '';
    const rawInput = inputEl.value.trim();
    if (!rawInput) {
      feedbackDiv.textContent = '⚠️ Vstupné pole je prázdne.';
      return;
    }

    const lines = rawInput.split('\n');
    allPairs = [];
    const ALLOWED = ['ten', 'tá', 'to'];

    for (let line of lines) {
      const parts = line.split('\t');
      if (parts.length === 2) {
        const word = parts[0].trim();
        const article = parts[1].trim().toLowerCase();
        if (ALLOWED.includes(article)) allPairs.push({ word, article });
      }
    }

    if (allPairs.length === 0) {
      feedbackDiv.textContent = '⚠️ Nebola nájdená žiadna platná položka pre hru.';
      return;
    }

    const count = parseInt(document.getElementById('count').value, 10);
    gamePairs = shuffleArray(allPairs).slice(0, count).map(x => ({ ...x, firstTry: null }));
    currentIndex = 0;
    score = 0;

    document.getElementById('ten-list').innerHTML = '';
    document.getElementById('tá-list').innerHTML = '';
    document.getElementById('to-list').innerHTML = '';
    document.getElementById('score').textContent = 'Skóre: 0';
    document.getElementById('game-area').style.display = 'block';

    showNextWord();
  }

  function showNextWord() {
    const currentWordDiv = document.getElementById('current-word');
    feedbackDiv.innerHTML = '';
    if (currentIndex < gamePairs.length) {
      currentWordDiv.textContent = gamePairs[currentIndex].word;
      currentWordDiv.classList.remove('wrong-word');
    } else {
      currentWordDiv.textContent = '🎉 Hotovo!';
    }
  }

  function checkAnswer(selectedArticle) {
    if (currentIndex >= gamePairs.length) return;
    const correctArticle = gamePairs[currentIndex].article;
    const word = gamePairs[currentIndex].word;

    // Hodnotí sa iba prvý pokus, za nesprávny sa neodčítava
    if (gamePairs[currentIndex].firstTry === null) {
      gamePairs[currentIndex].firstTry = selectedArticle;
      if (selectedArticle === correctArticle) {
        score++;
      }
    }

    if (selectedArticle === correctArticle) {
      document.getElementById(selectedArticle + '-list').innerHTML += `<div class="word word-${selectedArticle}">${word}</div>`;
      currentIndex++;
      showNextWord();
      feedbackDiv.textContent = '';
    } else {
      document.getElementById('current-word').classList.add('wrong-word');
      feedbackDiv.innerHTML = '❌ Nesprávny pokus. Skús znova!';
    }
    document.getElementById('score').textContent = `Skóre: ${score}`;
  }

  function shuffleArray(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  // --- funkcia na uloženie hry ako HTML ---
  function saveAsHTML() {
    const rawInput = document.getElementById('input').value.trim();
    const count = parseInt(document.getElementById('count').value);
    
    const gameTitle = document.getElementById('gameTitle').value.trim() || 'Triedenie podstatných mien podľa rodu (ten/tá/to)';
    const gameAuthor = document.getElementById('author').value.trim() || 'Mgr. Erika Matyiová';
    const gameYear = document.getElementById('year').value.trim() || '2025';

    const lines = rawInput.split('\n');
    const allPairsExport = [];

    for (let line of lines) {
      const [word, article] = line.split('\t');
      if (word && article && ['ten', 'tá', 'to'].includes(article.trim())) {
        allPairsExport.push({ word: word.trim(), article: article.trim() });
      }
    }

    const jsonPairs = JSON.stringify(allPairsExport).replace(/</g, '\\u003c');

    const htmlContent = `<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>${gameTitle}</title>
  <style>
    body { font-family: monospace; font-size: 20px; padding: 20px; background:#f7f7f7; color:#222; }
    h2 { margin-bottom: 5px; }
    .columns { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
    .column { width: 33%; padding: 10px; min-height: 450px; border-radius: 8px; box-sizing: border-box; text-align: center; }
    .ten { background-color: #cce5ff; font-size: 25px; }
    .tá { background-color: #f8d7da; font-size: 25px; }
    .to { background-color: #d4edda; font-size: 25px; }
    .word-ten { background-color: #99ccff; color: #003366; }
    .word-tá { background-color: #f5b7b1; color: #641e16; }
    .word-to { background-color: #a9dfbf; color: #145a32; }
    .word { padding:5px; margin:5px; border-radius:4px; cursor:default; font-weight:bold; font-size:40px;}
    #feedback { color:red; font-weight:bold; margin-top:10px; text-align:center; }
    #current-word.wrong-word { color:red; }
    #score { font-weight:bold; margin-top:10px; }
    button { padding: 8px 12px; font-size: 16px; cursor: pointer; font-family: monospace; }

    #current-word { font-size: 45px; margin-bottom: 10px; text-align: center; font-weight: bold; }

    #final, #detailsSection { margin-top:20px; }
    #detailsTable { width:100%; border-collapse:collapse; margin-top:15px; font-size:18px; background: #fff; }
    #detailsTable th, #detailsTable td { border:1px solid #aaa; padding:8px; text-align:center; }
    #detailsTable th { background:#e2e2e2; }
    .symbolExplain { margin-top:10px; color:#444; font-weight: bold; }

    @media print {
      body { background:#fff; color:#000; padding: 0;}
      input, button, label, #game-area, #feedback, #current-word, #score, .columns, #final, .no-print { display:none !important; }
      #detailsSection { display:block !important; }
      h2 { text-align:center; }
    }
  </style>
</head>
<body>

<h2 class="no-print">🎯 ${gameTitle}</h2>

<div class="no-print" style="margin-bottom: 15px;">
  <label for="studentName">Meno žiaka:</label>
  <input type="text" id="studentName" placeholder="Zadajte meno žiaka" style="font-size:18px; padding:4px;">
  &nbsp;&nbsp;
  <label for="count">Počet položiek v hre:</label>
  <input type="number" id="count" value="${count}" min="1" style="font-size:18px; width:60px; padding:4px;">
  <button onclick="startGame()">Spustiť hru</button>
</div>

<div id="game-area" style="display:none;">
  <h3 style="text-align:center;">Klikni na správny stĺpec podľa rodu podstatného mena.</h3>
  <div id="current-word"></div>
  <div id="feedback"></div>

  <div class="columns">
    <div class="column ten" onclick="checkAnswer('ten')"><strong>ten</strong><div id="ten-list"></div></div>
    <div class="column tá" onclick="checkAnswer('tá')"><strong>tá</strong><div id="tá-list"></div></div>
    <div class="column to" onclick="checkAnswer('to')"><strong>to</strong><div id="to-list"></div></div>
  </div>

  <div id="score">Skóre: 0</div>
</div>

<div id="final" style="display:none; text-align:center;"></div>
<div id="detailsSection" style="display:none;"></div>

<script>
  const allPairs = ${jsonPairs};
  const gameTitleString = "${gameTitle}";
  let gamePairs = [];
  let currentIndex = 0;
  let score = 0;

  function shuffleArray(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startGame() {
    const count = parseInt(document.getElementById('count').value);
    gamePairs = shuffleArray(allPairs).slice(0, count).map(x => ({
      ...x, userAnswer: null, firstTry: null
    }));

    currentIndex = 0;
    score = 0;
    document.getElementById('ten-list').innerHTML = '';
    document.getElementById('tá-list').innerHTML = '';
    document.getElementById('to-list').innerHTML = '';
    document.getElementById('score').textContent = 'Skóre: 0';
    document.getElementById('game-area').style.display = 'block';
    document.getElementById('final').style.display = 'none';
    document.getElementById('detailsSection').style.display = 'none';
    showNextWord();
  }

  function showNextWord() {
    const currentWordDiv = document.getElementById('current-word');
    const feedbackDiv = document.getElementById('feedback');
    if (currentIndex < gamePairs.length) {
      currentWordDiv.textContent = gamePairs[currentIndex].word;
      currentWordDiv.classList.remove('wrong-word');
      feedbackDiv.textContent = '';
    } else {
      finishGame();
    }
  }

  function checkAnswer(selectedArticle) {
    if (currentIndex >= gamePairs.length) return;
    const item = gamePairs[currentIndex];
    const correct = item.article;

    // Iba prvý pokus sa boduje, body sa neodčítavajú
    if (item.firstTry === null) {
      item.firstTry = selectedArticle;
      if (selectedArticle === correct) {
        score++;
      }
    }
    item.userAnswer = selectedArticle;

    const feedbackDiv = document.getElementById('feedback');
    const currentWordDiv = document.getElementById('current-word');

    if (selectedArticle === correct) {
      const wordDiv = \`<div class="word word-\${selectedArticle}">\${item.word}</div>\`;
      document.getElementById(selectedArticle + '-list').innerHTML += wordDiv;
      
      currentIndex++;
      document.getElementById('score').textContent = \`Skóre: \${score}\`;
      feedbackDiv.textContent = '';
      setTimeout(showNextWord, 200);
    } else {
      feedbackDiv.innerHTML = '❌ Nesprávny pokus. Skús znova!';
      currentWordDiv.classList.add('wrong-word');
    }
  }

  function finishGame() {
    document.getElementById('current-word').textContent = '🎉 Hotovo!';
    const finalDiv = document.getElementById('final');
    finalDiv.innerHTML = \`<button id="detailsBtn" style="font-size:20px; padding:10px 20px; margin-top:20px;">Detailné výsledky</button>\`;
    finalDiv.style.display = 'block';
    document.getElementById('detailsBtn').addEventListener('click', showDetails);
  }

  function removeDiacritics(str) {
    return str.normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");
  }

  function sanitizeFilename(str) {
    if (!str) return 'Hra';
    let s = removeDiacritics(str);
    s = s.replace(/[ \\-\\(\\)\\.,]/g, '_'); 
    s = s.replace(/[^a-zA-Z0-9_]/g, ''); 
    return s;
  }

  function showDetails() {
    document.getElementById('final').style.display = 'none'; // skryje tlacidlo

    const total = gamePairs.length;
    const percent = Math.round((score / total) * 100);
    const dateObj = new Date();
    const dateStr = dateObj.toLocaleDateString('sk-SK');
    const timeStr = dateObj.toLocaleTimeString('sk-SK');
    const studentName = document.getElementById('studentName').value.trim() || '—';

    let html = \`<h2 style="text-align:center;">Detailné výsledky</h2>\`;
    html += \`<div style="font-size: 18px; line-height: 1.6;">\`;
    html += \`<div><strong>Názov:</strong> \${gameTitleString}</div>\`;
    html += \`<div><strong>Meno žiaka:</strong> \${studentName}</div>\`;
    html += \`<div><strong>Bodovanie a percentuálny výsledok:</strong> \${score} / \${total}, \${percent} %</div>\`;
    html += \`<div><strong>Dátum a čas:</strong> \${dateStr}, \${timeStr}</div>\`;
    html += \`</div>\`;

    html += \`<table id="detailsTable"><tr><th>Zadanie</th><th>Odpoveď žiaka</th><th>Správna odpoveď</th></tr>\`;
    for (const i of gamePairs) {
      let sym = (i.firstTry === i.article) ? '✅' : '❌';
      html += \`<tr><td>\${i.word}</td><td>\${i.firstTry || '—'} \${sym}</td><td>\${i.article}</td></tr>\`;
    }
    html += \`</table>\`;
    html += \`<div class="symbolExplain">✅ = správna odpoveď &nbsp;&nbsp; ❌ = nesprávna odpoveď</div>\`;
    
    html += \`<div class="no-print" style="margin-top:20px; text-align:center;">
               <button onclick="window.print()" style="font-size:20px; padding:10px 20px;">🖨️ Uložiť do PDF (Ctrl + P)</button>
             </div>\`;

    const details = document.getElementById('detailsSection');
    details.innerHTML = html;
    details.style.display = 'block';

    // Pripravit bezpecny nazov suboru pre pripadnu tlac
    const safeTitle = sanitizeFilename(gameTitleString);
    const safeStudent = sanitizeFilename(studentName === '—' ? 'Nezname_meno' : studentName);
    document.title = safeStudent + '_' + safeTitle;
  }
<\/script>

<br><br><b class="no-print">Spracoval(a) pomocou UI:</b> <span class="no-print">${gameAuthor} (${gameYear})</span>
<br><br>
</body>
</html>`;

    const blob = new Blob([htmlContent], { type: 'text/html' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'hra_ten_ta_to.html';
    link.click();
    URL.revokeObjectURL(link.href);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multigenerátor: Zobrazovač & Koleso</title>
    <style>
        body {
            font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333;
            max-width: 1000px; margin: 0 auto; padding: 20px;
        }
        h1 { text-align: center; color: #2c3e50; }
        
        /* Globálne polia */
        .global-settings {
            background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px;
            display: flex; gap: 20px; border-left: 4px solid #2980b9;
        }
        .form-group { flex: 1; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }

        /* Ušká (Taby) */
        .tabs { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
        .tab-btn {
            background: #e0e0e0; border: none; padding: 10px 20px; font-size: 16px;
            cursor: pointer; border-radius: 8px 8px 0 0; margin-right: 5px; font-weight: bold;
        }
        .tab-btn.active { background: #2c3e50; color: white; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #ccc; border-top: none; }
        .tab-content.active { display: block; }

        /* Špecifické pre Zobrazovač */
        .toolbar button {
            padding: 5px 10px; margin-right: 5px; margin-bottom: 5px; font-size: 12px;
            cursor: pointer; background-color: #e0e0e0; border: 1px solid #aaa; border-radius: 3px;
        }
        .help-text { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
        textarea.zobrazovac-ta { font-family: monospace; height: 200px; }
        
        /* Špecifické pre Koleso */
        textarea.koleso-ta { font-family: 'Monaco', monospace; height: 150px; }

        textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; }

        /* Spodné tlačidlá */
        .actions { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; color: white; font-weight: bold; }
        .btn-blue { background-color: #3498db; }
        .btn-orange { background-color: #f39c12; }
        .btn-green { background-color: #2ecc71; font-size: 18px; width: 100%; margin-top: 10px; padding: 15px; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>Multigenerátor nástrojov</h1>

    <div class="global-settings">
        <div class="form-group">
            <label for="autor">Meno autora:</label>
            <input type="text" id="autor" placeholder="Zadajte meno autora">
        </div>
        <div class="form-group">
            <label for="rok">Rok:</label>
            <input type="number" id="rok" placeholder="Napr. 2026">
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-zobrazovac', this)">Zobrazovač zadaní</button>
        <button class="tab-btn" onclick="switchTab('tab-koleso', this)">Koleso náhodného výberu</button>
    </div>

    <div id="tab-zobrazovac" class="tab-content active">
        <div style="display: flex; gap: 20px;">
            <div class="form-group">
                <label for="predmet">Predmet:</label>
                <input type="text" id="predmet" placeholder="Napr. Matematika">
            </div>
            <div class="form-group">
                <label for="tema">Téma:</label>
                <input type="text" id="tema" placeholder="Napr. Sčítanie a odčítanie">
            </div>
        </div>

        <div class="form-group">
            <label>Zadania / Otázky:</label>
            <span class="help-text">Dáta zadávaj vo formáte: <b>typ[TAB]text</b> (Klávesa TAB je podporovaná).</span>
            <textarea id="dataInput" class="zobrazovac-ta" placeholder="otázka&#9;Koľko mesiacov má rok?&#10;zadanie&#9;Vypočítaj príklad 8 + 10 ="></textarea>
        </div>

        <div class="toolbar">
            <button onclick="insertTag('<b>', '</b>')">&lt;b&gt;</button>
            <button onclick="insertTag('<i>', '</i>')">&lt;i&gt;</button>
            <button onclick="insertTag('<u>', '</u>')">&lt;u&gt;</button>
            <button onclick="insertTag('<p>', '</p>')">&lt;p&gt;</button>
            <button onclick="insertTag('<h>', '</h>')">&lt;h&gt;</button>
            <button onclick="insertTag('<span>', '</span>')">&lt;span&gt;</button>
            <button onclick="insertTag('<br>', '')">&lt;br&gt;</button>
        </div>
    </div>

    <div id="tab-koleso" class="tab-content">
        <div class="form-group">
            <label for="koleso-nazov">Názov kolesa:</label>
            <input type="text" id="koleso-nazov" placeholder="Zadajte názov kolesa" value="Koleso náhodného výberu">
        </div>

        <div class="form-group">
            <label>Položky na kolese:</label>
            <span class="help-text">Každú položku zadajte na zvláštny riadok.</span>
            <textarea id="koleso-items" class="koleso-ta" placeholder="Položka 1&#10;Položka 2"></textarea>
        </div>

        <div class="form-group">
            <label for="koleso-pokyn">Pokyn pre žiaka:</label>
            <input type="text" id="koleso-pokyn" value="Klikni na stred kruhu.">
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-blue" onclick="exportData()">Exportovať nastavenia (.json)</button>
        <button class="btn btn-orange" onclick="document.getElementById('importFile').click()">Importovať nastavenia (.json)</button>
        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
        <button class="btn btn-green" onclick="generateCombinedHTML()">Stiahnuť ZLÚČENÝ súbor (.html)</button>
    </div>
<br><br>
<b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2026)
<br><br>
    <script>
        // Logika prepínania ušiek
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // Podpora TAB v textovom poli Zobrazovača
        document.getElementById('dataInput').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
            }
        });

        // Vkladanie tagov
        function insertTag(startTag, endTag) {
            const textarea = document.getElementById('dataInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + startTag + text.substring(start, end) + endTag + text.substring(end);
            textarea.focus();
            textarea.selectionStart = start + startTag.length;
            textarea.selectionEnd = end + startTag.length;
        }

        // Export dát
        function exportData() {
            const data = {
                autor: document.getElementById('autor').value,
                rok: document.getElementById('rok').value,
                zobrazovac: {
                    predmet: document.getElementById('predmet').value,
                    tema: document.getElementById('tema').value,
                    obsah: document.getElementById('dataInput').value
                },
                koleso: {
                    nazov: document.getElementById('koleso-nazov').value,
                    items: document.getElementById('koleso-items').value,
                    pokyn: document.getElementById('koleso-pokyn').value
                }
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "multigenerator_nastavenia.json";
            a.click();
        }

        // Import dát
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if(data.autor !== undefined) document.getElementById('autor').value = data.autor;
                    if(data.rok !== undefined) document.getElementById('rok').value = data.rok;
                    
                    if(data.zobrazovac) {
                        if(data.zobrazovac.predmet !== undefined) document.getElementById('predmet').value = data.zobrazovac.predmet;
                        if(data.zobrazovac.tema !== undefined) document.getElementById('tema').value = data.zobrazovac.tema;
                        if(data.zobrazovac.obsah !== undefined) document.getElementById('dataInput').value = data.zobrazovac.obsah;
                    }
                    
                    if(data.koleso) {
                        if(data.koleso.nazov !== undefined) document.getElementById('koleso-nazov').value = data.koleso.nazov;
                        if(data.koleso.items !== undefined) document.getElementById('koleso-items').value = data.koleso.items;
                        if(data.koleso.pokyn !== undefined) document.getElementById('koleso-pokyn').value = data.koleso.pokyn;
                    }
                } catch (err) { alert('Chyba pri čítaní súboru JSON.'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Generovanie zlúčeného HTML
        function generateCombinedHTML() {
            const autor = document.getElementById('autor').value || 'Neznámy autor';
            const rok = document.getElementById('rok').value || new Date().getFullYear();
            
            // Dáta pre Zobrazovač
            const predmet = document.getElementById('predmet').value;
            const tema = document.getElementById('tema').value;
            const zLines = document.getElementById('dataInput').value.split('\n');
            let poleZadani = [];
            zLines.forEach(line => {
                if(line.trim() === '') return;
                const parts = line.split('\t');
                if (parts.length >= 2) poleZadani.push({ type: parts[0].trim(), text: parts.slice(1).join('\t').trim() });
                else poleZadani.push({ type: 'Zadanie/Otázka', text: line.trim() });
            });

            // Dáta pre Koleso
            const kNazov = document.getElementById('koleso-nazov').value || "Koleso náhodného výberu";
            const kItems = document.getElementById('koleso-items').value.split('\n').map(s => s.trim()).filter(s => s !== "");
            const kPokyn = document.getElementById('koleso-pokyn').value;

            if(poleZadani.length === 0 && kItems.length === 0) {
                alert('Zadajte dáta aspoň pre jeden z nástrojov!');
                return;
            }

            const combinedHTML = `<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívne nástroje</title>
    <style>
        /* SPOLOČNÉ CSS PRE OBAL A UŠKÁ */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .app-header { background: #2c3e50; padding: 10px 20px; display: flex; justify-content: center; gap: 10px; }
        .nav-btn { background: #34495e; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .nav-btn.active { background: #2ecc71; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .nav-btn:hover:not(.active) { background: #455a64; }
        .tool-container { flex: 1; display: none; background: white; width: 100%; box-sizing: border-box; }
        .tool-container.active { display: block; }
        footer { text-align: center; padding: 15px; background: #ddd; font-family: Arial, sans-serif; color: #555; }

        /* --- CSS PRE ZOBRAZOVAČ --- */
        #zobrazovac-wrapper { font-family: 'Monaco', monospace; color: darkgreen; font-weight: bold; padding: 20px; max-width: 1200px; margin: 0 auto; }
        #zobrazovac-wrapper h1, #zobrazovac-wrapper h2 { text-align: center; }
        #zobrazovac-wrapper .meta-info { text-align: center; margin-bottom: 30px; font-size: 1.2em; }
        #setup-screen { text-align: center; margin-top: 50px; padding: 30px; border: 2px dashed darkgreen; }
        #setup-screen input { font-family: 'Monaco', monospace; font-weight: bold; font-size: 1.2em; width: 80px; text-align: center; color: darkgreen; }
        #zobrazovac-wrapper button { font-family: 'Monaco', monospace; font-weight: bold; font-size: 1.5em; color: darkgreen; background-color: #e8f5e9; border: 2px solid darkgreen; padding: 10px 30px; cursor: pointer; border-radius: 8px; margin-top: 20px; }
        #zobrazovac-wrapper button:hover { background-color: #c8e6c9; }
        #quiz-screen { display: none; }
        .counter-text { font-size: 1.2em; color: #555; margin-bottom: 10px; }
        .active-item { font-size: 4em; text-align: center; line-height: 1.3; margin-bottom: 30px; padding: 20px; border: 3px solid darkgreen; background-color: #f1f8e9; }
        .upcoming-item { font-size: 2em; text-align: center; opacity: 0.9; margin-top: 20px; padding: 10px; border-bottom: 1px dotted darkgreen; }

        /* --- CSS PRE KOLESO --- */
        #koleso-wrapper { font-family: 'Comic Sans MS', cursive; text-align: center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #koleso-wrapper .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        #startBtn, #nextBtnKoleso { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 1.1em; margin-top: 10px; font-family: 'Comic Sans MS', cursive; }
        #wheel-ui { display: none; flex-direction: column; align-items: center; }
        .wheel-box { position: relative; display: flex; align-items: center; margin: 20px; }
        .arrow { width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-left: 40px solid #27ae60; margin-right: 15px; z-index: 5; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); }
        #result-box { margin-top: 20px; display: none; }
        #winner-text { font-size: 2em; font-weight: bold; color: #2980b9; background: #f0f8ff; padding: 10px 30px; border-radius: 10px; border: 2px dashed #2980b9; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-header">
        <button class="nav-btn active" onclick="switchTool('zobrazovac', this)">Zobrazovač zadaní</button>
        <button class="nav-btn" onclick="switchTool('koleso', this)">Koleso výberu</button>
    </div>

    <div id="tool-zobrazovac" class="tool-container active">
        <div id="zobrazovac-wrapper">
            <h1 style="font-size: 2.5em;">Zobrazovač zadaní/otázok</h1>
            <div class="meta-info">Autor: ${autor} | Rok: ${rok}</div>
            
            <div id="setup-screen">
                <label style="font-size: 1.5em;">Zadajte počet zadaní/otázok, ktoré sa majú zobraziť: 
                    <input type="number" id="q-count" min="1" max="${poleZadani.length || 1}" value="${poleZadani.length || 1}">
                </label><br>
                <button id="start-btn-zob">Štart</button>
            </div>

            <div id="quiz-screen">
                <div id="active-container"></div>
                <button id="next-btn-zob" style="display:block; margin: 30px auto;">Ďalej</button>
                <div id="upcoming-container"></div>
            </div>
        </div>
    </div>

    <div id="tool-koleso" class="tool-container">
        <div id="koleso-wrapper">
            <div id="intro-koleso">
                <h1>${kNazov}</h1>
                <div class="meta">Autor: ${autor} | Rok: ${rok}</div>
                <button id="startBtn" onclick="initWheel()">Štart Koleso</button>
            </div>

            <div id="wheel-ui">
                <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 15px;">${kPokyn}</div>
                <div class="wheel-box">
                    <div class="arrow"></div>
                    <canvas id="canvas" width="500" height="500"></canvas>
                </div>
                <div id="result-box">
                    <div id="winner-text"></div>
                    <button id="nextBtnKoleso" onclick="removeAndReset()">Hotovo</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Autor: ${autor} | Rok: ${rok} ${predmet ? '| Predmet: ' + predmet : ''} ${tema ? '| Téma: ' + tema : ''}
    </footer>

    <script>
        // SPOLOČNÁ LOGIKA PREPÍNANIA NÁSTROJOV
        function switchTool(toolId, btn) {
            document.querySelectorAll('.tool-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tool-' + toolId).classList.add('active');
            btn.classList.add('active');
        }

        // --- LOGIKA ZOBRAZOVAČA ---
        const rawZItems = ${JSON.stringify(poleZadani)};
        let zActiveItems = [];
        let zCurrentIndex = 0;
        let zItemsShuffled = [];

        function shuffle(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if(rawZItems.length > 0) {
                zItemsShuffled = shuffle(rawZItems);
            }
        });

        document.getElementById('start-btn-zob').addEventListener('click', () => {
            if(rawZItems.length === 0) { alert('Zobrazovač neobsahuje žiadne dáta.'); return; }
            let count = parseInt(document.getElementById('q-count').value, 10);
            if(isNaN(count) || count < 1) count = 1;
            if(count > zItemsShuffled.length) count = zItemsShuffled.length;
            
            zActiveItems = zItemsShuffled.slice(0, count);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            renderZob();
        });

        document.getElementById('next-btn-zob').addEventListener('click', () => {
            zCurrentIndex++;
            renderZob();
        });

        function renderZob() {
            const activeContainer = document.getElementById('active-container');
            const upcomingContainer = document.getElementById('upcoming-container');
            const nextBtn = document.getElementById('next-btn-zob');

            if (zCurrentIndex >= zActiveItems.length) {
                activeContainer.innerHTML = '<div class="active-item" style="text-align:center;">Všetky zadania boli dokončené!</div>';
                upcomingContainer.innerHTML = '';
                nextBtn.style.display = 'none';
                return;
            }

            const current = zActiveItems[zCurrentIndex];
            let typeCap = current.type.charAt(0).toUpperCase() + current.type.slice(1);

            activeContainer.innerHTML = \`
                <div class="counter-text">\${typeCap} číslo \${zCurrentIndex + 1} z celkového počtu \${zActiveItems.length}</div>
                <div class="active-item">\${current.text}</div>
            \`;

            nextBtn.style.display = (zCurrentIndex === zActiveItems.length - 1) ? 'none' : 'block';

            let upcomingHTML = '';
            for (let i = zCurrentIndex + 1; i < zActiveItems.length; i++) {
                let uType = zActiveItems[i].type.charAt(0).toUpperCase() + zActiveItems[i].type.slice(1);
                upcomingHTML += \`
                    <div class="upcoming-item">
                        <span style="font-size: 0.6em; color: #555;">\${uType} číslo \${i + 1}</span><br>
                        \${zActiveItems[i].text}
                    </div>
                \`;
            }
            upcomingContainer.innerHTML = upcomingHTML;
        }

        // --- LOGIKA KOLESA ---
        let kItems = ${JSON.stringify(kItems)};
        let kColors = [];
        let kAngle = 0;
        let kSpinning = false;
        let kWinnerIdx = -1;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function initWheel() {
            if(kItems.length === 0) { alert('Koleso neobsahuje žiadne dáta.'); return; }
            document.getElementById('intro-koleso').style.display = 'none';
            document.getElementById('wheel-ui').style.display = 'flex';
            generateColors();
            drawWheel();
        }

        function generateColors() {
            kColors = [];
            for(let i=0; i<kItems.length; i++) {
                let h = (i * (360 / kItems.length) + Math.random() * 20) % 360;
                kColors.push('hsl(' + h + ', 75%, 93%)');
            }
        }

        function drawWheel() {
            if(kItems.length === 0) {
                ctx.clearRect(0,0,500,500);
                return;
            }
            const n = kItems.length;
            const arc = (Math.PI * 2) / n;
            ctx.clearRect(0,0,500,500);

            kItems.forEach((text, i) => {
                const start = kAngle + i * arc;
                ctx.fillStyle = kColors[i];
                ctx.beginPath();
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 240, start, start + arc);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; 
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(start + arc / 2 + Math.PI); 
                
                ctx.textAlign = "left";
                ctx.textBaseline = "middle"; 
                ctx.fillStyle = "#2c3e50";
                
                let fontSize = Math.min(30, (440 * arc) / (text.length * 0.55));
                if(fontSize < 12) fontSize = 12;
                ctx.font = "bold " + fontSize + "px 'Comic Sans MS'";
                
                let displayText = text;
                if(ctx.measureText(text).width > 185) {
                   while(ctx.measureText(displayText + "...").width > 185 && displayText.length > 0) {
                       displayText = displayText.slice(0, -1);
                   }
                   displayText += "...";
                }

                ctx.fillText(displayText, -220, 2);
                ctx.restore();
            });

            let g = ctx.createRadialGradient(250,250,120,250,250,240);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(1, 'rgba(0,0,0,0.04)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(250,250,240,0,Math.PI*2); ctx.fill();

            ctx.beginPath(); ctx.arc(250,250,45,0,Math.PI*2);
            ctx.fillStyle = "#39ff14"; ctx.fill();
            ctx.strokeStyle = "#27ae60"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = "16px 'Comic Sans MS'";
            ctx.textAlign = "center"; ctx.fillText("Toč 🙂", 250, 255);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left - 250;
            const y = e.clientY - rect.top - 250;
            if(Math.sqrt(x*x + y*y) < 45 && !kSpinning && kItems.length > 0) {
                spinWheel();
            }
        };

        function spinWheel() {
            kSpinning = true;
            document.getElementById('result-box').style.display = 'none';
            let speed = 0.35 + Math.random() * 0.15;
            function animate() {
                kAngle += speed;
                speed *= 0.986;
                drawWheel();
                if(speed > 0.002) requestAnimationFrame(animate);
                else {
                    kSpinning = false;
                    const n = kItems.length;
                    const arc = (Math.PI * 2) / n;
                    let norm = (Math.PI - (kAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                    kWinnerIdx = Math.floor(norm / arc);
                    document.getElementById('winner-text').innerText = kItems[kWinnerIdx];
                    document.getElementById('result-box').style.display = 'block';
                }
            }
            animate();
        }

        function removeAndReset() {
            kItems.splice(kWinnerIdx, 1);
            kColors.splice(kWinnerIdx, 1);
            document.getElementById('result-box').style.display = 'none';
            kWinnerIdx = -1;
            drawWheel();
            if(kItems.length === 0) {
                document.getElementById('winner-text').innerText = "Všetky položky boli vyžrebované!";
                document.getElementById('result-box').style.display = 'block';
                document.getElementById('nextBtnKoleso').style.display = 'none';

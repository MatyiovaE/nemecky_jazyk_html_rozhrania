<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Skloňovanie určitého člena v nemčine (N/D/A) - PSV</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f4f8;
        padding: 20px;
    }
    h2 {
        text-align: center;
    }
    table {
        border-collapse: collapse;
        margin: 0 auto;
        border: 2px solid white;
    }
    th, td {
        border: 2px solid white;
        width: 150px;
        height: 50px;
        text-align: center;
        font-size: 18px;
    }
    th {
        background-color: white;
        color: black;
    }
    .white-cell {
        background-color: white;
        color: black;
        font-weight: bold;
    }
    .lightblue { background-color: #add8e6; }
    .lightpink { background-color: #ffb6c1; }
    .lightgreen { background-color: #90ee90; }
    .lightgray { background-color: #d3d3d3; }
    .lightorange { background-color: #ffd580; }
    .darkgreen { background-color: #3cb371; }
    .message {
        text-align: center;
        font-size: 18px;
        margin-bottom: 10px;
    }
    .error {
        color: red;
    }
    .score {
        text-align: center;
        font-size: 20px;
        margin-top: 15px;
        font-weight: bold;
    }
    #currentItem {
        text-align: center;
        font-size: 26px;
        margin-bottom: 10px;
        font-weight: bold;
    }
    td[data-answer] {
        font-size: 22px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h2>Skloňovanie určitého člena v nemčine (N/D/A) - priama spätná väzba</h2>
<p class="message">Kam patrí tento tvar určitého člena? Klikni do správnej bunky.</p>
<div id="currentItem"></div>
<div id="feedback" class="message"></div>

<table>
    <tr>
        <th>pád</th>
        <th>mužský rod</th>
        <th>ženský rod</th>
        <th>stredný rod</th>
        <th>množné číslo</th>
    </tr>
    <tr>
        <td class="white-cell">nominatív</td>
        <td class="lightblue" data-answer="der"></td>
        <td class="lightpink" data-answer="die"></td>
        <td class="lightgreen" data-answer="das"></td>
        <td class="lightgray" data-answer="die"></td>
    </tr>
    <tr>
        <td class="white-cell">datív</td>
        <td class="lightorange" data-answer="dem"></td>
        <td class="lightorange" data-answer="der"></td>
        <td class="lightorange" data-answer="dem"></td>
        <td class="lightorange" data-answer="der"></td>
    </tr>
    <tr>
        <td class="white-cell">akuzatív</td>
        <td class="darkgreen" data-answer="den"></td>
        <td class="darkgreen" data-answer="die"></td>
        <td class="darkgreen" data-answer="das"></td>
        <td class="darkgreen" data-answer="die"></td>
    </tr>
</table>

<div class="score" id="scoreDisplay"></div>

<script>
const cells = Array.from(document.querySelectorAll("td[data-answer]"));
let items = [];
cells.forEach(cell => {
    items.push({answer: cell.dataset.answer});
});
let randomizedItems = shuffleArray(items.slice());
let currentIndex = 0;
let score = 0;
let total = cells.length;
let mistakesForCurrent = false;

function shuffleArray(arr) {
    for (let i = arr.length -1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showCurrentItem() {
    if (currentIndex >= randomizedItems.length) {
        const percent = Math.round((score / total) * 100);
        document.getElementById("currentItem").textContent = "";
        document.getElementById("feedback").textContent = "";
        document.getElementById("scoreDisplay").textContent = `${score}/${total} bodov (${percent}%)`;
        return;
    }
    document.getElementById("currentItem").style.color = "black";
    document.getElementById("currentItem").textContent = randomizedItems[currentIndex].answer;
    document.getElementById("feedback").innerHTML = "";
    mistakesForCurrent = false;
}

cells.forEach(cell => {
    cell.addEventListener("click", () => {
        if (currentIndex >= randomizedItems.length) return;
        const current = randomizedItems[currentIndex];
        if (cell.dataset.answer === current.answer) {
            cell.textContent = cell.dataset.answer;
            if (!mistakesForCurrent) {
                score++;
            }
            currentIndex++;
            setTimeout(showCurrentItem, 500);
        } else {
            document.getElementById("feedback").innerHTML = 'Nesprávne. Skús to znova.<br>Teraz klikni do správnej bunky.';
            document.getElementById("feedback").classList.add("error");
            mistakesForCurrent = true;
        }
    });
});

showCurrentItem();
</script>
<br><br>
<b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025)
<br><br>
</body>
</html>

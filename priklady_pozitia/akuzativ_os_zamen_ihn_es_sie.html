<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvičenie</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            color: #0056b3;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            text-align: center;
            margin-top: 0;
        }
        .meta-info {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .student-name {
            margin-bottom: 30px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
        .student-name label {
            font-weight: bold;
            margin-right: 10px;
        }
        .student-name input {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1rem;
            width: 250px;
        }
        
        .sub-question {
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 15px;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            transition: box-shadow 0.2s;
        }
        .sub-question:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-color: #adb5bd;
        }

        .sentence {
            font-size: 1.1rem;
            flex: 1; 
            padding-right: 20px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            min-width: 30%;
        }

        .placeholder {
            font-weight: bold;
            color: #007bff;
            padding: 0 5px;
            border-bottom: 2px dotted #007bff;
            min-width: 50px;
            display: inline-block;
            text-align: center;
            cursor: default;
        }
        
        .placeholder.filled {
            color: #000;
            border-bottom: 2px solid #333;
        }
        
        .placeholder.evaluated-correct {
            background-color: #d4edda;
            color: #155724;
            border-bottom: 2px solid #28a745;
            border-radius: 3px;
        }
        .placeholder.evaluated-incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border-bottom: 2px solid #dc3545;
            border-radius: 3px;
        }
        
        .option-btn {
            font-size: 0.95rem;
            padding: 6px 12px;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #e2e6ea;
        }
        .option-btn.selected {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }
        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .action-buttons {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        .action-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 0 5px;
            transition: background-color 0.2s;
        }
        #evaluateBtn { background-color: #28a745; }
        #evaluateBtn:hover { background-color: #218838; }
        
        #detailedResultsBtn { background-color: #17a2b8; display: none; }
        #detailedResultsBtn:hover { background-color: #138496; }
        
        #resultsSummary {
            margin-top: 30px;
            padding: 20px;
            background-color: #d1ecf1;
            color: #0c5460;
            border-radius: 6px;
            display: none;
            text-align: center;
        }
        #resultsSummary h2 { margin-top: 0; font-size: 1.4rem; }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; }
            .options { display: none; }
            .placeholder { border: none; color: black; border-bottom: 1px solid black; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cvičenie</h1>
        <div class="meta-info">Autor: Neznámy autor | Rok: 2026</div>

        <div class="student-name no-print">
            <label for="studentName">Meno a priezvisko:</label>
            <input type="text" id="studentName" placeholder="Tvoje meno">
        </div>

        <div id="exerciseContainer"></div>

        <div class="action-buttons no-print">
            <button id="evaluateBtn" class="action-btn">Vyhodnotiť</button>
            <button id="detailedResultsBtn" class="action-btn">Detailné výsledky</button>
        </div>

        <div id="resultsSummary">
            <h2>Výsledok</h2>
            <p><strong id="summaryScore" style="font-size: 1.5rem;"></strong></p>
            <p>Žiak: <span id="summaryName"></span> | Dátum: <span id="summaryDateTime"></span></p>
        </div>
    </div>

    <script>
        const exerciseData = [{"part1":"- Wo ist denn dein Freund? -<br>- Ich weiß nicht. Ich suche","part2":"auch. -","correct":"ihn","options":["ihn","sie","es"]},{"part1":"- Ist das Buch hier gut? -<br>- Keine Ahnung. Wer kennt","part2":"schon? -","correct":"es","options":["es","ihn","sie"]},{"part1":"- Wie findest du die Musik? -<br>- Ganz gut. Wie findest du","part2":"? -","correct":"sie","options":["sie","ihn","es"]},{"part1":"- Wer sind denn die Jungen dort? -<br>- Kennst du","part2":"nicht? Das sind Simon und Lukas. -","correct":"sie","options":["sie","ihn","es"]},{"part1":"- Isabella ist so toll! Ich finde","part2":"so süß! -<br>- Oje! -","correct":"sie","options":["sie","ihn","es"]},{"part1":"- Mama, kann ich dein Fahrrad haben? -<br>- Na gut. Aber um sechs brauche ich","part2":". -","correct":"es","options":["es","sie","ihn"]},{"part1":"- Lisa, hast du mein Handy? -<br>- Nein, tut mir leid. Ich habe","part2":"nicht. -","correct":"es","options":["es","sie","ihn"]},{"part1":"- Triffst du heute Abend deinen Bruder? -<br>- Nein, ich treffe","part2":"nicht. Er geht ins Kino. -","correct":"ihn","options":["ihn","sie","es"]},{"part1":"- Da sind die Fußballspieler von Borussia Dortmund. -<br>- Oh. Komm, wir fotografieren","part2":"schnell. -","correct":"sie","options":["sie","ihn","es"]},{"part1":"- Ruf doch mal Onkel Rudolf an! -<br>- Ich kann","part2":"jetzt nicht anrufen. Ich habe keine Zeit. -","correct":"ihn","options":["ihn","sie","es"]}];
        const exerciseTitle = "Cvičenie";
        let detailedResultsData = [];

        // Zamiešanie poľa
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.addEventListener('load', () => {
            const container = document.getElementById('exerciseContainer');
            // Zamiešame poradie otázok
            const tasks = shuffleArray([...exerciseData]);

            tasks.forEach((task, index) => {
                // Vytvorenie HTML štruktúry pre otázku
                const row = document.createElement('div');
                row.className = 'sub-question';
                row.dataset.correct = task.correct;
                row.dataset.part1 = task.part1;
                row.dataset.part2 = task.part2;
                
                // Unikátne ID
                const uid = "q" + index;

                // Veta
                const sentenceDiv = document.createElement('div');
                sentenceDiv.className = 'sentence';
                
                const ph = document.createElement('span');
                ph.className = 'placeholder';
                ph.id = 'ph-' + uid;
                ph.textContent = '...';

                sentenceDiv.innerHTML = task.part1 + " ";
                sentenceDiv.appendChild(ph);
                sentenceDiv.innerHTML += " " + task.part2;

                // Možnosti
                const optsDiv = document.createElement('div');
                optsDiv.className = 'options no-print';

                const opts = shuffleArray([...task.options]);
                opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = function() {
                        // Odznačenie ostatných
                        const sibs = optsDiv.querySelectorAll('.option-btn');
                        sibs.forEach(s => s.classList.remove('selected'));
                        this.classList.add('selected');
                        
                        // Vyplnenie placeholderu
                        const phEl = document.getElementById('ph-' + uid);
                        phEl.textContent = opt;
                        phEl.classList.add('filled');
                        
                        // Uloženie odpovede do riadku
                        row.dataset.selected = opt;
                    };
                    optsDiv.appendChild(btn);
                });

                row.appendChild(sentenceDiv);
                row.appendChild(optsDiv);
                container.appendChild(row);
            });
        });

        document.getElementById('evaluateBtn').addEventListener('click', function() {
            const name = document.getElementById('studentName').value.trim() || "Anonym";
            const questions = document.querySelectorAll('.sub-question');
            let correctCount = 0;
            
            this.disabled = true; // Zablokovať tlačidlo
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            detailedResultsData = [];

            questions.forEach(q => {
                const correct = q.dataset.correct;
                const selected = q.dataset.selected;
                const part1 = q.dataset.part1;
                const part2 = q.dataset.part2;
                
                let status = "missing";
                const ph = q.querySelector('.placeholder');

                if (selected) {
                    if (selected === correct) {
                        status = "correct";
                        correctCount++;
                        ph.classList.add('evaluated-correct');
                    } else {
                        status = "incorrect";
                        ph.classList.add('evaluated-incorrect');
                    }
                } else {
                    ph.classList.add('evaluated-incorrect'); // Chýbajúca sa ráta ako chyba
                }

                detailedResultsData.push({
                    sentence: part1 + " <strong>" + (selected || "...") + "</strong> " + part2,
                    correct: correct,
                    status: status
                });
            });

            const total = questions.length;
            const percent = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            
            // Zobrazenie výsledku
            document.getElementById('summaryScore').textContent = correctCount + " / " + total + " (" + percent + "%)";
            document.getElementById('summaryName').textContent = name;
            document.getElementById('summaryDateTime').textContent = new Date().toLocaleString('sk-SK');
            
            document.getElementById('resultsSummary').style.display = 'block';
            document.getElementById('detailedResultsBtn').style.display = 'inline-block';
            
            // Scroll na výsledok
            document.getElementById('resultsSummary').scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('detailedResultsBtn').addEventListener('click', function() {
            // Generovanie obsahu nového okna
            let rows = "";
            detailedResultsData.forEach(item => {
                let color = item.status === 'correct' ? '#28a745' : (item.status === 'incorrect' ? '#dc3545' : '#ffc107');
                let icon = item.status === 'correct' ? '✔' : '✘';
                
                rows += `<tr>
                    <td style="padding:10px; border:1px solid #ddd;">${item.sentence}</td>
                    <td style="padding:10px; border:1px solid #ddd; font-weight:bold;">${item.correct}</td>
                    <td style="padding:10px; border:1px solid #ddd; text-align:center; color:${color}; font-weight:bold; font-size:1.2em;">${icon}</td>
                </tr>`;
            });

            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html lang="sk">
                <head>
                    <title>Detailné výsledky</title>
                    <style>
                        body { font-family: sans-serif; padding: 20px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th { background: #f2f2f2; padding: 10px; border: 1px solid #ddd; text-align: left; }
                        .header { margin-bottom: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
                        @media print { button { display: none; } }
                    </style>
                </head>
                <body>
                    <button onclick="window.print()" style="padding:10px 20px; cursor:pointer; margin-bottom:20px;">🖨️ Vytlačiť</button>
                    <h1>Detail výsledkov: ${exerciseTitle}</h1>
                    <div class="header">
                        <strong>Žiak:</strong> ${document.getElementById('summaryName').textContent}<br>
                        <strong>Skóre:</strong> ${document.getElementById('summaryScore').textContent}<br>
                        <strong>Dátum:</strong> ${document.getElementById('summaryDateTime').textContent}
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Veta s odpoveďou žiaka</th>
                                <th width="20%">Správna odpoveď</th>
                                <th width="10%">Stav</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </body>
                </html>
            `);
            win.document.close();
        });
    </script>
</body>
</html>

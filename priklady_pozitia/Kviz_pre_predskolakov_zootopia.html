<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Kvíz pre predškolákov</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; background: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        #startBtn, #nextBtn { background: #27ae60; color: white; border: none; padding: 15px 40px; border-radius: 5px; cursor: pointer; font-size: 1.3em; margin-top: 30px; font-family: 'Comic Sans MS', cursive; font-weight: bold; }
        #nextBtn:hover { background: #2ecc71; }
        #wheel-ui { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 1000px; }
        .wheel-box { position: relative; display: flex; align-items: center; justify-content: center; margin: 20px; }
        .arrow {
            width: 0; height: 0;
            border-top: 25px solid transparent; border-bottom: 25px solid transparent;
            border-left: 50px solid #27ae60; margin-right: -10px; z-index: 5;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }
        #result-box { margin-top: 40px; display: none; flex-direction: column; align-items: center; width: 100%; }
        #winner-text { font-size: 2.5em; font-weight: bold; background: #f0f8ff; padding: 15px 40px; border-radius: 10px; border: 3px dashed #2980b9; margin-bottom: 30px; display: inline-block; align-items: center; justify-content: center; }
        #task-text { font-size: 3em; font-weight: normal; color: #000; text-align: center; margin: 20px 0; line-height: 1.3; width: 100%; word-wrap: break-word; }
    </style>
</head>
<body>
    <div id="intro">
        <h1>Kvíz pre predškolákov</h1>
        <div class="meta">Mgr. Erika Matyiová 2026</div>
        <button id="startBtn" onclick="initWheel()">Štart</button>
    </div>

            <div class="arrow"></div>
            <canvas id="canvas" width="700" height="700"></canvas>
        </div>
        
        <div id="result-box">
            <div id="winner-text"></div>
            <div id="task-text"></div>
            <button id="nextBtn" onclick="removeAndReset()">Hotovo</button>
        </div>
    </div>

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV\" style=\"outline: none; max-width: 100%;\">\u003c/audio>\u003c/div>"];
        let namesMode = "images";
        let originalTasks = [...tasks]; 
        let colors = [];
        let angle = 0;
        let spinning = false;
        let winnerIdx = -1;
        let parsedItems = [];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const CENTER = 350;
        const RADIUS = 330;
        const BTN_RADIUS = 55;

        function parseHtmlText(htmlStr) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlStr;
            
            let imgSrc = null;
            const img = tempDiv.querySelector('img');
            if (img) imgSrc = img.getAttribute('src');
            
            let color = "#2c3e50";
            const span = tempDiv.querySelector('span');
            if (span && span.style.color) color = span.style.color;
            
            const imgs = tempDiv.querySelectorAll('img');
            for (let i = 0; i < imgs.length; i++) {
                imgs[i].parentNode.removeChild(imgs[i]);
            }
            
            const cleanText = tempDiv.textContent || tempDiv.innerText || "";
            return { color: color, text: cleanText.trim(), imgSrc: imgSrc };
        }

        function initWheel() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('wheel-ui').style.display = 'flex';
            
            parsedItems = items.map(parseHtmlText);
            generateColors();
            
            let totalImages = 0;
            let loadedImages = 0;

            parsedItems.forEach(item => {
                if (item.imgSrc) {
                    totalImages++;
                    item.imgObj = new Image();
                    item.imgObj.onload = () => {
                        loadedImages++;
                        if (loadedImages === totalImages) draw();
                    };
                    item.imgObj.onerror = () => {
                        loadedImages++;
                        if (loadedImages === totalImages) draw();
                    };
                    item.imgObj.src = item.imgSrc;
                }
            });

            if (totalImages === 0) {
                draw();
            }
        }

        function generateColors() {
            colors = [];
            for(let i=0; i<parsedItems.length; i++) {
                // Pozadie výsekov v kolese bolo upravené na biele
                colors.push('#ffffff');
            }
        }

        function draw() {
            const n = parsedItems.length;
            const arc = (Math.PI * 2) / n;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            parsedItems.forEach((parsed, i) => {
                const start = angle + i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(CENTER, CENTER);
                ctx.arc(CENTER, CENTER, RADIUS, start, start + arc);
                ctx.fill();
                
                // Vykreslenie sivých obrysov, keďže pozadie je biele
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; 
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(start + arc / 2 + Math.PI); 
                
                ctx.textAlign = "left";
                ctx.textBaseline = "middle"; 
                ctx.fillStyle = parsed.color;
                
                let fontSize = Math.min(30, (RADIUS * 2 * arc) / (Math.max(1, parsed.text.length) * 0.55));
                ctx.font = fontSize + "px 'Comic Sans MS'";
                
                let displayText = parsed.text;
                const maxTextWidth = 240; 
                
                let textWidth = ctx.measureText(displayText).width;
                if(textWidth > maxTextWidth) {
                    fontSize = fontSize * (maxTextWidth / textWidth);
                }
                
                if(fontSize < 12) fontSize = 12;
                ctx.font = fontSize + "px 'Comic Sans MS'";
                
                if(ctx.measureText(displayText).width > maxTextWidth) {
                   while(ctx.measureText(displayText + "...").width > maxTextWidth && displayText.length > 0) {
                       displayText = displayText.slice(0, -1);
                   }
                   displayText += "...";
                }

                if (parsed.imgObj) {
                    if (namesMode === 'images') {
                        // Dynamicky zväčšené obrázky pre mód "Iba obrázky"
                        let maxImgSize = 130;
                        let computedSize = Math.min(maxImgSize, (RADIUS * arc) * 0.85);
                        if(computedSize < 30) computedSize = 30;
                        ctx.drawImage(parsed.imgObj, -220 - computedSize/2, -computedSize/2, computedSize, computedSize);
                    } else {
                        // Pôvodné správanie pre "Text s obrázkom"
                        const imgSize = 40;
                        if (parsed.text === "") {
                            ctx.drawImage(parsed.imgObj, -280, -imgSize/2, imgSize, imgSize);
                        } else {
                            ctx.drawImage(parsed.imgObj, -315, -imgSize/2, imgSize, imgSize);
                            ctx.fillText(displayText, -265, 2); 
                        }
                    }
                } else {
                    ctx.fillText(displayText, -310, 2);
                }

                ctx.restore();
            });

            // Tienenie do stredu
            let g = ctx.createRadialGradient(CENTER, CENTER, RADIUS/2, CENTER, CENTER, RADIUS);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(1, 'rgba(0,0,0,0.04)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI*2); ctx.fill();

            // Stredové tlačidlo
            ctx.beginPath(); ctx.arc(CENTER, CENTER, BTN_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#39ff14"; ctx.fill();
            ctx.strokeStyle = "#27ae60"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = "bold 20px 'Comic Sans MS'";
            ctx.textAlign = "center"; ctx.fillText("Toč 🙂", CENTER, CENTER + 6);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left - CENTER;
            const y = e.clientY - rect.top - CENTER;
            if(Math.sqrt(x*x + y*y) < BTN_RADIUS && !spinning && parsedItems.length > 0) {
                spin();
            }
        };

        function spin() {
            spinning = true;
            let speed = 0.35 + Math.random() * 0.15;
            function animate() {
                angle += speed;
                speed *= 0.986;
                draw();
                if(speed > 0.002) requestAnimationFrame(animate);
                else {
                    spinning = false;
                    const n = parsedItems.length;
                    const arc = (Math.PI * 2) / n;
                    let norm = (Math.PI - (angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                    winnerIdx = Math.floor(norm / arc);
                    showResult();
                }
            }
            animate();
        }

        function showResult() {
            const parsedWinner = parsedItems[winnerIdx];
            const winnerDiv = document.getElementById('winner-text');
            
            let winnerHtml = parsedWinner.text;
            if (parsedWinner.imgSrc) {
                if (namesMode === 'images' || parsedWinner.text.trim() === "") {
                    // Ak je zadaný LEN obrázok alebo sme v móde obrázkov
                    winnerHtml = `<img src="${parsedWinner.imgSrc}" style="vertical-align: middle; max-height: 120px; display: block; margin: 0 auto;">`;
                } else {
                    winnerHtml = `<img src="${parsedWinner.imgSrc}" style="vertical-align: middle; max-height: 50px; margin-right: 15px;">` + winnerHtml;
                }
            }
            winnerDiv.innerHTML = winnerHtml;
            winnerDiv.style.color = parsedWinner.color === "#2c3e50" ? "#2980b9" : parsedWinner.color;
            winnerDiv.style.borderColor = winnerDiv.style.color;

            const taskDiv = document.getElementById('task-text');
            
            if (tasks.length === 0 && originalTasks.length > 0) {
                tasks = [...originalTasks];
            }

            if (tasks.length > 0) {
                const randomTaskIdx = Math.floor(Math.random() * tasks.length);
                let selectedTask = tasks[randomTaskIdx];
                tasks.splice(randomTaskIdx, 1);
                taskDiv.innerHTML = selectedTask;
            } else {
                taskDiv.innerHTML = "<span style='color: #7f8c8d; font-size: 0.6em;'><i>Žiadne úlohy neboli zadané.</i></span>";
            }

            document.querySelector('.wheel-box').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            document.getElementById('result-box').style.display = 'flex';
        }

        function removeAndReset() {
            parsedItems.splice(winnerIdx, 1);
            colors.splice(winnerIdx, 1);
            
            document.getElementById('result-box').style.display = 'none';
            winnerIdx = -1;
            
            if (parsedItems.length > 0) {
                document.querySelector('.wheel-box').style.display = 'flex';
                document.getElementById('instruction-text').style.display = 'block';
                draw();
            } else {
                document.getElementById('wheel-ui').innerHTML = "<h2 style='color:#27ae60; font-size: 2em; margin-top: 50px;'>Koniec! Všetky položky boli vyžrebované.</h2>";
            }
        }
    </script>
</body>

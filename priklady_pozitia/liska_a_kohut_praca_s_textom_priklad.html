<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Líška a kohút - práca s textom</title>
    <style>
        body { font-family: "Monaco", monospace; background: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 5px; text-align: center; }
        .meta { color: #7f8c8d; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 10px; text-align: center; }
        
        #start-area { text-align: center; padding: 40px 0; }
        .input-group { margin: 15px auto; max-width: 300px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-family: "Monaco", monospace; box-sizing: border-box; }
        
        .btn { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: "Monaco", monospace; font-size: 1em; }
        .btn-green { background: #27ae60; color: white; }
        .btn-green:hover { background: #219150; }
        .btn-blue { background: #3498db; color: white; margin-top: 15px; }
        .btn-blue:hover { background: #2980b9; }
        
        #exercise-area { display: none; }
        
        .task-page { display: none; }
        .task-page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .instructions { background: #fff8e1; padding: 15px; border-left: 5px solid #ffc107; margin-bottom: 20px; border-radius: 0 4px 4px 0;}
        .text-box { line-height: 2.5; font-size: 1.15em; margin-bottom: 30px; padding: 15px; border: 1px solid #eee; border-radius: 5px; background: #fafafa; }
        
        /* Interactive items */
        .item { cursor: pointer; border-radius: 3px; transition: 0.2s; padding: 2px 1px; }
        .item:hover { background: #e0e0e0; }
        .selected { background-color: #d3d3d3 !important; }
        
        /* Feedback colors */
        .correct { background-color: #c8e6c9 !important; border-bottom: 2px solid #2e7d32; }
        .incorrect { background-color: #ffcdd2 !important; border-bottom: 2px solid #c62828; }
        .missed { background-color: #ffe0b2 !important; border-bottom: 2px solid #ef6c00; }
        
        /* Navigation Controls */
        .nav-controls { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #eee; }
        .nav-squares { display: flex; justify-content: center; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .nav-square {
            width: 35px; height: 35px; border-radius: 4px; border: none; background: #e0e0e0; 
            font-weight: bold; cursor: pointer; font-family: "Monaco", monospace; transition: 0.2s;
        }
        .nav-square:hover { background: #ccc; }
        .nav-square.current { border: 2px solid #333; transform: scale(1.1); }
        .nav-square.solved { background-color: #add8e6; color: #000; } /* Svetlomodré pozadie */

        .legend { font-size: 0.85em; margin: 20px 0; display: none; padding: 10px; background: #f9f9f9; border-radius: 5px; text-align: center; }
        #summary { display: none; padding: 20px; border-top: 2px solid #eee; margin-top: 20px; background: #fdfdfd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Líška a kohút - práca s textom</h1>
        <div class="meta">Mgr. Erika Matyiová | 2026</div>

        <div id="start-area">
            <div class="input-group">
                <label>Meno žiaka:</label>
                <input type="text" id="studentName" class="input-control" placeholder="Zadaj svoje meno...">
            </div>
            <div class="input-group">
                <label>Počet úloh v teste:</label>
                <input type="number" id="numTasksInput" class="input-control" value="4" min="1" max="4">
            </div>
            <button type="button" class="btn btn-green" onclick="startApp()" style="margin-top: 20px;">Spustiť test</button>
        </div>

        <div id="exercise-area">
            <div id="tasks-wrapper"></div>
            
            <div class="nav-controls" id="nav-controls">
                <button type="button" id="btnNext" class="btn btn-blue" onclick="navigate(1)">Ďalej</button>
                <button type="button" id="btnEval" class="btn btn-green" style="display:none;" onclick="evaluateExercise()">Vyhodnotiť</button>
                <div class="nav-squares" id="navSquares"></div>
            </div>

            <div class="legend" id="legend">
                <strong>Vysvetlivky:</strong><br>
                <span class="correct">správna odpoveď</span> | 
                <span class="incorrect">nesprávna odpoveď</span> | 
                <span class="missed">neoznačená odpoveď (chýbala)</span>
            </div>

            <div id="summary"></div>
            <div style="text-align: center;">
                <button type="button" id="detailBtn" class="btn btn-blue" style="display:none" onclick="showDetails()">Detailné výsledky</button>
            </div>
        </div>
    </div>

    <script id="task-data" type="application/json">
        [{"inst":"Nájdi všetky privlastňovacie zámená. Klikni na ne myšou. Ak si rozmyslíš svoju voľbu, klikni na už označenú položku.","content":"Kohút sa držal ešte pevnejšie a roztomilo odpovedal: „To si ma, líška, naozaj potešila. Hneď zletím dolu. Ale čo to vidím, po ceste sem bežia veľkí psi, \u003cspan class=\"target\">moji\u003c/span> dobrí kamaráti. Čo nevidieť budú tu, rád ťa im predstavím a potom môžeme všetci spoločne \u003cspan class=\"target\">naše\u003c/span> priateľstvo osláviť.“"},{"inst":"Nájdi všetky prídavné mená. Klikni na ne myšou. Ak si rozmyslíš svoju voľbu, klikni na už označenú položku.","content":"\u003cspan class=\"target\">Hladná\u003c/span>&nbsp;líška bežala po ceste a zbadala, že na strome sedí na konári kohút. Líška zastavila, priateľsky sa usmievala a&nbsp;\u003cspan class=\"target\">sladkým\u003c/span>&nbsp;hláskom zavolala: „Prečože sedíš hore, kohútik? Keď zletíš dolu, poviem ti&nbsp;\u003cspan class=\"target\">radostnú\u003c/span>&nbsp;novinu.“"},{"inst":"Nájdi všetky podstatné mená. Klikni na ne myšou. Ak si rozmyslíš svoju voľbu, klikni na už označenú položku.","content":"\u003cspan class=\"target\">Kohút\u003c/span>&nbsp;tušil&nbsp;\u003cspan class=\"target\">zradu\u003c/span>, neodpovedal a len sa pevnejšie držal&nbsp;\u003cspan class=\"target\">konára\u003c/span>.&nbsp;\u003cspan class=\"target\">Líška\u003c/span>&nbsp;sa usmievala ešte viac a medovým&nbsp;\u003cspan class=\"target\">hláskom\u003c/span>&nbsp;vravela: „Neboj sa, zleť ku mne dolu.&nbsp;\u003cspan class=\"target\">Líšky\u003c/span>&nbsp;sa rozhodli, že budú žiť s vami,&nbsp;\u003cspan class=\"target\">kohútikmi\u003c/span>, v&nbsp;\u003cspan class=\"target\">priateľstve\u003c/span>.“"},{"inst":"Nájdi všetky slovesá. Klikni na ne myšou. Ak si rozmyslíš svoju voľbu, klikni na už označenú položku.","content":"\u003cdiv>Ako to líška&nbsp;\u003cspan class=\"target\">začula\u003c/span>,&nbsp;\u003cspan class=\"target\">otočila sa\u003c/span>,&nbsp;\u003cspan class=\"target\">bežala\u003c/span>&nbsp;do lesa a pritom&nbsp;\u003cspan class=\"target\">volala\u003c/span>: „Dovidenia, milý kohútik,&nbsp;\u003cspan class=\"target\">mám\u003c/span>&nbsp;teraz málo času a&nbsp;\u003cspan class=\"target\">nemôžem\u003c/span>&nbsp;dlhšie&nbsp;\u003cspan class=\"target\">čaka\u003c/span>ť.&nbsp;\u003cspan class=\"target\">Kamarátiť\u003c/span>&nbsp;\u003cspan class=\"target\">sa budeme\u003c/span>&nbsp;inokedy.“\u003c/div>\u003cdiv>Líška&nbsp;\u003cspan class=\"target\">letela\u003c/span>, čo jej nohy&nbsp;\u003cspan class=\"target\">stačili\u003c/span>, a chvíľami&nbsp;\u003cspan class=\"target\">sa obzerala\u003c/span>, či ju psi&nbsp;\u003cspan class=\"target\">nedoháňajú\u003c/span>. Ale široko-ďaleko žiadni psi&nbsp;\u003cspan class=\"target\">neboli\u003c/span>...\u003c/div>"}]
    </script>

    <script>
        let allTasksData = JSON.parse(document.getElementById('task-data').textContent);
        document.getElementById('numTasksInput').value = allTasksData.length;
        document.getElementById('numTasksInput').max = allTasksData.length;

        let activeTasks = [];
        let currentIndex = 0;
        let isDone = false;

        function startApp() {
            const num = parseInt(document.getElementById('numTasksInput').value, 10);
            if(num < 1 || num > allTasksData.length) {
                alert("Neplatný počet úloh.");
                return;
            }

            document.getElementById('start-area').style.display = 'none';
            document.getElementById('exercise-area').style.display = 'block';
            
            // Shuffle and slice tasks
            let shuffled = [...allTasksData].sort(() => 0.5 - Math.random());
            activeTasks = shuffled.slice(0, num);

            buildTasks();
        }

        function buildTasks() {
            const wrapper = document.getElementById('tasks-wrapper');
            const squares = document.getElementById('navSquares');
            wrapper.innerHTML = '';
            squares.innerHTML = '';

            activeTasks.forEach((task, index) => {
                // Task container
                const div = document.createElement('div');
                div.className = 'task-page';
                div.id = 'task-page-' + index;
                div.innerHTML = `
                    <div class="instructions"><strong>Úloha ${index + 1}:</strong> ${task.inst}</div>
                    <div class="text-box">${task.content}</div>
                `;
                wrapper.appendChild(div);

                prepareText(div.querySelector('.text-box'), index);

                // Nav Square
                const sq = document.createElement('button');
                sq.type = 'button';
                sq.className = 'nav-square';
                sq.id = 'sq-' + index;
                sq.textContent = index + 1;
                sq.onclick = () => showTask(index);
                squares.appendChild(sq);
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if(isDone) return;
                if(e.key === 'ArrowRight' && currentIndex < activeTasks.length - 1) navigate(1);
                if(e.key === 'ArrowLeft' && currentIndex > 0) navigate(-1);
            });

            showTask(0);
        }

        function prepareText(box, taskIndex) {
            // Label existing targets
            const targets = box.querySelectorAll('.target');
            targets.forEach(t => {
                t.classList.add('item');
                t.dataset.isTarget = "true";
            });

            // Wrap words
            wrapWords(box);

            // Add events
            box.querySelectorAll('.item').forEach(el => {
                el.onclick = function() { 
                    if(!isDone) {
                        this.classList.toggle('selected'); 
                        updateSquareStatus(taskIndex);
                    }
                };
                el.ondblclick = function() { 
                    if(!isDone) {
                        this.classList.remove('selected'); 
                        updateSquareStatus(taskIndex);
                    }
                };
            });
        }

        function wrapWords(parent) {
            const nodes = Array.from(parent.childNodes);
            nodes.forEach(node => {
                if (node.nodeType === 3) { 
                    const text = node.textContent;
                    if (text.trim().length === 0) return;
                    
                    const fragment = document.createDocumentFragment();
                    const parts = text.split(/(\s+)/);
                    parts.forEach(p => {
                        if (p.trim().length > 0) {
                            const span = document.createElement('span');
                            span.className = 'item';
                            span.textContent = p;
                            fragment.appendChild(span);
                        } else {
                            fragment.appendChild(document.createTextNode(p));
                        }
                    });
                    parent.replaceChild(fragment, node);
                } else if (node.nodeType === 1 && !node.classList.contains('target')) {
                    wrapWords(node);
                }
            });
        }

        function updateSquareStatus(taskIndex) {
            const taskDiv = document.getElementById('task-page-' + taskIndex);
            const sq = document.getElementById('sq-' + taskIndex);
            const hasSelection = taskDiv.querySelectorAll('.selected').length > 0;
            if(hasSelection) {
                sq.classList.add('solved');
            } else {
                sq.classList.remove('solved');
            }
        }

        function showTask(index) {
            if(isDone) return;
            // Hide current
            document.querySelectorAll('.task-page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-square').forEach(el => el.classList.remove('current'));
            
            currentIndex = index;
            
            // Show new
            document.getElementById('task-page-' + currentIndex).classList.add('active');
            document.getElementById('sq-' + currentIndex).classList.add('current');

            // Manage buttons
            const btnNext = document.getElementById('btnNext');
            const btnEval = document.getElementById('btnEval');

            if(currentIndex === activeTasks.length - 1) {
                btnNext.style.display = 'none';
                btnEval.style.display = 'inline-block';
            } else {
                btnNext.style.display = 'inline-block';
                btnEval.style.display = 'none';
            }
        }

        function navigate(dir) {
            const newIndex = currentIndex + dir;
            if(newIndex >= 0 && newIndex < activeTasks.length) {
                showTask(newIndex);
            }
        }

        function evaluateExercise() {
            isDone = true;
            let totalCorrect = 0;
            let totalTargetsCount = 0;

            const tasksStats = [];

            // Hide normal nav controls, keep squares but disable them
            document.getElementById('btnNext').style.display = 'none';
            document.getElementById('btnEval').style.display = 'none';
            document.querySelectorAll('.nav-square').forEach(sq => { sq.style.cursor = 'default'; sq.onclick = null; });
            
            // Show all tasks for review
            document.querySelectorAll('.task-page').forEach(el => {
                el.classList.add('active');
                el.style.borderBottom = "3px dashed #ccc";
                el.style.paddingBottom = "20px";
                el.style.marginBottom = "30px";
            });
            document.getElementById('navSquares').style.display = 'none';

            activeTasks.forEach((task, idx) => {
                const taskDiv = document.getElementById('task-page-' + idx);
                const items = taskDiv.querySelectorAll('.item');
                
                let taskCorrect = 0;
                let taskTargets = taskDiv.querySelectorAll('.item[data-is-target="true"]').length;
                let taskWrong = 0;
                
                let detailTargets = [];
                let detailStudent = [];
                let detailMissed = [];

                items.forEach(el => {
                    const isTarget = el.dataset.isTarget === "true";
                    const isSelected = el.classList.contains('selected');

                    if(isTarget) detailTargets.push(el.textContent.trim());

                    if (isSelected && isTarget) {
                        el.classList.add('correct');
                        taskCorrect++;
                        detailStudent.push({txt: el.textContent.trim(), status: true});
                    } else if (isSelected && !isTarget) {
                        el.classList.add('incorrect');
                        taskWrong++;
                        detailStudent.push({txt: el.textContent.trim(), status: false});
                    } else if (!isSelected && isTarget) {
                        el.classList.add('missed');
                        detailMissed.push(el.textContent.trim());
                    }
                    el.classList.remove('selected');
                });

                totalCorrect += taskCorrect;
                totalTargetsCount += taskTargets;

                tasksStats.push({
                    title: "Úloha " + (idx + 1),
                    allTargets: detailTargets,
                    studentChoices: detailStudent,
                    missed: detailMissed,
                    score: `${taskCorrect} z ${taskTargets}`
                });
            });

            const percent = totalTargetsCount > 0 ? Math.round((totalCorrect / totalTargetsCount) * 100) : 0;
            const studentName = document.getElementById('studentName').value || "XY";
            const date = new Date();
            const timestamp = date.toLocaleDateString('sk-SK') + ", " + date.toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'});

            const summary = document.getElementById('summary');
            summary.style.display = 'block';
            summary.innerHTML = `
                <strong>Meno žiaka:</strong> ${studentName}<br>
                <strong>Celkové hodnotenie:</strong> ${totalCorrect} z ${totalTargetsCount} (${percent}%)<br>
                <strong>Dátum a čas:</strong> ${timestamp}
            `;

            document.getElementById('legend').style.display = 'block';
            document.getElementById('detailBtn').style.display = 'inline-block';

            // Data for detailed view
            window.resData = {
                title: "Líška a kohút - práca s textom",
                name: studentName,
                stats: `${totalCorrect} z ${totalTargetsCount} (${percent}%)`,
                time: timestamp,
                tasks: tasksStats
            };
        }

        function showDetails() {
            const d = window.resData;
            const win = window.open('', '_blank');
            
            let tasksHtml = d.tasks.map(t => `
                <h3>${t.title} (Úspešnosť: ${t.score})</h3>
                <p><strong>Správne odpovede:</strong><br>${t.allTargets.join(', ') || 'Žiadne'}</p>
                <p><strong>Odpovede žiaka:</strong><br>
                ${t.studentChoices.map(c => `<div><span class="${c.status ? 'tick':'cross'}">${c.status ? '✓' : '✗'}</span> ${c.txt}</div>`).join('') || 'Žiadne'}
                </p>
                <p><strong>Neoznačené (chýbajúce) položky:</strong><br>
                ${t.missed.map(m => `<div><span class="warn">!</span> ${m}</div>`).join('') || 'Žiadne'}
                </p>
                <hr>
            `).join('');

            win.document.write(`
                <html>
                <head>
                    <title>Detailné výsledky</title>
                    <style>
                        body { font-family: "Monaco", monospace; padding: 30px; line-height: 1.6; }
                        h2 { border-bottom: 2px solid #333; padding-bottom: 5px; }
                        h3 { color: #2c3e50; margin-top: 30px; }
                        .tick { color: green; font-weight: bold; }
                        .cross { color: red; font-weight: bold; }
                        .warn { color: orange; font-weight: bold; }
                        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
                        @media print { .no-print { display: none; } }
                    </style>
                </head>
                <body>
                    <h2>Test: ${d.title}</h2>
                    <p><strong>Meno žiaka:</strong> ${d.name}</p>
                    <p><strong>Celkové hodnotenie:</strong> ${d.stats}</p>
                    <p><strong>Dátum a čas:</strong> ${d.time}</p>
                    
                    <hr>
                    <h2>Detailný prehľad podľa úloh</h2>
                    ${tasksHtml}

                    <p>Vysvetlivky symbolov:<br> ✓ správne | ✗ nesprávne | ! chýbajúce</p>
                    <button class="no-print" onclick="window.print()" style="padding:10px; background:#3498db; color:white; border:none; cursor:pointer; font-family:'Monaco', monospace;">Vytlačiť (Ctrl + P)</button>
                </body>
                </html>
            `);
            win.document.close();
        }
    </script>
</body>
</html>

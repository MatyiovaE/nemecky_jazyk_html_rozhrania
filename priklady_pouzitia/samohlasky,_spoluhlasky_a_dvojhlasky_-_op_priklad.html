
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samohlásky, spoluhlásky a dvojhlásky - opakovanie</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display:flex; flex-direction:column; min-height:100vh; align-items:center; }
        .main-card { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .meta { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-style: italic; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .btn { padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.2s; display: inline-block; }
        .btn-start { background: #3498db; color: white; }
        /* Common button styles */
        .btn-next, .btn-eval { background: #3498db; color: white; }
        .btn-eval { background: #27ae60; } 
        .btn-detail { background: #8e44ad; color: white; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }

        .hidden { display: none; }
        .instructions { background: #e8f6f3; padding: 15px; border-radius: 5px; border-left: 4px solid #1abc9c; margin-bottom: 20px; }
        
        .question-box { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; text-align: center; }
        .q-img { max-width: 100%; height: auto; display: block; margin: 10px auto; border-radius: 5px; max-height: 400px; }
        
        .nav-dots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 20px; justify-content: center; }
        /* Zmena tvaru tlačidiel na štvorčeky */
        .dot { width: 35px; height: 35px; background: #ddd; display: flex; align-items: center; justify-content: center; border-radius: 5px; cursor: pointer; font-size: 14px; user-select: none; transition: 0.2s; }
        .dot:hover { background: #ccc; }
        .dot.active { border: 2px solid #2c3e50; font-weight: bold; }
        .dot.answered { background: #aed6f1; color: #154360; }

        .symbol { font-weight: bold; font-size: 1.2em; margin-right: 10px; min-width: 25px; }
        
        .choice-label { display: inline-block; width: 100%; max-width: 500px; text-align: left; padding: 10px; background: #f9f9f9; margin-bottom: 8px; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; box-sizing: border-box; }
        .choice-label:hover { background: #eee; }
        input[type="radio"] { margin-right: 10px; }
        input[type="text"].ans-input { width: 100%; max-width: 400px; text-align: center; }

        #summary-box { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .summary-item { margin-bottom: 5px; }

        /* Kontajner pre centrálne tlačidlá */
        .buttons-wrapper { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="main-card">
    <h1>Samohlásky, spoluhlásky a dvojhlásky - opakovanie</h1>
    <div class="meta">Autor: Mgr. Erika Matyiová, 2026</div>

    <div id="screen-start">
        <div class="input-group">
            <label>Meno žiaka:</label>
            <input type="text" id="studentName" placeholder="Zadaj svoje meno (nepovinné)">
        </div>
        <div class="input-group" style="display:flex; gap:10px; align-items:flex-end;">
            <div style="flex:1">
                <label>Počet otázok (maximálny počet: 12):</label>
                <input type="number" id="qCount" min="1" max="12" value="12">
            </div>
            <button class="btn btn-start" onclick="startTest()">Štart</button>
        </div>
    </div>

    <div id="screen-test" class="hidden">
        <div class="instructions">
            Rieš úlohy podľa pokynov. Následne klikni na tlačidlo "Ďalej". Po poslednej úlohe klikni na tlačidlo "Vyhodnotiť."
        </div>
        
        <div id="question-container"></div>

        <div class="buttons-wrapper">
            <button id="btn-next" class="btn btn-next" onclick="nextQuestion()">Ďalej</button>
            <button id="btn-finish" class="btn btn-eval hidden" onclick="evaluateTest()">Vyhodnotiť</button>
        </div>

        <div class="nav-dots" id="nav-dots"></div>
    </div>

    <div id="screen-results" class="hidden">
        <h2>Výsledky</h2>
        <div id="summary-box"></div>
        <button class="btn btn-detail" onclick="showDetailedResults()">Detailné výsledky</button>
    </div>
</div>

<script>
    const allTasks = [{"id":1769975165586,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Koľko samohlások obsahuje slovo <b>mačka</b>?","image":null,"answer":"2","settings":{"caseSensitive":false,"distractors":["1","3"]}},{"id":1769975364519,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Ktoré slovo sa začína na tvrdú spoluhlásku?","image":null,"answer":"telefón","settings":{"caseSensitive":false,"distractors":["zošit","ďateľ"]}},{"id":1769975599335,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Označ slovo, ktoré obsahuje dvojhlásku.","image":null,"answer":"kôstka","settings":{"caseSensitive":false,"distractors":["bábika","auto"]}},{"id":1769975700567,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Ktoré slovo sa začína na mäkkú spoluhlásku?","image":null,"answer":"ľalia","settings":{"caseSensitive":false,"distractors":["lavica","lasica"]}},{"id":1769975936815,"type":"bool","instruction":"Rozhodni sa, či je tvrdenie pravdivé alebo nepravdivé.","question":"Spoluhláska <b>k</b> je tvrdá spoluhláska.","image":null,"answer":"true","settings":{"caseSensitive":false,"distractors":[]}},{"id":1769978412601,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Spoluhláska <b>š</b> je","image":null,"answer":"mäkká spoluhláska","settings":{"caseSensitive":false,"distractors":["tvrdá spoluhláska","obojaká spoluhláska"]}},{"id":1769978489752,"type":"bool","instruction":"Rozhodni sa, či je dané tvrdenie pravdivé alebo nepravdivé.","question":"Spoluhláska <b>p</b> je tvrdá spoluhláska.","image":null,"answer":"false","settings":{"caseSensitive":false,"distractors":[]}},{"id":1769978678528,"type":"short","instruction":"Napíš správnu odpoveď. Rozlišuj malé a veľké písmená.","question":"Vypíš dvojhlásku zo slova <b>mačiatko</b>.<br>Píš malými písmenami a nedávaj medzeru ani bodku.","image":null,"answer":"ia","settings":{"caseSensitive":true,"distractors":[]}},{"id":1769979075105,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"V ktorom slove sa vysloví spoluhláska <b>d</b> tvrdo?","image":null,"answer":"voda","settings":{"caseSensitive":false,"distractors":["deti","dievča"]}},{"id":1769979324921,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Koľko spoluhlások obsahuje slovo prst?","image":null,"answer":"4","settings":{"caseSensitive":false,"distractors":["3","5"]}},{"id":1769998203703,"type":"choice","instruction":"Zvoľ správnu odpoveď.","question":"Koľko samohlások obsahuje slovo <b>vŕba</b>?","image":null,"answer":"1","settings":{"caseSensitive":false,"distractors":["0","3"]}},{"id":1769998353711,"type":"short","instruction":"Napíš správnu odpoveď. Rozlišuj malé a veľké písmená","question":"Vypíš dvojhlásku zo slova <b>lepšiu</b>.<br>Píš malými písmenami a nedávaj medzeru ani bodku.","image":null,"answer":"iu","settings":{"caseSensitive":true,"distractors":[]}}];
    let activeTasks = [];
    let userAnswers = {}; 
    let currentIdx = 0;
    let studentName = "";
    let testDate = "";

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startTest() {
        // Úprava: Ak nie je zadané meno, použije sa XY
        const nameInput = document.getElementById('studentName').value.trim();
        studentName = nameInput || "XY";
        
        const maxQ = allTasks.length;
        let reqQ = parseInt(document.getElementById('qCount').value);
        if(isNaN(reqQ) || reqQ < 1) reqQ = 1;
        if(reqQ > maxQ) reqQ = maxQ;

        activeTasks = shuffle([...allTasks]).slice(0, reqQ);
        userAnswers = {};
        currentIdx = 0;

        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-test').classList.remove('hidden');
        
        renderNav();
        loadQuestion(0);
    }

    function renderNav() {
        const container = document.getElementById('nav-dots');
        container.innerHTML = '';
        activeTasks.forEach((_, idx) => {
            const btn = document.createElement('div');
            btn.className = 'dot';
            btn.innerText = idx + 1;
            btn.onclick = () => loadQuestion(idx);
            btn.id = 'dot-' + idx;
            container.appendChild(btn);
        });
    }

    function updateNavState() {
        activeTasks.forEach((t, idx) => {
            const dot = document.getElementById('dot-' + idx);
            if(userAnswers[t.id] !== undefined && userAnswers[t.id] !== "") {
                dot.classList.add('answered');
            }
            if(idx === currentIdx) {
                dot.style.border = "2px solid #2c3e50";
            } else {
                dot.style.border = "none";
            }
        });
    }

    function loadQuestion(idx) {
        currentIdx = idx;
        const task = activeTasks[idx];
        const container = document.getElementById('question-container');
        
        let inputHTML = '';
        const savedAns = userAnswers[task.id] || "";

        if(task.type === 'short') {
            inputHTML = `<input type="text" class="ans-input" value="${savedAns}" oninput="saveAnswer(${task.id}, this.value)" placeholder="Tvoja odpoveď">`;
        } else if (task.type === 'bool') {
            inputHTML = `
                <div>
                <label class="choice-label"><input type="radio" name="q_${task.id}" value="true" onchange="saveAnswer(${task.id}, 'true')" ${savedAns === 'true' ? 'checked' : ''}> Pravda</label>
                </div>
                <div>
                <label class="choice-label"><input type="radio" name="q_${task.id}" value="false" onchange="saveAnswer(${task.id}, 'false')" ${savedAns === 'false' ? 'checked' : ''}> Nepravda</label>
                </div>
            `;
        } else if (task.type === 'choice') {
            if(!task._shuffledOptions) {
                const opts = [task.answer, ...task.settings.distractors];
                task._shuffledOptions = shuffle(opts);
            }
            
            inputHTML = task._shuffledOptions.map(opt => `
                <div>
                <label class="choice-label">
                    <input type="radio" name="q_${task.id}" value="${opt.replace(/"/g, '&quot;')}" onchange="saveAnswer(${task.id}, this.value)" ${savedAns === opt ? 'checked' : ''}>
                    ${opt}
                </label>
                </div>
            `).join('');
        }

        const imgHTML = task.image ? `<img src="${task.image}" class="q-img">` : '';

        container.innerHTML = `
            <div class="question-box">
                <p style="color:#7f8c8d; font-size:0.9em; margin-bottom:5px; white-space: pre-wrap;">${task.instruction}</p>
                <h3 style="margin-top:0;">${task.question}</h3>
                ${imgHTML}
                <div style="margin-top:15px;">
                    ${inputHTML}
                </div>
            </div>
        `;

        const btnNext = document.getElementById('btn-next');
        const btnFinish = document.getElementById('btn-finish');
        
        // Zobrazovanie tlačidiel - konzistentná pozícia
        if (currentIdx === activeTasks.length - 1) {
            btnNext.style.display = 'none';
            btnFinish.style.display = 'inline-block';
            btnFinish.classList.remove('hidden');
        } else {
            btnNext.style.display = 'inline-block';
            btnFinish.style.display = 'none';
        }

        updateNavState();
    }

    function saveAnswer(id, val) {
        userAnswers[id] = val;
        updateNavState();
    }

    function nextQuestion() {
        if(currentIdx < activeTasks.length - 1) {
            loadQuestion(currentIdx + 1);
        }
    }

    function evaluateTest() {
        if(!confirm("Chceš naozaj ukončiť a vyhodnotiť test?")) return;

        testDate = new Date().toLocaleString('sk-SK');
        let points = 0;
        let total = activeTasks.length;

        activeTasks.forEach(t => {
            const uAns = userAnswers[t.id];
            let isCorrect = false;

            if (t.type === 'short') {
                if(uAns) {
                    if(t.settings.caseSensitive) {
                        isCorrect = uAns.trim() === t.answer.trim();
                    } else {
                        isCorrect = uAns.trim().toLowerCase() === t.answer.trim().toLowerCase();
                    }
                }
            } else {
                isCorrect = uAns === t.answer;
            }
            t._result = {
                userAnswer: uAns,
                isCorrect: isCorrect,
                status: !uAns ? 'missing' : (isCorrect ? 'ok' : 'err')
            };
            if(isCorrect) points++;
        });

        const percent = Math.round((points / total) * 100);

        const summary = document.getElementById('summary-box');
        summary.innerHTML = `
            <div class="summary-item"><strong>Názov testu:</strong> Samohlásky, spoluhlásky a dvojhlásky - opakovanie</div>
            <div class="summary-item"><strong>Meno žiaka:</strong> ${studentName}</div>
            <div class="summary-item"><strong>Hodnotenie:</strong> ${points} z ${total} (${percent}%)</div>
            <div class="summary-item"><strong>Dátum a čas:</strong> ${testDate}</div>
        `;

        document.getElementById('screen-test').classList.add('hidden');
        document.getElementById('screen-results').classList.remove('hidden');
    }

    function showDetailedResults() {
        const win = window.open("", "_blank", "width=800,height=600");
        
        let rows = "";
        activeTasks.forEach((t, i) => {
            const r = t._result;
            let symbol = "";
            
            if(r.status === 'ok') symbol = "<span style='color:green'>&#10004;</span>"; 
            else if(r.status === 'err') symbol = "<span style='color:red'>&#10006;</span>"; 
            else symbol = "<span style='color:orange'>&#10071;</span>"; 

            rows += `
                <tr style="border-bottom: 1px solid #ccc;">
                    <td style="padding:8px;">${t.question}</td>
                    <td style="padding:8px;">${t.answer}</td>
                    <td style="padding:8px;">${r.userAnswer || '-'} ${symbol}</td>
                </tr>
            `;
        });

        win.document.write(`
            <html>
            <head>
                <title>Detailné výsledky</title>
                <style>
                    body { font-family: sans-serif; padding: 20px; }
                    h2, h3 { color: #2c3e50; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    th { background: #eee; text-align: left; padding: 10px; border-bottom: 2px solid #ddd; }
                    td { border-bottom: 1px solid #eee; }
                    .legend { margin-top: 30px; font-size: 0.9em; background: #f9f9f9; padding: 10px; }
                    @media print { .no-print { display: none; } }
                </style>
            </head>
            <body>
                <h2>Detailný prehľad</h2>
                <p><strong>Názov testu:</strong> Samohlásky, spoluhlásky a dvojhlásky - opakovanie</p>
                <p><strong>Meno žiaka:</strong> ${studentName}</p>
                <p><strong>Hodnotenie:</strong> ${Math.round((activeTasks.filter(t=>t._result.isCorrect).length / activeTasks.length) * 100)}%</p>
                <p><strong>Dátum a čas:</strong> ${testDate}</p>

                <table>
                    <thead>
                        <tr>
                            <th width="40%">Úloha</th>
                            <th width="30%">Správna odpoveď</th>
                            <th width="30%">Odpoveď žiaka</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>

                <div class="legend">
                    <strong>Legenda:</strong><br>
                    <span style='color:green'>&#10004;</span> = Správne <br>
                    <span style='color:red'>&#10006;</span> = Nesprávne <br>
                    <span style='color:orange'>&#10071;</span> = Chýbajúca odpoveď
                </div>

                <div class="no-print" style="margin-top:20px; text-align:center;">
                    <button onclick="window.print()" style="padding:10px 20px; cursor:pointer;">Vytlačiť (Ctrl + P)</button>
                </div>
            </body>
            </html>
        `);
        win.document.close();
    }
</script>
</body>
</html>

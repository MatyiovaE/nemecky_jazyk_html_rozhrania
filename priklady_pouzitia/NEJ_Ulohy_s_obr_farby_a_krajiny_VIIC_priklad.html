c5ulUC/wDXufzLgt+g2dxyAKamgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/2Q==\" style=\"max-width:100%; max-height:35vh; margin-top:15px; box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);\"><br>"];
        let colors = [];
        let angle = 0;
        let spinning = false;
        let winnerIdx = -1;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const CENTER = 350;
        const RADIUS = 330;
        const BTN_RADIUS = 55;

        // Funkcia na vyparsovanie spanu s farbou
        function parseHtmlText(htmlStr) {
            const spanRegex = /<span[^>]*style=["'](?:[^"']*;)?\s*color:\s*([^;"'>]+)[^>]*>(.*?)<\/span>/i;
            const match = htmlStr.match(spanRegex);
            if (match) {
                return { color: match[1].trim(), text: match[2].trim() };
            }
            // Odstránenie iných tagov ak sú prítomné, aby na canvas nešli zátvorky (napr. b)
            const cleanText = htmlStr.replace(/<[^>]*>?/gm, '');
            return { color: "#2c3e50", text: cleanText.trim() };
        }

        function initWheel() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('wheel-ui').style.display = 'flex';
            generateColors();
            draw();
        }

        function generateColors() {
            colors = [];
            for(let i=0; i<items.length; i++) {
                let h = (i * (360 / items.length) + Math.random() * 20) % 360;
                colors.push('hsl(' + h + ', 75%, 93%)');
            }
        }

        function draw() {
            const n = items.length;
            const arc = (Math.PI * 2) / n;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((itemHtml, i) => {
                const parsed = parseHtmlText(itemHtml);
                
                const start = angle + i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(CENTER, CENTER);
                ctx.arc(CENTER, CENTER, RADIUS, start, start + arc);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; 
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(start + arc / 2 + Math.PI); 
                
                ctx.textAlign = "left";
                ctx.textBaseline = "middle"; 
                ctx.fillStyle = parsed.color;
                
                let fontSize = Math.min(30, (RADIUS * 2 * arc) / (Math.max(1, parsed.text.length) * 0.55));
                ctx.font = fontSize + "px 'Comic Sans MS'";
                
                let displayText = parsed.text;
                const maxTextWidth = 240; // Max šírka textu (310 od okraja - 70 aby sa nedotklo stredu 55) = 240px
                
                // Zmenšenie veľkosti písma, ak je text vizuálne širší ako maxTextWidth
                let textWidth = ctx.measureText(displayText).width;
                if(textWidth > maxTextWidth) {
                    fontSize = fontSize * (maxTextWidth / textWidth);
                }
                
                // Nastavenie minimálnej veľkosti
                if(fontSize < 12) {
                    fontSize = 12;
                }
                ctx.font = fontSize + "px 'Comic Sans MS'";
                
                // Ak je text aj pri min. veľkosti stále dlhý, tak ho skrátime s bodkami
                if(ctx.measureText(displayText).width > maxTextWidth) {
                   while(ctx.measureText(displayText + "...").width > maxTextWidth && displayText.length > 0) {
                       displayText = displayText.slice(0, -1);
                   }
                   displayText += "...";
                }

                ctx.fillText(displayText, -310, 2);
                ctx.restore();
            });

            let g = ctx.createRadialGradient(CENTER, CENTER, RADIUS/2, CENTER, CENTER, RADIUS);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(1, 'rgba(0,0,0,0.04)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI*2); ctx.fill();

            ctx.beginPath(); ctx.arc(CENTER, CENTER, BTN_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#39ff14"; ctx.fill();
            ctx.strokeStyle = "#27ae60"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = "bold 20px 'Comic Sans MS'";
            ctx.textAlign = "center"; ctx.fillText("Toč 🙂", CENTER, CENTER + 6);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left - CENTER;
            const y = e.clientY - rect.top - CENTER;
            if(Math.sqrt(x*x + y*y) < BTN_RADIUS && !spinning && items.length > 0) {
                spin();
            }
        };

        function spin() {
            spinning = true;
            let speed = 0.35 + Math.random() * 0.15;
            function animate() {
                angle += speed;
                speed *= 0.986;
                draw();
                if(speed > 0.002) requestAnimationFrame(animate);
                else {
                    spinning = false;
                    const n = items.length;
                    const arc = (Math.PI * 2) / n;
                    let norm = (Math.PI - (angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                    winnerIdx = Math.floor(norm / arc);
                    
                    showResult();
                }
            }
            animate();
        }

        function showResult() {
            const parsedWinner = parseHtmlText(items[winnerIdx]);
            
            const winnerDiv = document.getElementById('winner-text');
            winnerDiv.innerText = parsedWinner.text;
            winnerDiv.style.color = parsedWinner.color === "#2c3e50" ? "#2980b9" : parsedWinner.color;
            winnerDiv.style.borderColor = winnerDiv.style.color;

            const taskDiv = document.getElementById('task-text');
            if (tasks.length > 0) {
                const randomTaskIdx = Math.floor(Math.random() * tasks.length);
                let selectedTask = tasks[randomTaskIdx];
                tasks.splice(randomTaskIdx, 1);
                selectedTask = selectedTask.replace(/\|/g, '<br>');
                taskDiv.innerHTML = selectedTask;
            } else {
                taskDiv.innerHTML = "<span style='color: #7f8c8d; font-size: 0.6em;'><i>Žiadne ďalšie úlohy nie sú k dispozícii.</i></span>";
            }

            document.querySelector('.wheel-box').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            document.getElementById('result-box').style.display = 'flex';
        }

        function removeAndReset() {
            items.splice(winnerIdx, 1);
            colors.splice(winnerIdx, 1);
            
            document.getElementById('result-box').style.display = 'none';
            winnerIdx = -1;
            
            if (items.length > 0) {
                document.querySelector('.wheel-box').style.display = 'flex';
                document.getElementById('instruction-text').style.display = 'block';
                draw();
            } else {
                document.getElementById('wheel-ui').innerHTML = "<h2 style='color:#27ae60; font-size: 2em; margin-top: 50px;'>Koniec! Všetky mená boli vyžrebované.</h2>";
            }
        }
    </script>

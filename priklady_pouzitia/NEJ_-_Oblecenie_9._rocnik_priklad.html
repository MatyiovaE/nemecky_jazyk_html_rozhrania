<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEJ - Oblečenie (9. ročník)</title>
<style>
:root{
  --bg: #ffffff; --fg: #111827; --card: #f0f0f0; --border: #999999;
  --active: #d0eaff; --control-bg: #ffffff; --control-fg: #000000;
  --end-bg: #ffffff; --end-fg: #111827;
  --card-width: 250px; --card-height: 165px; --card-gap: 12px;
}
body.dark-mode{
  --bg: #2e3d20; --fg: #f7f9ef; --card: #112409; --border: #ffffff;
  --active: #f7f9ef; --control-bg: #f7f9ef; --control-fg: #000000;
  --end-bg: #062d08; --end-fg: #e0f4d7;
}
.card.selected { background: var(--active, #d0eaff); color: #000000 !important; }
body.dark-mode .card.selected { background: var(--active, #f7f9ef); color: #000000 !important; }
body.dark-mode #endMessage { background: #304420; color: var(--end-fg); box-shadow: 0 6px 30px rgba(0,0,0,0.45); }
body{ margin:0; padding:24px; font-family: Courier, monospace; background:var(--bg); color:var(--fg); text-align:center; }
.controls, .card, #endMessage, button, input, select { transition: background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease; }
.card{ 
  width: var(--card-width); height: var(--card-height); 
  display:inline-flex; flex-direction: column; align-items:center; justify-content:center; 
  margin: calc(var(--card-gap) / 2); background:var(--card); border:3px solid var(--border); 
  border-radius:10px; cursor:pointer; user-select:none; 
  text-align:center; box-shadow:2px 2px 8px rgba(0,0,0,0.12); color:var(--fg); 
  font-family: 'Segoe UI', sans-serif; font-weight: bold; line-height: 1.15; padding: 4px; overflow: hidden;
}
.card img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
.card.matched{ visibility:hidden; }
.card.selected{ background:var(--active); color:var(--fg); }
.card.correct{ background: #c8f7c5 !important; }
.card.wrong{ background: #f7c5c5 !important; }
.bold{ font-weight:800; }
.card:not(.selected).term { background: #d9d9d9; color: var(--fg); font-weight: 800; }
.card:not(.selected).definition { background: #f6f6f6; color: var(--fg); font-weight: 500; }
body.dark-mode .card:not(.selected).term { background: #112409; color: var(--fg); font-weight: 800; }
body.dark-mode .card:not(.selected).definition { background: #1d3d0f; color: var(--fg); font-weight: 500; }
#board{ display:flex; flex-wrap:wrap; justify-content:center; max-width:1200px; margin:18px auto; }
#endMessage{ display:none; flex-direction: column; align-items: center; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3rem; font-weight:800; background:var(--end-bg); color:var(--end-fg); padding:18px 26px; border-radius:12px; box-shadow:0 6px 30px rgba(0,0,0,0.25); z-index:999; pointer-events:auto; text-align:center; }
.controls{ margin-bottom:12px; }
button, input, select{ padding:8px 10px; margin:6px; background:var(--control-bg); color:var(--control-fg); border:1px solid var(--border); border-radius:6px; }
.replay-btn { margin-top: 15px; padding: 12px 24px; font-size: 1.2rem; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
.replay-btn:hover { background-color: #45a049; }
.tts-block { display: inline-flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding: 10px; border: 1px dashed var(--border); border-radius: 8px; }
.tts-settings { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; margin-top: 5px; }
.tts-col { border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; align-items: center; background: rgba(0,0,0,0.02); }
body.dark-mode .tts-col { background: rgba(255,255,255,0.03); }
@media(max-width:900px){ :root{ --card-width: 220px; --card-height: 150px; --card-gap: 10px; } #board{ max-width:980px; } }
@media(max-width:700px){ :root{ --card-width: 46%; --card-height: 110px; --card-gap: 8px; } #endMessage{ font-size:1.8rem; padding:14px 18px; } }
</style>
</head>
<body >
  <label class="controls"><input type="checkbox" id="darkToggle"> Tmavý režim</label>
  <h1>NEJ - Oblečenie (9. ročník)</h1>
  <div class="controls">
    <label><input type="checkbox" id="toggleTimer"> Aktivovať časovač</label>
    <button id="restartBtn" style="margin-left:12px">🔁 Reštartovať</button><br>
    
    <div class="tts-block">

         </div>
         <div class="tts-col">
           <label>Jazyk definícií: <select id="langDef"><option value="sk-SK" >Slovenčina</option><option value="en-GB" >Angličtina (UK)</option><option value="en-US" >Angličtina (US)</option><option value="de-DE" >Nemčina</option><option value="de-AT" selected>Nemčina (Rakúsko)</option><option value="fr-FR" >Francúzština</option><option value="es-ES" >Španielčina</option><option value="it-IT" >Taliančina</option></select></label>
           <label style="font-size: 0.9em;">Rýchlosť: <input type="range" id="rateDef" min="0.1" max="2" step="0.1" value="0.8"> <span id="rateDefVal">0.8</span></label>
         </div>
      </div>
    </div><br>

    <span id="timerDisplay">Čas: 0.00 s</span>
    <span id="recordDisplay" style="margin-left:12px">Rekord: –</span>
  </div>
  <div id="board"></div>

  const END_MESSAGES = ["Super! 🙂","Úžasné! 🙂","Výborne! 🙂","Kto vie, ten vie 🙂","Si šikovný/á 🙂","Cvičenie robí majstra 🙂","Zaslúžiš si odmenu 🙂"];
  
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  function allPairsFound(){ return document.querySelectorAll('.card:not(.matched)').length === 0; }
  
  // UI Logic
  const BEST_KEY = 'matchGameBestTime_export';
  let timerInterval = null, startTime = null;
  const toggleTimer = document.getElementById('toggleTimer');
  const timerDisplay = document.getElementById('timerDisplay');
  const recordDisplay = document.getElementById('recordDisplay');
  const endMessageEl = document.getElementById('endMessage');
  const DARK_KEY = 'exportGameDarkMode';
  
  (function restoreDarkMode() { try { const saved = localStorage.getItem(DARK_KEY); const darkOn = saved === '1'; document.body.classList.toggle('dark-mode', darkOn); const dt = document.getElementById('darkToggle'); if (dt) dt.checked = darkOn; } catch (e) {} })();
  const dtEl = document.getElementById('darkToggle');
  if (dtEl) { dtEl.addEventListener('change', function () { try { localStorage.setItem(DARK_KEY, this.checked ? '1' : '0'); } catch (e) {} document.body.classList.toggle('dark-mode', this.checked); }); }
  
  function refreshBest(){ const raw = localStorage.getItem(BEST_KEY); if(!raw){ recordDisplay.textContent = 'Rekord: –'; return; } try{ const r=JSON.parse(raw); recordDisplay.textContent = 'Rekord: ' + r.time.toFixed(2) + ' s ('+r.date+' '+r.timeOfDay+')'; }catch(e){ recordDisplay.textContent = 'Rekord: –'; } }
  refreshBest();
  function startTimer(){ stopTimer(); startTime = performance.now(); timerInterval = setInterval(()=>{ const elapsed = (performance.now()-startTime)/1000; timerDisplay.textContent = 'Čas: ' + elapsed.toFixed(2) + ' s'; if(allPairsFound()){ stopTimer(); saveIfBetter(elapsed); showEnd(); refreshBest(); } }, 100); }
  function stopTimer(){ clearInterval(timerInterval); timerInterval=null; }
  toggleTimer.addEventListener('change', ()=>{ if(toggleTimer.checked) startTimer(); else { stopTimer(); timerDisplay.textContent='Čas: 0.00 s'; } });
  
  const TIMER_KEY = 'exportGameTimerOn';
  (function restoreTimerToggle() { try { const saved = localStorage.getItem(TIMER_KEY); const timerOn = saved === '1'; if (toggleTimer) { toggleTimer.checked = timerOn; if (timerOn) { if (typeof startTimer === 'function') { startTimer(); } else { Promise.resolve().then(() => { if (typeof startTimer === 'function') startTimer(); }); } } } } catch (e) {} })();
  if (toggleTimer) { toggleTimer.addEventListener('change', function () { try { localStorage.setItem(TIMER_KEY, this.checked ? '1' : '0'); } catch (e) {} try { if (this.checked) startTimer(); else stopTimer(); } catch (e) {} }); }

  function saveIfBetter(elapsed){ const raw = localStorage.getItem(BEST_KEY); let isNew = false; if(!raw) isNew = true; else { try{ const p = JSON.parse(raw); if(elapsed < p.time) isNew = true; }catch(e){} } if(isNew){ const now=new Date(); try { localStorage.setItem(BEST_KEY, JSON.stringify({time: elapsed, date: now.toLocaleDateString(), timeOfDay: now.toLocaleTimeString()})); } catch(e){} } }
  
  function showEnd(){ 
      const msg = END_MESSAGES[Math.floor(Math.random()*END_MESSAGES.length)]; 
      endMessageEl.innerHTML = '<div>' + msg + '</div><button class="replay-btn" onclick="location.reload()">Hraj znova</button>'; 
      endMessageEl.style.display = 'flex'; 
      endMessageEl.style.opacity = '1'; 
  }

  // --- TTS LOGIC & PERSISTENCE EXPORT ---
  const toggleTTS = document.getElementById('toggleTTS');
  const ttsSettings = document.getElementById('ttsSettings');
  
  if(toggleTTS) {
      toggleTTS.addEventListener('change', function() {
          ttsSettings.style.display = this.checked ? 'flex' : 'none';
      });
  }
  
  // Uloženie nastavení rýchlosti a jazyka do pamäte prehliadača
  ['Term', 'Def'].forEach(type => {
      const rateInput = document.getElementById('rate' + type);
      const rateVal = document.getElementById('rate' + type + 'Val');
      const langSel = document.getElementById('lang' + type);
      
      const rateKey = 'exportGameRate' + type;
      const langKey = 'exportGameLang' + type;
      
      if(rateInput && rateVal) {
          try { const saved = localStorage.getItem(rateKey); if(saved !== null) { rateInput.value = saved; rateVal.textContent = saved; } } catch(e) {}
          rateInput.addEventListener('input', function() { rateVal.textContent = this.value; try { localStorage.setItem(rateKey, this.value); } catch(e) {} });
      }
      if(langSel) {
          try { const saved = localStorage.getItem(langKey); if(saved) langSel.value = saved; } catch(e) {}
          langSel.addEventListener('change', function() { try { localStorage.setItem(langKey, this.value); } catch(e) {} });
      }
  });

  function speakCard(el, callback) {
      if (!toggleTTS || !toggleTTS.checked) { if (callback) callback(); return; }
      if (el.querySelector("img")) { if (callback) callback(); return; }
      
      // Používame čistý text pre TTS
      const text = el.dataset.ttsText || el.textContent || el.innerText;
      if (!text || !text.trim()) { if (callback) callback(); return; }
      
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const type = el.dataset.type;
      
      const lang = type === "term" ? document.getElementById("langTerm").value : document.getElementById("langDef").value;
      const speed = type === "term" ? document.getElementById("rateTerm").value : document.getElementById("rateDef").value;
      
      u.lang = lang;
      u.rate = parseFloat(speed);
      
      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
          let voice = voices.find(v => v.lang === lang || v.lang.replace('_', '-') === lang);
          if (!voice) voice = voices.find(v => v.lang.startsWith(lang.substring(0, 2)));
          if (voice) u.voice = voice;
      }
      
      if (callback) {
          let done = false;
          const finish = () => { if (!done) { done = true; callback(); } };
          u.onend = finish;
          u.onerror = finish;
          setTimeout(finish, Math.max(2500, text.split(" ").length * 800));
      }
      speechSynthesis.speak(u);
  }

  function formatCardText(text){
    if(!text) return "";
    if(text.startsWith("data:image")) return '<img src="'+text+'">';
    if(text.includes(' ') && text.length < 50) return text.replace(/\s+/g, '<br>');
    return text;
  }
  function autoFitText(element) {
    if(element.querySelector("img")) return;
    let size = 34; const minSize = 10; element.style.fontSize = size + "px";
    while ((element.scrollHeight > element.clientHeight || element.scrollWidth > element.clientWidth) && size > minSize) {
        size--; element.style.fontSize = size + "px";
    }
  }

  const pick = shuffle(EXPORT_PAIRS.slice()).slice(0, Math.min(PAIR_COUNT, EXPORT_PAIRS.length));
  let cards = [];
  pick.forEach((p,i)=>{ cards.push({id:i,text:p[0],type:'term'}); cards.push({id:i,text:p[1],type:'definition'}); });
  shuffle(cards);
  
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'card ' + (c.type === 'term' ? 'term' : 'definition');
    if(HIGHLIGHT === 'term' && c.type === 'term') d.classList.add('bold');
    if(HIGHLIGHT === 'definition' && c.type === 'definition') d.classList.add('bold');
    
    // Ukladáme si čistý text pre TTS
    d.dataset.ttsText = c.text;
    
    d.innerHTML = formatCardText(c.text); 
    d.dataset.pairId = c.id;
    d.dataset.type = c.type;
    board.appendChild(d); 
    d.addEventListener('click', ()=> onClick(d));
    autoFitText(d);
  });
  
  let first=null, second=null;
  let isProcessing = false;
  
  function onClick(el){ 
    if(isProcessing || el.classList.contains('matched') || el.classList.contains('selected')) return; 
    el.classList.add('selected'); 
    
    if(!first){ 
        first = el; 
        speakCard(first);
        return; 
    } 
    second = el; 
    isProcessing = true;
    
    const typeA = first.dataset.type;
    const typeB = second.dataset.type;
    let isMatch = false;
    
    if (typeA !== typeB) {
        const termId = parseInt(typeA === 'term' ? first.dataset.pairId : second.dataset.pairId, 10);
        const defId = parseInt(typeA === 'definition' ? first.dataset.pairId : second.dataset.pairId, 10);
        const termText = pick[termId][0];
        const defText = pick[defId][1];
        isMatch = pick.some(p => p[0] === termText && p[1] === defText);
    }
    
    if(isMatch && first !== second){ 
        first.classList.add('correct'); second.classList.add('correct'); 
        const f1 = first, f2 = second;
        const finish = () => {
            f1.classList.add('matched'); f2.classList.add('matched'); 
            f1.classList.remove('correct','selected'); f2.classList.remove('correct','selected'); 
            first=second=null; isProcessing = false;
            if(toggleTimer.checked){} else if(!document.querySelector('.card:not(.matched)')) showEnd(); 
        };
        if(toggleTTS.checked) speakCard(f2, finish);
        else setTimeout(finish, 120);
    } else { 
        first.classList.add('wrong'); second.classList.add('wrong'); 
        const f1 = first, f2 = second;
        const finish = () => {
            f1.classList.remove('wrong','selected'); f2.classList.remove('wrong','selected'); 
            first=second=null; isProcessing = false;
        };
        if(toggleTTS.checked) speakCard(f2, finish);
        else setTimeout(finish, 300);
    } 
  }
  document.getElementById('restartBtn').addEventListener('click', function(){ location.reload(); });
})();
</script>

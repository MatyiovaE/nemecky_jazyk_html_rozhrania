    <script>
        // --- UPRAVENÁ LOGIKA CVIČENIA S PODPOROU BLOKOV A BODOVANIA ---

        const rawExerciseBlocks = [[{"subText":"Čo robíš v pondelok?","components":[{"type":"stub","value":"Was machst du "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Montag","points":1},{"type":"stub","value":"?"}],"fullAnswer":"Was machst du am Montag?"},{"subText":"Kto hrá v utorok futbal?","components":[{"type":"stub","value":"Wer spielt "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Dienstag","points":1},{"type":"stub","value":" Fußball?"}],"fullAnswer":"Wer spielt am Dienstag Fußball?"},{"subText":"Učí sa niekto v stredu nemčinu?","components":[{"type":"stub","value":"Lernt jemand "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Mittwoch","points":1},{"type":"stub","value":" Deutsch?"}],"fullAnswer":"Lernt jemand am Mittwoch Deutsch?"},{"subText":"Máš v nedeľu voľno?","components":[{"type":"stub","value":"Hast du "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Sonntag","points":1},{"type":"stub","value":" frei?"}],"fullAnswer":"Hast du am Sonntag frei?"},{"subText":"Má Jürgen vo štvrtok klavír alebo karate?","components":[{"type":"stub","value":"Hat Jürgen "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Donnerstag","points":1},{"type":"stub","value":" Klavier oder Karate?"}],"fullAnswer":"Hat Jürgen am Donnerstag Klavier oder Karate?"},{"subText":"Nikto nemá v sobotu spev.","components":[{"type":"stub","value":"Niemand hat "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Samstag","points":1},{"type":"stub","value":" Singen."}],"fullAnswer":"Niemand hat am Samstag Singen."},{"subText":"My máme v piatok tanec.","components":[{"type":"stub","value":"Wir haben "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Freitag","points":1},{"type":"stub","value":" Tanzen."}],"fullAnswer":"Wir haben am Freitag Tanzen."},{"subText":"Klaus nepracuje v sobotu.","components":[{"type":"stub","value":"Klaus arbeitet "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Samstag","points":1},{"type":"stub","value":" nicht."}],"fullAnswer":"Klaus arbeitet am Samstag nicht."},{"subText":"Pracuje niekto v nedeľu?","components":[{"type":"stub","value":"Arbeitet jemand "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Sonntag","points":1},{"type":"stub","value":"?"}],"fullAnswer":"Arbeitet jemand am Sonntag?"},{"subText":"Všetci sa učia v pondelok angličtinu.","components":[{"type":"stub","value":"Alle lernen "},{"type":"answer","value":"am","points":1},{"type":"stub","value":" "},{"type":"answer","value":"Montag","points":1},{"type":"stub","value":" Englisch."}],"fullAnswer":"Alle lernen am Montag Englisch."}]]; // Pole blokov (každý blok obsahuje úlohy)
        const exerciseTitle = "NEJ - Použitie predložky am pri dňoch";
        const generatorMaxTasks = 0; 

        let allTasks = [];     
        let globalTaskIndex = 0;
        
        // Pomocná funkcia pre pekný výpis bodov (zaokrúhli a vymení bodku za čiarku)
        function formatScore(num) {
            return (Math.round(num * 100) / 100).toString().replace('.', ',');
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }
        
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const blockSettingsDiv = document.getElementById('blockSettings');
        const studentInfoDiv = document.getElementById('studentInfo'); 

        // Generovanie nastavení pre jednotlivé bloky
        if (rawExerciseBlocks.length === 0) {
            blockSettingsDiv.innerHTML = '<p style="font-size: 1em; color: red;">Chyba: Neboli nájdené žiadne úlohy na spustenie. Skontrolujte vstupné dáta v generátore.</p>';
        } else {
            let html = '';
            rawExerciseBlocks.forEach((block, index) => {
				let defaultCount = block.length; // záložná hodnota
                if (index === 0) defaultCount = 8; // Predvolené pre 1. blok
                if (index === 1) defaultCount = 10;  // Predvolené pre 2. blok
                
                // Ošetrenie, aby predvolené číslo nebolo vyššie ako počet úloh v bloku
                if (defaultCount > block.length) defaultCount = block.length;
				
                html += `
                    <div style="margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                        <label for="taskCountInput${index}" style="margin:0;">Počet úloh z bloku ${index + 1} (max: <span id="maxTasksLabel${index}">${block.length}</span>):</label>
                        <input type="number" id="taskCountInput${index}" value="${defaultCount}" min="0" max="${block.length}" style="width: 80px; font-size: 1.1em; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                `;
            });
            blockSettingsDiv.innerHTML = html;
        }

        let userAnswers = []; 
        let currentTaskIndex = 0;
        let isEvaluated = false;
        let detailedResultsData = null; 

        const studentNameInput = document.getElementById('studentName');
        const taskDisplay = document.getElementById('taskDisplay');
        const nextBtn = document.getElementById('nextBtn');
        const evalBtn = document.getElementById('evalBtn');
        const navButtonsContainer = document.getElementById('navButtons');
        const exerciseContainer = document.getElementById('exerciseContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsSummary = document.getElementById('resultsSummary');
        const resultsList = document.getElementById('resultsList');
        const detailBtn = document.getElementById('detailBtn');
        
        studentNameInput.value = localStorage.getItem('studentName') || '';
        studentNameInput.addEventListener('input', (e) => localStorage.setItem('studentName', e.target.value));

        function handleKey(buttonElement) {
            const char = buttonElement.textContent;
            const focusedInput = document.activeElement; 
            
            if (focusedInput && focusedInput.classList.contains('answer-input')) {
                focusedInput.value = char;
                focusedInput.dispatchEvent(new Event('input')); 
            }
        }
        window.handleKey = handleKey; 

        function renderTask(index) {
            if (isEvaluated) return;
            currentTaskIndex = index;
            const task = allTasks[index]; 

            let html = `<div class="main-text">`;
            
            let inputCounter = 0;
            task.components.forEach(comp => {
                if (comp.type === 'stub') {
                    html += `<span class="stub">${comp.value}</span>`;
                } else { 
                    html += `<span style="white-space: nowrap;">`;
                    for(let i=0; i<comp.value.length; i++) {
                        let savedAnswer = (userAnswers[index] && userAnswers[index].length > inputCounter) ? userAnswers[index][inputCounter] : "";
                        
                        html += `<input type="text" class="answer-input" maxlength="1" data-task-index="${index}" data-input-index="${inputCounter}" value="${savedAnswer}" style="width: 1.2em; text-align: center; margin: 0 3px;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
                        inputCounter++;
                    }
                    html += `</span>`;
                }
            });
            html += `</div>`;

            if (task.subText) {
                html += `<div class="subtext">${task.subText}</div>`;
            }

            taskDisplay.innerHTML = html;

            const inputs = taskDisplay.querySelectorAll('.answer-input');
            inputs.forEach((input, i) => {
                input.addEventListener('input', (e) => {
                    if (input.value.length === 1 && i < inputs.length - 1) {
                        inputs[i + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && i > 0) {
                        inputs[i - 1].focus();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (currentTaskIndex === allTasks.length - 1) {
                            evalBtn.click();
                        } else {
                            nextBtn.click();
                        }
                    } else if (e.key === 'ArrowLeft' && i > 0) {
                        inputs[i - 1].focus();
                    } else if (e.key === 'ArrowRight' && i < inputs.length - 1) {
                        inputs[i + 1].focus();
                    }
                });
            });

            const firstInput = taskDisplay.querySelector('input[type="text"]');
            if (firstInput) firstInput.focus();

            updateNavButtons();
            updateNavState();
        }

        function saveAnswer() {
            const inputs = taskDisplay.querySelectorAll('.answer-input');
            if (inputs.length === 0) return;

            const answers = [];
            inputs.forEach(input => answers.push(input.value.trim()));
            userAnswers[currentTaskIndex] = answers;
        }

        function updateNavButtons() {
            navButtonsContainer.innerHTML = '';
            for (let i = 0; i < allTasks.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                
                if (i === currentTaskIndex) {
                    btn.classList.add('current');
                } 
                
                if (userAnswers[i] !== null) {
                    btn.classList.add('completed');
                }
                
                if (!isEvaluated) { 
                    btn.onclick = () => { saveAnswer(); renderTask(i); };
                }
                
                navButtonsContainer.appendChild(btn);
            }
        }

        function updateNavState() {
            if (currentTaskIndex === allTasks.length - 1) {
                nextBtn.style.display = 'none';
                evalBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                evalBtn.style.display = 'none';
            }
        }

        nextBtn.onclick = () => {
            saveAnswer();
            if (currentTaskIndex < allTasks.length - 1) {
                renderTask(currentTaskIndex + 1);
            }
        };

        evalBtn.onclick = () => {
            saveAnswer();
            evaluate();
        };

        detailBtn.onclick = showDetailedResults;
        
        startBtn.onclick = () => {
            let selectedTasks = [];

            // Spracovanie výberu pre každý blok
            rawExerciseBlocks.forEach((block, index) => {
                let inputElement = document.getElementById('taskCountInput' + index);
                if (inputElement) {
                    let numTasks = parseInt(inputElement.value, 10);
                    
                    if (isNaN(numTasks) || numTasks < 0) {
                        numTasks = 0;
                    }
                    if (numTasks > block.length) {
                        numTasks = block.length;
                    }
                    
                    // Zamiešanie bloku a výber určeného počtu úloh
                    let shuffledBlock = shuffle([...block]);
                    selectedTasks = selectedTasks.concat(shuffledBlock.slice(0, numTasks));
                }
            });

            if (selectedTasks.length === 0) {
                alert("Musíte zvoliť aspoň jednu úlohu pre spustenie cvičenia.");
                return;
            }

            // Výsledné premiešanie úloh zo všetkých blokov dohromady
            allTasks = shuffle(selectedTasks);
            userAnswers = new Array(allTasks.length).fill(null);

            startScreen.style.display = 'none';
            studentInfoDiv.style.display = 'block';
            exerciseContainer.style.display = 'block';
            
            renderTask(0);
        };

        // --- UPRAVENÁ LOGIKA HODNOTENIA (S BODOVANÍM ZA KAŽDÉ SLOVO ZVLÁŠŤ) ---
        function evaluate() {
            isEvaluated = true;
            let totalScore = 0;
            let maxTotalScore = 0;
            const results = [];
            const epsilon = 0.0001; // kvôli float zaokrúhľovaniu

            allTasks.forEach((task, index) => {
                const studentAnswers = userAnswers[index] || [];
                let studentTextAnswer = "";
                let inputCounter = 0;
                let taskScore = 0;
                let taskMaxScore = 0;

                task.components.forEach(c => {
                    if (c.type === 'stub') {
                        studentTextAnswer += c.value;
                    } else {
                        let compCorrect = true;
                        for(let i=0; i<c.value.length; i++) {
                            let charAns = studentAnswers[inputCounter] || "";
                            studentTextAnswer += (charAns || "_");
                            // Zisťujeme zhodu jednotlivých písmen aktuálneho slova
                            if (charAns !== c.value[i]) {
                                compCorrect = false;
                            }
                            inputCounter++;
                        }
                        
                        taskMaxScore += c.points;
                        // Pridanie bodov za slovo len ak je napísané úplne bezchybne
                        if (compCorrect) {
                            taskScore += c.points;
                        }
                    }
                });

                totalScore += taskScore;
                maxTotalScore += taskMaxScore;

                results.push({
                    ...task,
                    studentAnswers,
                    studentTextAnswer, 
                    taskScore,
                    taskMaxScore
                });
            });

            const percentage = maxTotalScore > 0 ? (totalScore / maxTotalScore) * 100 : 0;
            const now = new Date();
            const timestamp = now.toLocaleString('sk-SK', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const studentName = studentNameInput.value.trim() || 'Anonym';

            exerciseContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            studentNameInput.disabled = true;

            resultsSummary.innerHTML = `
                <p><strong>Názov cvičenia:</strong> ${exerciseTitle}</p>
                <p><strong>Meno žiaka:</strong> ${studentName}</p>
                <p><strong>Bodové hodnotenie:</strong> ${formatScore(totalScore)} b. z ${formatScore(maxTotalScore)} b.</p>
                <p><strong>Percentuálna úspešnosť:</strong> ${percentage.toFixed(1)} %</p>
                <p><strong>Dátum a čas:</strong> ${timestamp}</p>
            `;

            let resultsHTML = "<h3>Detailné odpovede:</h3>";
            results.forEach(res => {
                let symbolClass = '';
                let symbol = '';
                
                let isCompletelyCorrect = Math.abs(res.taskScore - res.taskMaxScore) < epsilon && res.taskMaxScore > 0;
                let isPartial = res.taskScore > epsilon && !isCompletelyCorrect;

                if (isCompletelyCorrect) {
                     symbolClass = 'correct'; symbol = '✓';
                } else if (isPartial) {
                     symbolClass = 'partial'; symbol = 'O';
                } else {
                     symbolClass = 'incorrect'; symbol = '✗';
                }
                
                resultsHTML += `<div class="result-item ${symbolClass}">`;
                resultsHTML += `<span class="symbol ${symbolClass}">${symbol}</span>`;
                resultsHTML += `<div>
                                    <span><strong>${res.studentTextAnswer}</strong> (${formatScore(res.taskScore)}/${formatScore(res.taskMaxScore)} b.)</span>
                                    ${res.subText ? `<br><span style="font-size:0.8em; color:#666;">${res.subText}</span>` : ''}
                                </div>`;
                
                // Vypísanie správnej odpovede, ak nie je úloha úplne bez chýb
                if (!isCompletelyCorrect) {
                    resultsHTML += `<span class="correct-answer" style="margin-left: 20px;">(Správne: ${res.fullAnswer})</span>`;
                }
                resultsHTML += `</div>`;
            });
            resultsList.innerHTML = resultsHTML;

            detailedResultsData = {
                title: exerciseTitle,
                name: studentName,
                totalScore,
                maxTotalScore,
                percentage,
                timestamp,
                results
            };
        }
        
        function showDetailedResults() {
            if (!detailedResultsData) {
                alert("Najprv je potrebné cvičenie vyhodnotiť.");
                return;
            }
            const data = detailedResultsData;
            const epsilon = 0.0001;

            const newWin = window.open('', 'DetailnéVýsledky', 'width=900,height=700,scrollbars=yes,resizable=yes'); 
            if (!newWin) {
                alert("Prosím, povoľte vyskakovacie okná pre zobrazenie detailných výsledkov.");
                return;
            }

            let html = `
                <!DOCTYPE html>
                <html lang="sk">
                <head>
                    <meta charset="UTF-8">
                    <title>Detailné výsledky - ${data.title}</title>
                    <style>
                        body { font-family: Arial, sans-serif; line-height: 1.5; padding: 20px; }
                        h1 { color: #000; border-bottom: 2px solid #000; padding-bottom: 5px; }
                        h2 { margin-top: 30px; border-bottom: 1px solid #ccc; padding-bottom: 3px;}
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 1em;}
                        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; vertical-align: top; }
                        th { background-color: #f0f0f0; }
                        .symbol { font-size: 1.2em; font-weight: bold; text-align: center; }
                        .correct { color: #28a745; }
                        .incorrect { color: #dc3545; }
                        .partial { color: #fd7e14; }
                        .legend { margin-top: 20px; font-size: 0.9em; }
                        @media print {
                            body { padding: 10px; }
                            .no-print { display: none !important; }
                        }
                    </style>
                </head>
                <body class="detail-results-body">
                    <h1>${data.title}</h1>
                    <p><strong>Meno žiaka:</strong> ${data.name}</p>
                    <p><strong>Bodové a percentuálne hodnotenie:</strong> ${formatScore(data.totalScore)} b. z ${formatScore(data.maxTotalScore)} b. (${data.percentage.toFixed(1)}%)</p>
                    <p><strong>Dátum a čas:</strong> ${data.timestamp}</p>

                    <h2>Detailný prehľad</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Zadanie / Preklad</th>
                                <th>Tvoja odpoveď</th>
                                <th>Správna odpoveď</th>
                                <th class="symbol">Výsledok</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.results.forEach(res => {
                let symbolClass = '';
                let symbol = '';
                
                let isCompletelyCorrect = Math.abs(res.taskScore - res.taskMaxScore) < epsilon && res.taskMaxScore > 0;
                let isPartial = res.taskScore > epsilon && !isCompletelyCorrect;

                if (isCompletelyCorrect) {
                     symbolClass = 'correct'; symbol = '✓';
                } else if (isPartial) {
                     symbolClass = 'partial'; symbol = 'O';
                } else {
                     symbolClass = 'incorrect'; symbol = '✗';
                }
                
                html += `
                    <tr>
                        <td>${res.subText || '–'}</td>
                        <td><strong>${res.studentTextAnswer || '–'}</strong></td>
                        <td><strong>${res.fullAnswer}</strong></td>
                        <td class="symbol ${symbolClass}" style="white-space: nowrap;">${symbol} <span style="font-size: 0.8em; color: #333; margin-left: 8px;">(${formatScore(res.taskScore)}/${formatScore(res.taskMaxScore)} b.)</span></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                    <div class="legend">
                        <p><strong>Vysvetlivky:</strong></p>
                        <ul>
                            <li><span class="symbol correct">✓</span> = Úloha vyriešená úplne správne</li>
                            <li><span class="symbol partial">O</span> = Úloha vyriešená čiastočne (niektoré slová správne, iné nie)</li>
                            <li><span class="symbol incorrect">✗</span> = Úloha vyriešená nesprávne (žiadne skryté slovo nebolo úplne správne)</li>
                        </ul>
                    </div>
                    <div class="no-print" style="margin-top: 40px;"><p>Túto stránku je možné vytlačiť pomocou Ctrl + P (alebo Command + P).</p></div>
                </body>
                </html>
            `;

            newWin.document.open();
            newWin.document.write(html);
            newWin.document.close();
            newWin.focus(); 
        }
      
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>NEJ - Časovanie slovies v prítomnom čase - opakovanie (VII.B)</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive; text-align: center; background: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        #startBtn, #nextBtn { background: #27ae60; color: white; border: none; padding: 15px 40px; border-radius: 5px; cursor: pointer; font-size: 1.3em; margin-top: 30px; font-family: 'Comic Sans MS', cursive; font-weight: bold; }
        #nextBtn:hover { background: #2ecc71; }
        #wheel-ui { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 1000px; }
        .wheel-box { position: relative; display: flex; align-items: center; justify-content: center; margin: 20px; }
        .arrow {
            width: 0; height: 0;
            border-top: 25px solid transparent; border-bottom: 25px solid transparent;
            border-left: 50px solid #27ae60; margin-right: -10px; z-index: 5;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }
        #result-box { margin-top: 40px; display: none; flex-direction: column; align-items: center; width: 100%; }
        #winner-text { font-size: 2.5em; font-weight: bold; background: #f0f8ff; padding: 15px 40px; border-radius: 10px; border: 3px dashed #2980b9; margin-bottom: 30px; display: inline-block; }
        #task-text { font-size: 3em; font-weight: normal; color: #000; text-align: center; margin: 20px 0; line-height: 1.3; width: 100%; word-wrap: break-word; }
    </style>
</head>
<body>
    <div id="intro">
        <h1>NEJ - Časovanie slovies v prítomnom čase - opakovanie (VII.B)</h1>
        <div class="meta">Mgr. Erika Matyiová 2026</div>
        <button id="startBtn" onclick="initWheel()">Štart</button>
    </div>

    <div id="wheel-ui">
        <div id="instruction-text" style="font-size: 1.2em; font-weight: bold; margin-bottom: 15px;">Klikni na stred kruhu.</div>
        
        <div class="wheel-box">
            <div class="arrow"></div>
            <canvas id="canvas" width="700" height="700"></canvas>
        </div>
        
        <div id="result-box">
            <div id="winner-text"></div>
            <div id="task-text"></div>
            <button id="nextBtn" onclick="removeAndReset()">Hotovo</button>
        </div>
    </div>

    <script>
        let items = ["Noel Balogh","Samuel Battyányi","Štefánia Cicuová","Benett Dorkó","Szabolcs Galgán","Imrich Hami","Ladislav Marián Kasinec","Mário Riccardo Lakatoš","Tomáš Lakatoš","Oliver Makó","Theo Popália","Vivien Šaffová","Sebastián Tippan","Noel Tóth","Kinga Vargová","Emma Vasziová"];
        let tasks = ["Časuj sloveso <b>wohnen</b> (bývať).|podľa spielen","Časuj sloveso <b>lernen</b> (učiť sa).|podľa spielen","Časuj sloveso <b>spielen</b> (hrať).","Časuj sloveso <b>machen</b> (robiť).|podľa spielen","Časuj sloveso <b>kommen</b> (prísť).|podľa spielen","Časuj sloveso <b>heißen</b> (volať sa).","Časuj sloveso <b>sein</b> (byť).","Časuj sloveso <b>klettern</b> (loziť).","Časuj sloveso <b>lieben</b> (milovať).|podľa spielen","Časuj sloveso <b>schreiben</b> (písať).|podľa spielen","Časuj sloveso <b>singen</b> (spievať).|podľa spielen","Časuj sloveso <b>telefonieren</b> (telefonovať).|podľa spielen","Časuj sloveso <b>hören</b> (počuť).|podľa spielen","Časuj sloveso <b>lachen</b> (smiať sa).|podľa spielen","Časuj sloveso <b>gehen</b> (ísť).|podľa spielen","Časuj sloveso <b>wissen</b> (vedieť).","Časuj sloveso <b>surfen</b> (surfovať)|podľa spielen","Časuj sloveso <b>tauchen</b> (potápať sa)|podľa spielen","Časuj sloveso <b>schwimmen</b> (plávať).|podľa spielen","Časuj sloveso <b>ergänzen</b> (doplniť).|podľa heißen"];
        let colors = [];
        let angle = 0;
        let spinning = false;
        let winnerIdx = -1;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const CENTER = 350;
        const RADIUS = 330;
        const BTN_RADIUS = 55;

        // Funkcia na vyparsovanie spanu s farbou
        function parseHtmlText(htmlStr) {
            const spanRegex = /<span[^>]*style=["'](?:[^"']*;)?\s*color:\s*([^;"'>]+)[^>]*>(.*?)<\/span>/i;
            const match = htmlStr.match(spanRegex);
            if (match) {
                return { color: match[1].trim(), text: match[2].trim() };
            }
            // Odstránenie iných tagov ak sú prítomné, aby na canvas nešli zátvorky (napr. b)
            const cleanText = htmlStr.replace(/<[^>]*>?/gm, '');
            return { color: "#2c3e50", text: cleanText.trim() };
        }

        function initWheel() {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('wheel-ui').style.display = 'flex';
            generateColors();
            draw();
        }

        function generateColors() {
            colors = [];
            for(let i=0; i<items.length; i++) {
                let h = (i * (360 / items.length) + Math.random() * 20) % 360;
                colors.push('hsl(' + h + ', 75%, 93%)');
            }
        }

        function draw() {
            const n = items.length;
            const arc = (Math.PI * 2) / n;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((itemHtml, i) => {
                const parsed = parseHtmlText(itemHtml);
                
                const start = angle + i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(CENTER, CENTER);
                ctx.arc(CENTER, CENTER, RADIUS, start, start + arc);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; 
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(start + arc / 2 + Math.PI); 
                
                ctx.textAlign = "left";
                ctx.textBaseline = "middle"; 
                ctx.fillStyle = parsed.color;
                
                let fontSize = Math.min(30, (RADIUS * 2 * arc) / (parsed.text.length * 0.55));
                if(fontSize < 12) fontSize = 12;
                ctx.font = fontSize + "px 'Comic Sans MS'";
                
                let displayText = parsed.text;
                if(ctx.measureText(displayText).width > 280) {
                   while(ctx.measureText(displayText + "...").width > 280 && displayText.length > 0) {
                       displayText = displayText.slice(0, -1);
                   }
                   displayText += "...";
                }

                ctx.fillText(displayText, -310, 2);
                ctx.restore();
            });

            let g = ctx.createRadialGradient(CENTER, CENTER, RADIUS/2, CENTER, CENTER, RADIUS);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(1, 'rgba(0,0,0,0.04)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI*2); ctx.fill();

            ctx.beginPath(); ctx.arc(CENTER, CENTER, BTN_RADIUS, 0, Math.PI*2);
            ctx.fillStyle = "#39ff14"; ctx.fill();
            ctx.strokeStyle = "#27ae60"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#000"; ctx.font = "bold 20px 'Comic Sans MS'";
            ctx.textAlign = "center"; ctx.fillText("Toč 🙂", CENTER, CENTER + 6);
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left - CENTER;
            const y = e.clientY - rect.top - CENTER;
            if(Math.sqrt(x*x + y*y) < BTN_RADIUS && !spinning && items.length > 0) {
                spin();
            }
        };

        function spin() {
            spinning = true;
            let speed = 0.35 + Math.random() * 0.15;
            function animate() {
                angle += speed;
                speed *= 0.986;
                draw();
                if(speed > 0.002) requestAnimationFrame(animate);
                else {
                    spinning = false;
                    const n = items.length;
                    const arc = (Math.PI * 2) / n;
                    let norm = (Math.PI - (angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                    winnerIdx = Math.floor(norm / arc);
                    
                    showResult();
                }
            }
            animate();
        }

        function showResult() {
            const parsedWinner = parseHtmlText(items[winnerIdx]);
            
            const winnerDiv = document.getElementById('winner-text');
            winnerDiv.innerText = parsedWinner.text;
            winnerDiv.style.color = parsedWinner.color === "#2c3e50" ? "#2980b9" : parsedWinner.color;
            winnerDiv.style.borderColor = winnerDiv.style.color;

            const taskDiv = document.getElementById('task-text');
            if (tasks.length > 0) {
                const randomTaskIdx = Math.floor(Math.random() * tasks.length);
                let selectedTask = tasks[randomTaskIdx];
                tasks.splice(randomTaskIdx, 1);
                selectedTask = selectedTask.replace(/\|/g, '<br>');
                taskDiv.innerHTML = selectedTask;
            } else {
                taskDiv.innerHTML = "<span style='color: #7f8c8d; font-size: 0.6em;'><i>Žiadne ďalšie úlohy nie sú k dispozícii.</i></span>";
            }

            document.querySelector('.wheel-box').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            document.getElementById('result-box').style.display = 'flex';
        }

        function removeAndReset() {
            items.splice(winnerIdx, 1);
            colors.splice(winnerIdx, 1);
            
            document.getElementById('result-box').style.display = 'none';
            winnerIdx = -1;
            
            if (items.length > 0) {
                document.querySelector('.wheel-box').style.display = 'flex';
                document.getElementById('instruction-text').style.display = 'block';
                draw();
            } else {
                document.getElementById('wheel-ui').innerHTML = "<h2 style='color:#27ae60; font-size: 2em; margin-top: 50px;'>Koniec! Všetky mená boli vyžrebované.</h2>";
            }
        }
    </script>
</body>
</html>

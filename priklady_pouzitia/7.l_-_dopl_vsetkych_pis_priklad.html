,"value":"Energie"}],"fullAnswer":"die Energie"},{"subText":"starí rodičia (množné číslo)","components":[{"type":"answer","value":"die"},{"type":"stub","value":" "},{"type":"answer","value":"Großeltern"}],"fullAnswer":"die Großeltern"},{"subText":"moji rodičia (množné číslo)","components":[{"type":"answer","value":"meine"},{"type":"stub","value":" "},{"type":"answer","value":"Eltern"}],"fullAnswer":"meine Eltern"},{"subText":"lekár (jednotné číslo)","components":[{"type":"answer","value":"der"},{"type":"stub","value":" "},{"type":"answer","value":"Arzt"}],"fullAnswer":"der Arzt"},{"subText":"trénovať","components":[{"type":"answer","value":"trainieren"}],"fullAnswer":"trainieren"},{"subText":"učiteľka (jednotné číslo)","components":[{"type":"answer","value":"die"},{"type":"stub","value":" "},{"type":"answer","value":"Lehrerin"}],"fullAnswer":"die Lehrerin"},{"subText":"otcovia (množné číslo)","components":[{"type":"answer","value":"die"},{"type":"stub","value":" "},{"type":"answer","value":"Väter"}],"fullAnswer":"die Väter"},{"subText":"kresliť","components":[{"type":"answer","value":"zeichnen"}],"fullAnswer":"zeichnen"},{"subText":"ísť na nervy","components":[{"type":"answer","value":"nerven"}],"fullAnswer":"nerven"},{"subText":"Grécko","components":[{"type":"answer","value":"das"},{"type":"stub","value":" "},{"type":"answer","value":"Griechenland"}],"fullAnswer":"das Griechenland"},{"subText":"ona kreslí","components":[{"type":"answer","value":"sie"},{"type":"stub","value":" "},{"type":"answer","value":"zeichnet"}],"fullAnswer":"sie zeichnet"},{"subText":"moji súrodenci (množné číslo)","components":[{"type":"answer","value":"meine"},{"type":"stub","value":" "},{"type":"answer","value":"Geschwister"}],"fullAnswer":"meine Geschwister"}];
        const exerciseTitle = "NEJ - 7. lekcia - doplňovanie všetkých písmen";
        const generatorMaxTasks = 0; 

        let fullTaskPool = []; 
        let allTasks = [];     
        let globalTaskIndex = 0;
        
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        (function createFullPool() {
            rawExerciseData.forEach(task => {
                fullTaskPool.push({
                    ...task,
                    globalIndex: globalTaskIndex++
                });
            });

            fullTaskPool = shuffle(fullTaskPool); 

            if (generatorMaxTasks > 0 && generatorMaxTasks < fullTaskPool.length) {
                fullTaskPool = fullTaskPool.slice(0, generatorMaxTasks);
            }
        })();
        
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const taskCountInput = document.getElementById('taskCountInput');
        const maxTasksLabel = document.getElementById('maxTasksLabel');
        const studentInfoDiv = document.getElementById('studentInfo'); 

        const maxAvailable = fullTaskPool.length;
        maxTasksLabel.textContent = maxAvailable;
        taskCountInput.max = maxAvailable;
        if (parseInt(taskCountInput.value) > maxAvailable) {
            taskCountInput.value = maxAvailable;
        }
        if (maxAvailable === 0) {
            startScreen.innerHTML = '<p style="font-size: 1em; color: red;">Chyba: Neboli nájdené žiadne úlohy. Skontrolujte vstupné dáta v generátore.</p>';
        }
        
        let userAnswers = []; 
        let currentTaskIndex = 0;
        let isEvaluated = false;
        let detailedResultsData = null; 

        const studentNameInput = document.getElementById('studentName');
        const taskDisplay = document.getElementById('taskDisplay');
        const nextBtn = document.getElementById('nextBtn');
        const evalBtn = document.getElementById('evalBtn');
        const navButtonsContainer = document.getElementById('navButtons');
        const exerciseContainer = document.getElementById('exerciseContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsSummary = document.getElementById('resultsSummary');
        const resultsList = document.getElementById('resultsList');
        const detailBtn = document.getElementById('detailBtn');
        
        studentNameInput.value = localStorage.getItem('studentName') || '';
        studentNameInput.addEventListener('input', (e) => localStorage.setItem('studentName', e.target.value));

        function handleKey(buttonElement) {
            const char = buttonElement.textContent;
            const focusedInput = document.activeElement; 
            
            if (focusedInput && focusedInput.classList.contains('answer-input')) {
                focusedInput.value = char;
                focusedInput.dispatchEvent(new Event('input')); 
            }
        }
        window.handleKey = handleKey; 

        function renderTask(index) {
            if (isEvaluated) return;
            currentTaskIndex = index;
            const task = allTasks[index]; 

            let html = `<div class="main-text">`;
            
            let inputCounter = 0;
            task.components.forEach(comp => {
                if (comp.type === 'stub') {
                    html += `<span class="stub">${comp.value}</span>`;
                } else { 
                    html += `<span style="white-space: nowrap;">`;
                    for(let i=0; i<comp.value.length; i++) {
                        let savedAnswer = (userAnswers[index] && userAnswers[index].length > inputCounter) ? userAnswers[index][inputCounter] : "";
                        
                        html += `<input type="text" class="answer-input" maxlength="1" data-task-index="${index}" data-input-index="${inputCounter}" value="${savedAnswer}" style="width: 1.2em; text-align: center; margin: 0 3px;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
                        inputCounter++;
                    }
                    html += `</span>`;
                }
            });
            html += `</div>`;

            if (task.subText) {
                html += `<div class="subtext">${task.subText}</div>`;
            }

            taskDisplay.innerHTML = html;

            const inputs = taskDisplay.querySelectorAll('.answer-input');
            inputs.forEach((input, i) => {
                input.addEventListener('input', (e) => {
                    // Po zadaní znaku automaticky preskočí na ďalšie políčko
                    if (input.value.length === 1 && i < inputs.length - 1) {
                        inputs[i + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value === '' && i > 0) {
                        // Návrat na predchádzajúce pole pri vymazávaní
                        inputs[i - 1].focus();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (currentTaskIndex === allTasks.length - 1) {
                            evalBtn.click();
                        } else {
                            nextBtn.click();
                        }
                    } else if (e.key === 'ArrowLeft' && i > 0) {
                        inputs[i - 1].focus();
                    } else if (e.key === 'ArrowRight' && i < inputs.length - 1) {
                        inputs[i + 1].focus();
                    }
                });
            });

            const firstInput = taskDisplay.querySelector('input[type="text"]');
            if (firstInput) firstInput.focus();

            updateNavButtons();
            updateNavState();
        }

        function saveAnswer() {
            const inputs = taskDisplay.querySelectorAll('.answer-input');
            if (inputs.length === 0) return;

            const answers = [];
            inputs.forEach(input => answers.push(input.value.trim()));
            userAnswers[currentTaskIndex] = answers;
        }

        function updateNavButtons() {
            navButtonsContainer.innerHTML = '';
            for (let i = 0; i < allTasks.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                
                if (i === currentTaskIndex) {
                    btn.classList.add('current');
                } 
                
                if (userAnswers[i] !== null) {
                    btn.classList.add('completed');
                }
                
                if (!isEvaluated) { 
                    btn.onclick = () => { saveAnswer(); renderTask(i); };
                }
                
                navButtonsContainer.appendChild(btn);
            }
        }

        function updateNavState() {
            if (currentTaskIndex === allTasks.length - 1) {
                nextBtn.style.display = 'none';
                evalBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                evalBtn.style.display = 'none';
            }
        }

        nextBtn.onclick = () => {
            saveAnswer();
            if (currentTaskIndex < allTasks.length - 1) {
                renderTask(currentTaskIndex + 1);
            }
        };

        evalBtn.onclick = () => {
            saveAnswer();
            evaluate();
        };

        detailBtn.onclick = showDetailedResults;
        
        startBtn.onclick = () => {
            let numTasks = parseInt(taskCountInput.value, 10);
            
            if (isNaN(numTasks) || numTasks < 1) {
                numTasks = 1;
            }
            if (numTasks > fullTaskPool.length) {
                numTasks = fullTaskPool.length;
            }
            
            allTasks = fullTaskPool.slice(0, numTasks);
            userAnswers = new Array(allTasks.length).fill(null);

            startScreen.style.display = 'none';
            studentInfoDiv.style.display = 'block';
            exerciseContainer.style.display = 'block';
            
            if (allTasks.length > 0) {
                renderTask(0);
            } else {
                exerciseContainer.innerHTML = '<p style="font-size: 1em; color: red;">Chyba: Neboli nájdené žiadne úlohy na spustenie.</p>';
            }
        };

        function evaluate() {
            isEvaluated = true;
            let totalScore = 0;
            let maxTotalScore = 0;
            const results = [];

            allTasks.forEach((task, index) => {
                const studentAnswers = userAnswers[index] || [];
                let taskCorrectLetters = 0;
                let taskTotalLetters = 0;
                let studentTextAnswer = "";
                let inputCounter = 0;

                task.components.forEach(c => {
                    if (c.type === 'stub') {
                        studentTextAnswer += c.value;
                    } else {
                        for(let i=0; i<c.value.length; i++) {
                            let charAns = studentAnswers[inputCounter] || "";
                            studentTextAnswer += (charAns || "_");
                            taskTotalLetters++;
                            if (charAns === c.value[i]) {
                                taskCorrectLetters++;
                            }
                            inputCounter++;
                        }
                    }
                });

                totalScore += taskCorrectLetters;
                maxTotalScore += taskTotalLetters;

                results.push({
                    ...task,
                    studentAnswers,
                    studentTextAnswer, 
                    taskCorrectLetters,
                    taskTotalLetters
                });
            });

            const percentage = maxTotalScore > 0 ? (totalScore / maxTotalScore) * 100 : 0;
            const now = new Date();
            const timestamp = now.toLocaleString('sk-SK', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const studentName = studentNameInput.value.trim() || 'Anonym';

            exerciseContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            studentNameInput.disabled = true;

            resultsSummary.innerHTML = `
                <p><strong>Názov cvičenia:</strong> ${exerciseTitle}</p>
                <p><strong>Meno žiaka:</strong> ${studentName}</p>
                <p><strong>Bodové hodnotenie:</strong> ${totalScore} b. z ${maxTotalScore} b. (hodnotí sa každé písmeno)</p>
                <p><strong>Percentuálna úspešnosť:</strong> ${percentage.toFixed(1)} %</p>
                <p><strong>Dátum a čas:</strong> ${timestamp}</p>
            `;

            let resultsHTML = "<h3>Detailné odpovede:</h3>";
            results.forEach(res => {
                let symbolClass = '';
                let symbol = '';
                if (res.taskCorrectLetters === res.taskTotalLetters && res.taskTotalLetters > 0) {
                     symbolClass = 'correct'; symbol = '✓';
                } else if (res.taskCorrectLetters === 0) {
                     symbolClass = 'incorrect'; symbol = '✗';
                } else {
                     symbolClass = 'partial'; symbol = '⚠';
                }
                
                resultsHTML += `<div class="result-item ${symbolClass}">`;
                resultsHTML += `<span class="symbol ${symbolClass}">${symbol}</span>`;
                resultsHTML += `<div>
                                    <span><strong>${res.studentTextAnswer}</strong> (${res.taskCorrectLetters}/${res.taskTotalLetters} b.)</span>
                                    ${res.subText ? `<br><span style="font-size:0.8em; color:#666;">${res.subText}</span>` : ''}
                                </div>`;
                if (res.taskCorrectLetters !== res.taskTotalLetters) {
                    resultsHTML += `<span class="correct-answer">(Správne: ${res.fullAnswer})</span>`;
                }
                resultsHTML += `</div>`;
            });
            resultsList.innerHTML = resultsHTML;

            detailedResultsData = {
                title: exerciseTitle,
                name: studentName,
                totalScore,
                maxTotalScore,
                percentage,
                timestamp,
                results
            };
        }
        
        function showDetailedResults() {
            if (!detailedResultsData) {
                alert("Najprv je potrebné cvičenie vyhodnotiť.");
                return;
            }
            const data = detailedResultsData;

            const newWin = window.open('', 'DetailnéVýsledky', 'width=900,height=700,scrollbars=yes,resizable=yes'); 
            if (!newWin) {
                alert("Prosím, povoľte vyskakovacie okná pre zobrazenie detailných výsledkov.");
                return;
            }

            let html = `
                <!DOCTYPE html>
                <html lang="sk">
                <head>
                    <meta charset="UTF-8">
                    <title>Detailné výsledky - ${data.title}</title>
                    <style>
                        body { font-family: Arial, sans-serif; line-height: 1.5; padding: 20px; }
                        h1 { color: #000; border-bottom: 2px solid #000; padding-bottom: 5px; }
                        h2 { margin-top: 30px; border-bottom: 1px solid #ccc; padding-bottom: 3px;}
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 1em;}
                        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; vertical-align: top; }
                        th { background-color: #f0f0f0; }
                        .symbol { font-size: 1.2em; font-weight: bold; text-align: center; }
                        .correct { color: #28a745; }
                        .incorrect { color: #dc3545; }
                        .partial { color: #fd7e14; }
                        .legend { margin-top: 20px; font-size: 0.9em; }
                        @media print {
                            body { padding: 10px; }
                            .no-print { display: none !important; }
                        }
                    </style>
                </head>
                <body class="detail-results-body">
                    <h1>${data.title}</h1>
                    <p><strong>Meno žiaka:</strong> ${data.name}</p>
                    <p><strong>Bodové a percentuálne hodnotenie:</strong> ${data.totalScore} b. z ${data.maxTotalScore} b. (${data.percentage.toFixed(1)}%)</p>
                    <p><strong>Dátum a čas:</strong> ${data.timestamp}</p>

                    <h2>Detailný prehľad</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Zadanie / Preklad</th>
                                <th>Tvoja odpoveď</th>
                                <th>Správna odpoveď</th>
                                <th class="symbol">Výsledok</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.results.forEach(res => {
                let symbolClass = '';
                let symbol = '';
                if (res.taskCorrectLetters === res.taskTotalLetters && res.taskTotalLetters > 0) {
                     symbolClass = 'correct'; symbol = '✓';
                } else if (res.taskCorrectLetters === 0) {
                     symbolClass = 'incorrect'; symbol = '✗';
                } else {
                     symbolClass = 'partial'; symbol = '⚠';
                }
                
                html += `
                    <tr>
                        <td>${res.subText || '–'}</td>
                        <td><strong>${res.studentTextAnswer || '–'}</strong></td>
                        <td><strong>${res.fullAnswer}</strong></td>
                        <td class="symbol ${symbolClass}" style="white-space: nowrap;">${symbol} <span style="font-size: 0.8em; color: #333; margin-left: 8px;">(${res.taskCorrectLetters}/${res.taskTotalLetters} b.)</span></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                    <div class="legend">
                        <p><strong>Vysvetlivky:</strong></p>
                        <ul>
                            <li><span class="symbol correct">✓</span> = Všetky písmená doplnené správne</li>
                            <li><span class="symbol partial">⚠</span> = Čiastočne správne doplnené písmená</li>
                            <li><span class="symbol incorrect">✗</span> = Všetky písmená doplnené nesprávne (alebo prázdne)</li>
                        </ul>
                    </div>
                    <div class="no-print" style="margin-top: 40px;"><p>Túto stránku je možné vytlačiť pomocou Ctrl + P (alebo Command + P).</p></div>
                </body>
                </html>
            `;

            newWin.document.open();
            newWin.document.write(html);
            newWin.document.close();
            newWin.focus(); 
        }
      
    </script>
</body>
</html>
